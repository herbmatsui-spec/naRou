<!DOCTYPE html>
<html lang="ja">
<head>
    <script src="/UIProvider.js"></script>
    <script src="/ui-components-base.js"></script>
    <script src="/log-window.js"></script>
    <script src="/status-bar.js"></script>
    <script src="/item-slot.js"></script>
    <script src="/inventory-grid.js"></script>
    <script src="/skill-node.js"></script>
    <script src="/skill-tree.js"></script>
    <script src="/ui-a11y.js"></script>
    <script src="/ui-performance.js"></script>
    <script>window.UIProvider.init();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elona Scene Demo - 19. 納税と郵便局</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            background: var(--colors-surface-background);
            color: var(--colors-content-text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at top center, #1b2038, #070913);
        }
        .stage-box {
            width: 820px;
            background: var(--colors-surface-surface-low);
            border: 1px solid var(--colors-surface-border);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            overflow: hidden;
            padding: var(--spacing-6);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-4);
        }
        .grid-map {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: var(--spacing-1);
            background: #030712;
            padding: var(--spacing-4);
            border-radius: 12px;
            border: 1px solid var(--colors-surface-border);
            font-size: 32px;
            user-select: none;
        }
        .tile {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            border-radius: 6px;
        }
        .tile-wall { background: rgba(50, 40, 40, 0.5); }
        .tile-floor { color: #4b5563; font-size: 16px; }
        .anim-pulse { animation: pop 1.2s infinite alternate ease-in-out; }
        @keyframes pop {
            0% { transform: scale(1.0); }
            100% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="stage-box">
        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
            <div class="flex items-center gap-3">
                <span class="text-3xl">📮</span>
                <div>
                    <h1 class="text-xl font-bold text-[var(--colors-brand-primary)]">19. 納税と郵便局</h1>
                    <p class="text-xs text-slate-400">毎月の給料箱を受け取り滞納なくしっかり納税</p>
                </div>
            </div>
            <span class="bg-sky-500/20 text-sky-300 px-3 py-1 rounded-full text-xs font-semibold">Scene Demo</span>
        </div>

        <div class="grid-map">
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile anim-pulse">📮</div>
            <div class="tile anim-pulse">📜</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile anim-pulse">⚖️</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile anim-pulse">👮</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile anim-pulse">🧙</div>
            <div class="tile anim-pulse">🪙</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-wall">🧱</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile anim-pulse">👧</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile anim-pulse">📮</div>
            <div class="tile tile-floor">▫️</div>
            <div class="tile tile-floor">▫️</div>

        </div>

        <div id="scene-log-container"></div>
        <script>
            const logWin = new LogWindow();
            document.getElementById("scene-log-container").appendChild(logWin.render({
                messages: [
                    { text: "📜 給料箱📮からプラチナ硬貨を回収し、税務署⚖️でカルマを高める納税！", type: "story" }
                ]
            }));
        </script>
    </div>
</body>
</html>
