<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>LightingSystem2D Demo</title>
  <style>
    body { background:#0a0a10; display:flex; justify-content:center; align-items:center; height:100vh; }
    canvas { background:#08080c; border:1px solid #334; }
  </style>
</head>
<body>
  <canvas id="light-canvas" width="512" height="256"></canvas>
  <script type="module">
    import { LightingSystem2D } from "../src/render/LightingSystem2D.js";
    const canvas = document.getElementById('light-canvas');
    const lighting = new LightingSystem2D(canvas);
    // Add a few static lights for demo
    lighting.addLight(150, 120, 80, 'rgba(255,180,80,0.8)');
    lighting.addLight(380, 80, 100, 'rgba(80,200,255,0.7)');
    // render loop (no updates needed)
    function render() {
      // dark background drawn by the system itself
      lighting.render();
      requestAnimationFrame(render);
    }
    render();
    // Add light on click
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      lighting.addLight(x, y, 70, 'rgba(255,255,180,0.6)');
    });
  </script>
</body>
</html>
