<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ParticleSystem2D Demo</title>
  <style>
    body { background:#0a0a10; display:flex; justify-content:center; align-items:center; height:100vh; }
    canvas { background:#08080c; border:1px solid #334; }
  </style>
</head>
<body>
  <canvas id="particle-canvas" width="512" height="256"></canvas>
  <script type="module">
    import { ParticleSystem2D } from "../src/render/ParticleSystem2D.js";
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const ps = new ParticleSystem2D(ctx);

    // Animation loop
    let last = performance.now();
    function loop(now) {
      const dt = (now - last) / 1000; // seconds
      last = now;
      // update & clear
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ps.update(dt);
      ps.render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Emit particles on click
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      // Random effect for demonstration
      const effects = ['dust', 'spark', 'magic', 'heal', 'damage'];
      const effect = effects[Math.floor(Math.random() * effects.length)];
      ps.emit({ type: effect, x, y, count: 10 });
    });
  </script>
</body>
</html>
