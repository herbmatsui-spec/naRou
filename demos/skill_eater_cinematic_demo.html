<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Eater — Cinematic Demo | naRou: 九世界転移譚</title>
  <meta name="description" content="Aの世界（スキル喰い）の実際のゲームプレイに近い3分間のシネマティックデモ。適性検査、スラム探索、戦闘、《喰らい》システムを体験。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Fira+Code:wght@400;600&family=Cinzel:wght@600;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #04060b;
      --bg-dark: #0a0e18;
      --bg-panel: rgba(10, 14, 26, 0.92);
      --bg-panel-light: rgba(20, 28, 50, 0.85);
      --border-gold: rgba(255, 200, 40, 0.35);
      --border-gold-bright: rgba(255, 215, 0, 0.7);
      --border-cyan: rgba(0, 220, 255, 0.4);
      --border-red: rgba(255, 60, 80, 0.5);
      --gold: #ffd700;
      --gold-dim: #c9a800;
      --cyan: #00dcff;
      --cyan-dim: #00a8c4;
      --magenta: #ff3cff;
      --crimson: #ff3050;
      --emerald: #2bff88;
      --purple: #b050ff;
      --orange: #ff8c20;
      --blue: #3888ff;
      --text: #e8ecf4;
      --text-dim: #7888a0;
      --text-dark: #3a4860;
      --font: 'Outfit', 'Noto Sans JP', sans-serif;
      --font-jp: 'Noto Sans JP', sans-serif;
      --font-mono: 'Fira Code', monospace;
      --font-title: 'Cinzel', serif;
      --hp-green: #44ff88;
      --hp-red: #ff4060;
      --mp-blue: #44aaff;
      --exp-purple: #c888ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-void); color: var(--text); font-family: var(--font); }

    #game-viewport { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; }

    /* TOP HUD */
    #top-hud {
      position: absolute; top: 0; left: 0; right: 0; height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
      background: linear-gradient(180deg, rgba(4,6,11,0.95) 0%, rgba(4,6,11,0.6) 100%);
      border-bottom: 1px solid var(--border-gold); z-index: 100; font-size: 13px;
    }
    #top-hud .hud-left { display: flex; gap: 16px; align-items: center; }
    #top-hud .hud-right { display: flex; gap: 16px; align-items: center; }
    .hud-label { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .hud-value { color: var(--gold); font-family: var(--font-mono); font-weight: 600; font-size: 12px; }
    .hud-world-name { font-family: var(--font-title); color: var(--gold); font-size: 14px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,215,0,0.3); }
    .hud-phase { background: rgba(255,215,0,0.12); border: 1px solid var(--border-gold); border-radius: 6px; padding: 2px 10px; font-size: 11px; color: var(--gold); font-family: var(--font-mono); }

    /* MAP AREA */
    #map-area { flex: 1; position: relative; margin: 48px 0 0 0; display: flex; overflow: hidden; }
    #map-canvas { flex: 1; position: relative; font-family: var(--font-mono); font-size: 15px; line-height: 19px; padding: 12px; overflow: hidden; white-space: pre; background: var(--bg-dark); letter-spacing: 2px; }

    /* SIDE PANEL */
    #side-panel { position: absolute; top: 52px; right: 4px; width: 260px; bottom: 180px; display: flex; flex-direction: column; gap: 5px; z-index: 50; pointer-events: none; overflow-y: auto; }
    .status-card { background: var(--bg-panel); border: 1px solid var(--border-gold); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(12px); }
    .status-card h3 { font-size: 10px; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; font-family: var(--font-mono); }
    .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; font-size: 12px; }
    .stat-label { color: var(--text-dim); }
    .stat-value { font-family: var(--font-mono); font-weight: 600; }
    .bar-container { width: 100%; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; margin: 2px 0 5px 0; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease, background 0.3s ease; }
    .bar-hp { background: linear-gradient(90deg, var(--hp-green), #22cc66); }
    .bar-mp { background: linear-gradient(90deg, var(--mp-blue), #2288ff); }
    .bar-addiction { background: linear-gradient(90deg, var(--purple), var(--crimson)); }
    .bar-memory { background: linear-gradient(90deg, var(--cyan), var(--blue)); }

    .skill-slot { display: flex; align-items: center; gap: 6px; padding: 3px 6px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 5px; margin-bottom: 3px; font-size: 11px; }
    .skill-icon { width: 20px; height: 20px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
    .skill-tier-common { background: rgba(120,140,170,0.2); border: 1px solid rgba(120,140,170,0.3); }
    .skill-tier-rare { background: rgba(50,130,255,0.2); border: 1px solid rgba(50,130,255,0.4); }
    .skill-tier-unique { background: rgba(200,100,255,0.2); border: 1px solid rgba(200,100,255,0.4); }
    .skill-tier-concept { background: rgba(255,60,80,0.2); border: 1px solid rgba(255,60,80,0.4); }
    .skill-name { color: var(--text); flex: 1; }
    .skill-mem { color: var(--text-dim); font-family: var(--font-mono); font-size: 9px; }

    /* BOTTOM PANEL */
    #bottom-panel { position: absolute; bottom: 0; left: 0; right: 0; height: 180px; background: linear-gradient(0deg, rgba(4,6,11,0.98) 0%, rgba(4,6,11,0.85) 100%); border-top: 1px solid var(--border-gold); display: flex; z-index: 100; }
    #log-window { flex: 1; padding: 8px 14px; overflow-y: auto; font-size: 12px; line-height: 1.65; scroll-behavior: smooth; }
    #log-window::-webkit-scrollbar { width: 3px; }
    #log-window::-webkit-scrollbar-track { background: transparent; }
    #log-window::-webkit-scrollbar-thumb { background: var(--border-gold); border-radius: 2px; }
    .log-line { margin-bottom: 1px; opacity: 0; animation: logFadeIn 0.3s ease forwards; }
    @keyframes logFadeIn { to { opacity: 1; } }
    .log-system { color: var(--cyan); }
    .log-combat { color: var(--crimson); }
    .log-skill { color: var(--magenta); }
    .log-success { color: var(--emerald); }
    .log-warning { color: var(--orange); }
    .log-dialogue { color: var(--gold); }
    .log-lore { color: var(--purple); }
    .log-meta { color: var(--cyan); font-style: italic; }

    #cmd-area { width: 240px; border-left: 1px solid var(--border-gold); padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    #cmd-area h4 { font-size: 9px; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 3px; }
    .cmd-btn { background: rgba(255,215,0,0.06); border: 1px solid var(--border-gold); border-radius: 5px; color: var(--text); font-family: var(--font); font-size: 11px; padding: 5px 10px; cursor: pointer; transition: all 0.2s ease; text-align: left; }
    .cmd-btn:hover { background: rgba(255,215,0,0.15); border-color: var(--border-gold-bright); transform: translateX(2px); }
    .cmd-btn.active { background: rgba(255,215,0,0.2); border-color: var(--gold); color: var(--gold); }
    .cmd-btn.danger { border-color: var(--border-red); color: var(--crimson); }

    /* ANALYSIS HUD */
    #analysis-hud { position: absolute; top: 56px; left: 8px; width: 300px; background: var(--bg-panel); border: 1px solid var(--border-cyan); border-radius: 10px; padding: 12px; z-index: 80; display: none; backdrop-filter: blur(16px); box-shadow: 0 0 30px rgba(0,220,255,0.1); }
    #analysis-hud.visible { display: block; animation: hudSlideIn 0.4s ease; }
    @keyframes hudSlideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    #analysis-hud h3 { font-size: 10px; color: var(--cyan); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    #analysis-hud h3::before { content: ''; width: 6px; height: 6px; background: var(--cyan); border-radius: 50%; animation: analysisPulse 1s ease infinite; }
    @keyframes analysisPulse { 0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--cyan); } 50% { opacity: 0.4; } }
    .analysis-row { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .analysis-label { color: var(--text-dim); }
    .analysis-value { font-family: var(--font-mono); }
    .analysis-weakness { color: var(--crimson); font-weight: 700; }
    .analysis-skill-list { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(0,220,255,0.15); }
    .analysis-skill-item { display: flex; align-items: center; gap: 5px; padding: 3px 5px; margin-bottom: 2px; background: rgba(0,220,255,0.05); border-radius: 3px; font-size: 10px; }
    .analysis-devour-rate { margin-top: 8px; padding: 6px; background: rgba(255,60,255,0.08); border: 1px solid rgba(255,60,255,0.2); border-radius: 5px; text-align: center; font-size: 11px; }
    .devour-rate-num { font-size: 22px; font-family: var(--font-mono); font-weight: 700; color: var(--magenta); }

    /* FLOATING TEXT */
    .float-text { position: absolute; font-family: var(--font-mono); font-weight: 700; font-size: 18px; pointer-events: none; z-index: 200; animation: floatUp 1.2s ease-out forwards; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
    @keyframes floatUp { 0% { transform: translateY(0) scale(1.2); opacity: 1; } 100% { transform: translateY(-50px) scale(0.8); opacity: 0; } }
    .float-damage { color: var(--crimson); }
    .float-heal { color: var(--hp-green); }
    .float-devour { color: var(--magenta); font-size: 22px; }
    .float-skill { color: var(--cyan); }

    /* SCREEN EFFECTS */
    #screen-effects { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 300; }
    .vignette { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%); }
    .scanline { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px); }
    .shake { animation: screenShake 0.3s ease; }
    @keyframes screenShake { 0%, 100% { transform: translate(0); } 20% { transform: translate(-4px, 2px); } 40% { transform: translate(3px, -3px); } 60% { transform: translate(-2px, 4px); } 80% { transform: translate(4px, -1px); } }
    .flash-red { animation: flashRed 0.5s ease; }
    @keyframes flashRed { 0% { background: rgba(255,40,60,0.3); } 100% { background: transparent; } }
    .flash-cyan { animation: flashCyan 0.5s ease; }
    @keyframes flashCyan { 0% { background: rgba(0,220,255,0.2); } 100% { background: transparent; } }
    .flash-magenta { animation: flashMagenta 0.6s ease; }
    @keyframes flashMagenta { 0% { background: rgba(255,60,255,0.3); } 100% { background: transparent; } }
    .glitch-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; animation: glitchFx 0.15s steps(3) 6; }
    @keyframes glitchFx { 0% { clip-path: inset(20% 0 60% 0); transform: translateX(-3px); background: rgba(0,220,255,0.05); } 33% { clip-path: inset(50% 0 10% 0); transform: translateX(3px); background: rgba(255,60,255,0.05); } 66% { clip-path: inset(30% 0 40% 0); transform: translateX(-2px); background: rgba(255,215,0,0.05); } 100% { clip-path: inset(0); transform: none; background: transparent; } }

    /* DIALOGUE BOX */
    #dialogue-box { position: absolute; bottom: 184px; left: 50%; transform: translateX(-50%); width: min(680px, 90vw); background: var(--bg-panel); border: 1px solid var(--border-gold); border-radius: 12px; padding: 16px 20px; z-index: 150; display: none; backdrop-filter: blur(16px); box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
    #dialogue-box.visible { display: block; animation: dialogIn 0.35s ease; }
    @keyframes dialogIn { from { transform: translateX(-50%) translateY(10px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
    .dialog-speaker { font-size: 11px; color: var(--gold); font-weight: 700; margin-bottom: 5px; font-family: var(--font-mono); }
    .dialog-text { font-size: 14px; line-height: 1.8; font-family: var(--font-jp); color: var(--text); }
    .dialog-choices { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
    .dialog-choice { background: rgba(255,215,0,0.06); border: 1px solid var(--border-gold); border-radius: 7px; padding: 7px 12px; color: var(--text); font-size: 12px; cursor: pointer; transition: all 0.2s ease; }
    .dialog-choice:hover { background: rgba(255,215,0,0.15); border-color: var(--gold); transform: translateX(4px); }
    .dialog-choice.meta-optimal { border-color: var(--border-cyan); position: relative; }
    .dialog-choice.meta-optimal::after { content: '★ META'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 8px; color: var(--cyan); font-family: var(--font-mono); letter-spacing: 1px; }

    /* CENTER NOTIFY */
    #center-notify { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 250; pointer-events: none; display: none; }
    #center-notify.visible { display: block; animation: notifyPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes notifyPop { from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    .notify-title { font-family: var(--font-title); font-size: 32px; color: var(--gold); text-shadow: 0 0 30px rgba(255,215,0,0.5); letter-spacing: 3px; margin-bottom: 6px; }
    .notify-subtitle { font-size: 13px; color: var(--text-dim); letter-spacing: 2px; }

    /* SCENE TRANSITION */
    #scene-transition { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-void); z-index: 400; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; }
    #scene-transition.active { opacity: 1; pointer-events: auto; }
    .scene-label { font-family: var(--font-title); font-size: 26px; color: var(--gold); letter-spacing: 4px; text-shadow: 0 0 20px rgba(255,215,0,0.4); }
    .scene-desc { font-size: 13px; color: var(--text-dim); margin-top: 8px; letter-spacing: 2px; }

    /* ADDICTION WARNING */
    .addiction-warning { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(180, 30, 60, 0.15); border: 2px solid rgba(255, 60, 80, 0.6); border-radius: 14px; padding: 18px 26px; z-index: 210; text-align: center; backdrop-filter: blur(8px); display: none; animation: warnPulse 0.8s ease; }
    @keyframes warnPulse { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.05); } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    .addiction-warning.visible { display: block; }
    .addiction-warning h2 { font-size: 16px; color: var(--crimson); font-family: var(--font-mono); margin-bottom: 6px; }
    .addiction-warning p { font-size: 12px; color: var(--text); line-height: 1.6; }

    /* PROGRESS BAR */
    #demo-progress { position: absolute; top: 48px; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.05); z-index: 110; }
    #demo-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--gold), var(--magenta)); transition: width 0.5s linear; }

    /* PLAY OVERLAY */
    #play-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(4,6,11,0.92); z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: opacity 0.5s ease; }
    #play-overlay.hidden { opacity: 0; pointer-events: none; }
    .play-title { font-family: var(--font-title); font-size: 42px; color: var(--gold); text-shadow: 0 0 40px rgba(255,215,0,0.4); letter-spacing: 5px; margin-bottom: 6px; }
    .play-subtitle { font-size: 15px; color: var(--text-dim); margin-bottom: 36px; letter-spacing: 3px; font-family: var(--font-jp); }
    .play-btn { width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--gold); background: rgba(255,215,0,0.08); display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; animation: playPulse 2s ease infinite; }
    .play-btn:hover { background: rgba(255,215,0,0.2); transform: scale(1.1); box-shadow: 0 0 40px rgba(255,215,0,0.3); }
    @keyframes playPulse { 0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.15); } 50% { box-shadow: 0 0 30px rgba(255,215,0,0.3); } }
    .play-btn svg { width: 30px; height: 30px; fill: var(--gold); margin-left: 4px; }
    .play-hint { margin-top: 22px; font-size: 11px; color: var(--text-dark); letter-spacing: 2px; }
  </style>
</head>
<body>
  <div id="game-viewport">
    <div id="top-hud">
      <div class="hud-left">
        <span class="hud-world-name">W4: SKILL EATER</span>
        <span class="hud-phase" id="hud-phase">Phase 0</span>
      </div>
      <div class="hud-right">
        <span class="hud-label">Floor</span>
        <span class="hud-value" id="hud-floor">Midas Corp. HQ</span>
        <span class="hud-label">Turn</span>
        <span class="hud-value" id="hud-turn">1</span>
        <span class="hud-label">Meta</span>
        <span class="hud-value" id="hud-meta">0</span>
      </div>
    </div>
    <div id="demo-progress"><div id="demo-progress-fill"></div></div>
    <div id="map-area"><div id="map-canvas"></div></div>
    <div id="side-panel">
      <div class="status-card" id="player-status">
        <h3>▷ Player Status</h3>
        <div class="stat-row"><span class="stat-label">HP</span><span class="stat-value" id="stat-hp" style="color:var(--hp-green)">240 / 240</span></div>
        <div class="bar-container"><div class="bar-fill bar-hp" id="bar-hp" style="width:100%"></div></div>
        <div class="stat-row"><span class="stat-label">MP</span><span class="stat-value" id="stat-mp" style="color:var(--mp-blue)">80 / 80</span></div>
        <div class="bar-container"><div class="bar-fill bar-mp" id="bar-mp" style="width:100%"></div></div>
        <div class="stat-row"><span class="stat-label">ATK</span><span class="stat-value" id="stat-atk">18</span></div>
        <div class="stat-row"><span class="stat-label">DEF</span><span class="stat-value" id="stat-def">12</span></div>
        <div class="stat-row"><span class="stat-label">INT</span><span class="stat-value" id="stat-int">22</span></div>
        <div class="stat-row"><span class="stat-label">解析Lv</span><span class="stat-value" id="stat-analysis" style="color:var(--cyan)">3</span></div>
      </div>
      <div class="status-card" id="memory-status">
        <h3>▷ Brain Memory</h3>
        <div class="stat-row"><span class="stat-label">使用量</span><span class="stat-value" id="stat-memory" style="color:var(--cyan)">1 / 10</span></div>
        <div class="bar-container"><div class="bar-fill bar-memory" id="bar-memory" style="width:10%"></div></div>
        <div class="stat-row"><span class="stat-label">精神侵食</span><span class="stat-value" id="stat-addiction" style="color:var(--purple)">0 / 100</span></div>
        <div class="bar-container"><div class="bar-fill bar-addiction" id="bar-addiction" style="width:0%"></div></div>
      </div>
      <div class="status-card" id="skill-slots">
        <h3>▷ Devoured Skills</h3>
        <div id="skill-list">
          <div class="skill-slot"><div class="skill-icon skill-tier-common">🔍</div><span class="skill-name">《解析》</span><span class="skill-mem">1 MEM</span></div>
        </div>
      </div>
    </div>
    <div id="analysis-hud"><h3>ANALYSIS SCANNER</h3><div id="analysis-content"></div></div>
    <div id="dialogue-box">
      <div class="dialog-speaker" id="dialog-speaker"></div>
      <div class="dialog-text" id="dialog-text"></div>
      <div class="dialog-choices" id="dialog-choices"></div>
    </div>
    <div id="center-notify"><div class="notify-title" id="notify-title"></div><div class="notify-subtitle" id="notify-subtitle"></div></div>
    <div class="addiction-warning" id="addiction-warning"><h2>⚠ 精神侵食警告</h2><p id="addiction-text"></p></div>
    <div id="bottom-panel">
      <div id="log-window"></div>
      <div id="cmd-area"><h4>Commands</h4><div id="cmd-buttons"></div></div>
    </div>
    <div id="scene-transition"><div class="scene-label" id="scene-label"></div><div class="scene-desc" id="scene-desc"></div></div>
    <div id="screen-effects"><div class="vignette"></div><div class="scanline"></div></div>
    <div id="play-overlay" onclick="startDemo()">
      <div class="play-title">SKILL EATER</div>
      <div class="play-subtitle">Aの世界 — スキル喰い・解析チート</div>
      <div class="play-btn"><svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg></div>
      <div class="play-hint">CLICK TO START DEMO ▶</div>
    </div>
  </div>

<script>
const state = {

// MAP
function renderMap(map, ents=[]) {
  let h='';
  for(let y=0;y<map.length;y++){
    for(let x=0;x<map[y].length;x++){
      const e=ents.find(e=>e.x===x&&e.y===y);
      if(e) h+=`<span style="color:${e.fg};text-shadow:0 0 8px ${e.fg}40">${e.ch}</span>`;
      else{const t=map[y][x]; h+=`<span style="color:${t.fg}">${t.ch}</span>`;}
    }
    h+='\n';
  }
  $('map-canvas').innerHTML=h;
}

function makeMap(W,H,wallCh='█',wallFg='#2a2838',floorCh='·',floorFg='#3a3850',innerFn=null) {
  const m=[];
  for(let y=0;y<H;y++){m[y]=[];for(let x=0;x<W;x++){
    if(y===0||y===H-1||x===0||x===W-1) m[y][x]={ch:wallCh,fg:wallFg};
    else if(innerFn) m[y][x]=innerFn(x,y)||{ch:floorCh,fg:floorFg};
    else m[y][x]={ch:floorCh,fg:floorFg};
  }}
  return m;
}

function officeMap() {
  return makeMap(42,20,'█','#2a2838','·','#3a3850',(x,y)=>{
    if((x===10||x===20||x===30)&&y!==5&&y!==10&&y!==15) return {ch:'│',fg:'#2a2838'};
    if(y===7&&x>1&&x<9) return {ch:'─',fg:'#2a2838'};
    if(y===13&&x>11&&x<19) return {ch:'─',fg:'#2a2838'};
    return null;
  });
}

function slumMap() {
  return makeMap(45,22,'▓','#1a1828','·','#2a2840',(x,y)=>{
    if(Math.random()<0.04) return {ch:'░',fg:'#22203a'};
    if((x===15||x===30)&&(y>2&&y<8||y>12&&y<18)) return {ch:'▓',fg:'#1a1828'};
    if(Math.random()<0.02) return {ch:'~',fg:'#1a3050'};
    const fc=['·','·','.',','];
    return {ch:fc[Math.floor(Math.random()*fc.length)],fg:'#2a2840'};
  });
}

function battleMap() {
  return makeMap(45,22,'▓','#201028','·','#2a1a38',(x,y)=>{
    const fc=['·','·','·','.'];
    return {ch:fc[Math.floor(Math.random()*fc.length)],fg:'#2a1a38'};
  });
}

  floatText('+ATK','float-skill',200,180);
  log('  → 《初級剣術》獲得！メモリ:2/10, ATK+5','log-success');
  await sleep(400);

  log('  → スキル喪失ショック！DEF/ATK低下','log-combat');
  await sleep(300);

  nextTurn(); enemy.hp=0; floatText('-47','float-damage',510,250); shake(); fx('flash-red');
  log(`【Turn ${state.turn}】止めの一撃！ 変異スラムラットは倒れた！`,'log-combat');
  await sleep(500);
  setAnalysis(false);
  log('【戦利品】SCRAP_BEAST_FANG, SCRAP_AGILITY_FRAGMENT','log-success');
  await sleep(400);
}

async function scene5() {
  state.floor='ミダスタワー裏路地 — ボス戦'; updateHud();

  const m=battleMap();
  const boss={x:32,y:11,hp:5000,maxHp:5000};
  const drawBoss=()=>renderMap(m,[{x:8,y:11,ch:'@',fg:'#ffd700'},{x:boss.x,y:boss.y,ch:'💀',fg:'#ffd700'},{x:20,y:5,ch:'⚠',fg:'#ff8c20'}]);
  drawBoss();

  log('【BOSS】査定課長ゴルドー HP:5000 ATK:250','log-combat');
  log('  → スキル:《黄金重力圧（ゴールド・プレス）》','log-combat');
  await sleep(400);
  await dialog('ゴルドー','逃げたと思ったか？クビになった分際で横領まで……ミダスの裁きを受けろ！');

  // Analyze boss
  nextTurn();
  log(`【Turn ${state.turn}】《解析》→ ゴルドーの構造スキャン`,'log-skill');

  setAnalysis(true,`

    <div class="analysis-row"><span class="analysis-label">弱点</span><span class="analysis-value analysis-weakness">Magic/ArmorPierce</span></div>
    <div class="analysis-skill-list">
      <div style="color:var(--cyan);font-size:9px;margin-bottom:3px;">▷ SKILLS</div>
      <div class="analysis-skill-item"><span style="color:var(--blue)">🛡 鋼鉄の皮膚</span><span style="color:var(--text-dim);margin-left:auto">Rare/85kG</span></div>
      <div class="analysis-skill-item"><span style="color:var(--orange)">🔥 業火球</span><span style="color:var(--text-dim);margin-left:auto">Rare/120kG</span></div>
      <div class="analysis-skill-item" style="border:1px solid rgba(200,100,255,0.3)"><span style="color:var(--purple)">🔒 暗号化プロテクト</span><span style="color:var(--text-dim);margin-left:auto">???</span></div>
    </div>
    <div class="analysis-devour-rate">
      <div style="color:var(--text-dim);font-size:9px;">DEVOUR RATE</div>
      <div class="devour-rate-num">60%</div>
      <div style="color:var(--orange);font-size:8px;">⚠ Rare: ペナルティあり</div>
    </div>`);
  log('[SCAN] Rareスキル2個 + 暗号化1個検出','log-system');
  log('  → 暗号化プロテクト検出 ── ハッキングで開示可能','log-warning');
  await sleep(1200);

  // Hack
  nextTurn();
  log(`【Turn ${state.turn}】《ハッキング》発動！ 防壁侵入中...`,'log-skill');
  fx('flash-cyan'); await sleep(400);
  for(let i=0;i<3;i++){fx('glitch-overlay');await sleep(150);}
  log('  → 防壁突破！ 暗号化スキルの正体:《黄金錬成》(Unique)','log-success');
  await sleep(800);

  // Environmental trap
  nextTurn();

  fx('flash-red'); shake(); await sleep(300);
  boss.hp-=120; floatText('-120','float-damage',500,230);
  log('【環境トラップ】崩壊！120ダメージ＆スタン！','log-combat');
  await sleep(600);

  // Devour 鋼鉄の皮膚
  nextTurn();
  log(`【Turn ${state.turn}】スタン中に《喰らい》！ 対象:《鋼鉄の皮膚》`,'log-skill');
  fx('flash-magenta'); shake(); await sleep(500);
  for(let i=0;i<3;i++){fx('glitch-overlay');await sleep(120);}

  log('【捕食成功！】《鋼鉄の皮膚》を喰らい尽くした！','log-success');
  state.player.skills.push({id:'iron',name:'《鋼鉄の皮膚》',tier:'rare',icon:'🛡',mem:2});
  state.player.memoryUsed=4; state.player.def+=15; state.player.addiction+=15; updateStats(); updateSkills();
  floatText('+DEF','float-skill',200,180);
  await sleep(400);

  // Synergy!
  log('★ シナジー！【Sword】×【Defense】→《剛剣両断》！','log-success');
  fx('flash-magenta'); shake();
  boss.hp-=350; floatText('SYNERGY -350!','float-devour',400,200);
  log('【連鎖シナジー】防御貫通の一撃！追加350ダメージ！','log-success');
  await sleep(700);
  log('※精神侵食度上昇(15/100)','log-warning');
  await sleep(400);

  // Boss charge
  nextTurn();
  log(`【Turn ${state.turn}】ゴルドー:《黄金重力圧》チャージ開始！2ターン後に壊滅攻撃！`,'log-combat');
  await sleep(400);

  // Devour 業火球
  nextTurn(); boss.hp-=200; floatText('-200','float-damage',510,250); shake();
  log(`【Turn ${state.turn}】通常攻撃 → 200ダメージ (残:${boss.hp})`,'log-combat');
  await sleep(400);

  nextTurn();
  log(`【Turn ${state.turn}】《喰らい》→ 《業火球》(成功率:85%)`,'log-skill');
  fx('flash-magenta'); shake(); await sleep(400);
  for(let i=0;i<4;i++){fx('glitch-overlay');await sleep(100);}
  floatText('DEVOUR!','float-devour',360,210); await sleep(300);

  log('【捕食成功！】《業火球》喰らい尽くした！','log-success');
  state.player.skills.push({id:'hell',name:'《業火球》',tier:'rare',icon:'🔥',mem:2});
  state.player.memoryUsed=6; state.player.int+=10; state.player.addiction+=20; updateStats(); updateSkills();
  floatText('+INT','float-skill',200,170);
  await sleep(400);
  log(`※精神侵食度上昇(${state.player.addiction}/100)`,'log-warning');
  await sleep(300);

  // Final unique devour
  nextTurn(); setAnalysis(false);
  log(`【Turn ${state.turn}】最終手段 ── Unique《黄金錬成》を《喰らい》！(成功率:45%)`,'log-skill');
  await sleep(300);
  log('  ⚠ Uniqueスキル捕食：精神侵食リスク極大','log-warning');
  fx('flash-magenta'); shake(); await sleep(500);
  for(let i=0;i<6;i++){fx('glitch-overlay');await sleep(80);}
  shake(); await sleep(300);

  floatText('UNIQUE DEVOUR!!','float-devour',300,200);
  fx('flash-magenta'); fx('flash-cyan'); await sleep(500);

  log('【捕食成功！！】《黄金錬成》(Unique)を完全に喰らい尽くした！！','log-success');
  state.player.skills.push({id:'gold',name:'《黄金錬成》',tier:'unique',icon:'👑',mem:4});
  state.player.memoryUsed=10; state.player.addiction+=40; updateStats(); updateSkills();
  await sleep(400);
  log('  → メモリ: 10/10 ── 脳内メモリ限界！','log-warning');
  await sleep(300);

  // Addiction warning
  $('addiction-text').textContent=`精神侵食度 ${state.player.addiction}/100 ── Uniqueスキル保持により急速に精神が侵食されています。`;
  $('addiction-warning').classList.add('visible');
  fx('flash-red');
  log(`【精神侵食警告！】侵食度 ${state.player.addiction}/100`,'log-warning');
  await sleep(2000);
  $('addiction-warning').classList.remove('visible');

  boss.hp=0;
  log('  → ゴルドーの全スキル消滅 →「空っぽ（Husk）」','log-lore');
  await sleep(400);
  await dialog('ゴルドー [HUSK]','な……なんだ……お前は……何者だ……オレの……スキルを……返せ……');
  await sleep(500);
  log('【BOSS DEFEATED】査定課長ゴルドー 撃破！','log-success');
  await notify('BOSS CLEAR','査定課長ゴルドー 撃破',1800);
  await sleep(300);
}

async function startDemo() {
  $('play-overlay').classList.add('hidden');
  state.demoRunning=true;
  startProgress(); updateHud(); updateStats(); updateSkills();
  await sleep(400);
  await scene0(); await sleep(300);
  await scene1(); await sleep(300);
  await scene2(); await sleep(300);
  await scene3(); await sleep(300);
