<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>FluidRenderer2D Demo</title>
  <style>
    body { background:#0a0a10; display:flex; justify-content:center; align-items:center; height:100vh; }
    canvas { background:#08080c; border:1px solid #334; }
  </style>
</head>
<body>
  <canvas id="fluid-canvas" width="512" height="256"></canvas>
  <script type="module">
    import { FluidRenderer2D } from "../src/render/FluidRenderer2D.js";
    const canvas = document.getElementById('fluid-canvas');
    const fluid = new FluidRenderer2D(canvas);
    // Animation loop
    let last = performance.now();
    function loop(now) {
      const dt = (now - last) / 1000;
      last = now;
      fluid.update(dt);
      // clear canvas (dark background kept inside render)
      fluid.render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    // Add a metaball on click
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      fluid.addParticle(x, y, 30 + Math.random() * 20);
    });
  </script>
</body>
</html>
