<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>naRou: Masterpiece Edition (Canvas 2D & WebAudio)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/design_tokens.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="theme.css">
  <script src="https://cdn.pixijs.com/pixi.js"></script>
  <script type="module" src="demos/lib/TileAtlas.js"></script>
  <script type="module" src="demos/lib/LightingSystem.js"></script>
  <script type="module" src="demos/lib/ParticleSystem.js"></script>
  <script type="module" src="demos/lib/PostProcessManager.js"></script>
  <script type="module" src="demos/lib/ScreenShake.js"></script>
  <script type="module" src="demos/lib/EnvironmentShader.js"></script>
  <script type="module" src="demos/lib/FluidRenderer.js"></script>
  <script type="module" src="demos/lib/DecalSystem.js"></script>
  <script type="module" src="demos/lib/BoidSystem.js"></script>
  <style>
    /* Brand UI variables and theme variants are provided by web/theme.css
       (auto-generated from design_tokens.json). Theme switching sets
       document.documentElement.dataset.theme. */

    /* Step 65 & 66: バネ物理（Spring physics）UIアニメーション */
    .spring-anim {
      animation: springBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes springBounce {
      0% { transform: scale(0.92) translateY(8px); opacity: 0; }
      70% { transform: scale(1.03) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Step 68: ボタン波紋（Ripple）とホバーグロー */
    .hotbar-btn, .tab-btn, .dpad-btn, .audio-btn {
      position: relative;
      overflow: hidden;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hotbar-btn:active, .dpad-btn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }
    .ripple-effect {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: scale(0);
      animation: ripple 0.5s ease-out;
      pointer-events: none;
    }
    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* Step 71: Typewriter + Bounce 通知アニメーション */
    .notif-bounce {
      animation: notifAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes notifAppear {
      from { transform: translateY(-16px) scale(0.8); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding: 12px;
    }

    /* === HEADER === */
    header {
      width: 100%;
      max-width: 1280px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .game-logo {
      font-family: var(--font-title);
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-version {
      font-size: 0.65rem;
      background: rgba(229, 169, 59, 0.2);
      border: 1px solid var(--primary-accent);
      color: var(--primary-accent);
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      font-family: var(--font-main);
    }

    .header-status {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 0.85rem;
    }

    .status-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .audio-btn {
      background: rgba(229, 169, 59, 0.15);
      border: 1px solid var(--primary-accent);
      color: var(--primary-accent);
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .audio-btn:hover {
      background: var(--primary-accent);
      color: #000;
      box-shadow: 0 0 12px rgba(229, 169, 59, 0.6);
    }

    .theme-switch {
      display: flex;
      gap: 4px;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 3px 6px;
    }
    .theme-switch button {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      padding: 3px 5px;
      transition: all 0.2s ease;
      filter: grayscale(0.4);
      opacity: 0.7;
    }
    .theme-switch button:hover {
      opacity: 1;
      filter: none;
      background: rgba(255, 255, 255, 0.1);
    }
    .theme-switch button[aria-pressed="true"] {
      opacity: 1;
      filter: none;
      border-color: var(--primary-accent);
      box-shadow: 0 0 10px rgba(229, 169, 59, 0.5);
    }

    /* === MAIN LAYOUT === */
    .main-container {
      width: 100%;
      max-width: 1280px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      height: calc(100vh - 100px);
      min-height: 640px;
    }

    /* === CANVAS VIEWPORT === */
    .viewport-panel {
      position: relative;
      background: #000;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    /* Canvas Overlay HUD */
    .hud-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .vitals-card {
      background: rgba(10, 14, 25, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border);
      padding: 10px 14px;
      border-radius: 8px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: auto;
    }

    .vital-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
    }

    .vital-label {
      width: 24px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .vital-bar-container {
      flex: 1;
      height: 10px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .vital-bar {
      height: 100%;
      transition: width 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .bar-hp { background: linear-gradient(90deg, #27ae60, #2ecc71); box-shadow: 0 0 8px rgba(46, 204, 113, 0.5); }
    .bar-mp { background: linear-gradient(90deg, #2980b9, #3498db); box-shadow: 0 0 8px rgba(52, 152, 219, 0.5); }
    .bar-hunger { background: linear-gradient(90deg, #d35400, #e67e22); }

    .vital-val {
      font-size: 0.7rem;
      font-weight: 600;
      width: 65px;
      text-align: right;
    }

    /* Action Hotbar */
    .hotbar-container {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(10, 14, 25, 0.9);
      backdrop-filter: blur(12px);
      padding: 6px 12px;
      border-radius: 24px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    .hotbar-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .hotbar-btn:hover {
      background: var(--primary-accent);
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(229, 169, 59, 0.5);
    }
    .hotbar-btn .key-tag {
      background: rgba(0, 0, 0, 0.4);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.65rem;
      color: #ffd700;
    }

    /* === SIDEBAR PANELS === */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }

    .panel-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .tabs-header {
      display: flex;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(0, 0, 0, 0.2);
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .tab-btn.active {
      color: var(--primary-accent);
      border-bottom: 2px solid var(--primary-accent);
      background: rgba(229, 169, 59, 0.08);
    }

    .tab-content {
      padding: 10px;
      flex: 1;
      overflow-y: auto;
      font-size: 0.8rem;
    }

    /* Item & Log Lists */
    .item-list, .log-list, .quest-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      font-size: 0.75rem;
      transition: background 0.15s ease;
    }
    .item-entry:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--panel-border-glow);
    }
    .item-entry.equipped {
      border-left: 3px solid var(--primary-accent);
      background: rgba(229, 169, 59, 0.08);
    }

    .log-panel {
      flex: 1;
      min-height: 200px;
    }

    .log-entry {
      font-size: 0.72rem;
      line-height: 1.4;
      padding: 3px 6px;
      border-radius: 4px;
      border-left: 2px solid transparent;
      animation: fadeIn 0.2s ease;
    }
    .log-entry.INFO { border-color: #3498db; color: #d0e4ff; }
    .log-entry.SUCCESS { border-color: #2ecc71; color: #c8ffd8; }
    .log-entry.WARNING { border-color: #f39c12; color: #ffe6b3; }
    .log-entry.ERROR { border-color: #e74c3c; color: #ffb3b3; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* D-PAD / Mobile Controller */
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(3, 40px);
      gap: 4px;
      margin: 8px auto;
    }
    .dpad-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.1s ease;
    }
    .dpad-btn:active {
      background: var(--primary-accent);
      color: #000;
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="game-logo">
      <span>NAROU</span>
      <span class="badge-version">v2.0 MASTERPIECE</span>
    </div>
    <div class="header-status">
      <div class="status-chip" id="chipFloor">階層: B1F</div>
      <div class="status-chip" id="chipGold">💰 0 G</div>
      <div class="status-chip" id="chipPlatinum">💎 0 P</div>
      <div class="status-chip" id="chipKarma">⚖️ 善悪: 0</div>
      <button class="audio-btn" id="btnAudioToggle" onclick="SoundEngine.toggleAudio()">🔊 サウンド起動</button>
      <div class="theme-switch" id="themeSwitch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-value="dark" title="ダーク">🌑</button>
        <button type="button" data-theme-value="light" title="ライト">☀️</button>
        <button type="button" data-theme-value="high-contrast" title="ハイコントラスト">🔆</button>
        <button type="button" data-theme-value="colorblind" title="色覚サポート">👁️</button>
        <button type="button" data-theme-value="sepia" title="セピア">📜</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="main-container">

    <!-- CANVAS VIEWPORT -->
    <div class="viewport-panel" id="viewportPanel">
      <canvas id="gameCanvas" width="960" height="576"></canvas>
      <div id="gl-error-overlay" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:100; text-align:center; padding:20px;">
        <h2 style="color:#e74c3c; margin-bottom:10px;">⚠️ グラフィックス初期化警告</h2>
        <p id="gl-error-msg" style="margin-bottom:15px; max-width:500px;">WebGL2 / WebGPU の初期化に失敗したか、サポートされていません。フォールバック描画モードで動作しています。</p>
        <button onclick="document.getElementById('gl-error-overlay').style.display='none'" style="background:var(--primary-accent,#3498db); color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">閉じる</button>
      </div>

      <!-- HUD OVERLAY -->
      <div class="hud-overlay">
        <!-- PLAYER VITALS -->
        <div class="vitals-card">
          <div style="font-weight: 700; font-size: 0.85rem; color: #ffd700;" id="hudPlayerName">名無しの冒険者</div>
          <div class="vital-row">
            <span class="vital-label">HP</span>
            <div class="vital-bar-container"><div class="vital-bar bar-hp" id="barHP" style="width: 100%;"></div></div>
            <span class="vital-val" id="valHP">100/100</span>
          </div>
          <div class="vital-row">
            <span class="vital-label">MP</span>
            <div class="vital-bar-container"><div class="vital-bar bar-mp" id="barMP" style="width: 100%;"></div></div>
            <span class="vital-val" id="valMP">50/50</span>
          </div>
          <div class="vital-row">
            <span class="vital-label" style="font-size:0.65rem;">満腹</span>
            <div class="vital-bar-container"><div class="vital-bar bar-hunger" id="barHunger" style="width: 80%;"></div></div>
            <span class="vital-val" id="valHunger">普通</span>
          </div>
        </div>

        <!-- PET VITALS -->
        <div class="vitals-card" id="petCard" style="min-width: 180px;">
          <div style="font-weight: 700; font-size: 0.8rem; color: #ffb6c1;" id="hudPetName">シエル</div>
          <div class="vital-row">
            <span class="vital-label">HP</span>
            <div class="vital-bar-container"><div class="vital-bar bar-hp" id="barPetHP" style="width: 100%;"></div></div>
            <span class="vital-val" id="valPetHP">--/--</span>
          </div>
          <div style="font-size: 0.7rem; color: var(--text-muted);" id="valPetTactic">指示: バランス</div>
        </div>
      </div>

      <!-- ACTION HOTBAR -->
      <div class="hotbar-container">
        <button class="hotbar-btn" onclick="sendAction('pickup')"><span>拾う</span><span class="key-tag">G</span></button>
        <button class="hotbar-btn" onclick="sendAction('cast_fireball')"><span>🔥 火炎球</span><span class="key-tag">F</span></button>
        <button class="hotbar-btn" onclick="sendAction('use_potion')"><span>🧪 回復薬</span><span class="key-tag">Q</span></button>
        <button class="hotbar-btn" onclick="sendAction('pray')"><span>🙏 祈る</span><span class="key-tag">P</span></button>
        <button class="hotbar-btn" onclick="sendAction('wait')"><span>⏳ 待機</span><span class="key-tag">Space</span></button>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">

      <!-- TABS PANEL -->
      <div class="panel-card" style="height: 50%;">
        <div class="tabs-header">
          <button class="tab-btn active" onclick="switchTab('tabInventory')">荷物</button>
          <button class="tab-btn" onclick="switchTab('tabStats')">能力</button>
          <button class="tab-btn" onclick="switchTab('tabQuests')">依頼</button>
          <button class="tab-btn" onclick="switchTab('tabPet')">ペット</button>
        </div>

        <!-- TAB: INVENTORY -->
        <div class="tab-content" id="tabInventory">
          <div class="item-list" id="inventoryList">
            <div style="color: var(--text-muted); text-align: center;">読み込み中...</div>
          </div>
        </div>

        <!-- TAB: STATS -->
        <div class="tab-content" id="tabStats" style="display: none;">
          <div id="statsContent" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- TAB: QUESTS -->
        <div class="tab-content" id="tabQuests" style="display: none;">
          <div class="quest-list" id="questList">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- TAB: PET TACTICS -->
        <div class="tab-content" id="tabPet" style="display: none;">
          <div style="font-size: 0.75rem; margin-bottom: 8px;">ペットの戦闘戦術方針:</div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <button class="hotbar-btn" onclick="sendAction('set_pet_tactic', {tactic: 'balanced'})">⚔️ バランス (追従・迎撃)</button>
            <button class="hotbar-btn" onclick="sendAction('set_pet_tactic', {tactic: 'aggressive'})">💥 積極索敵 (突撃殲滅)</button>
            <button class="hotbar-btn" onclick="sendAction('set_pet_tactic', {tactic: 'defensive'})">🛡️ 専守防衛 (主人護衛)</button>
            <button class="hotbar-btn" onclick="sendAction('set_pet_tactic', {tactic: 'passive'})">🏃 不戦避難 (攻撃停止)</button>
          </div>
        </div>
      </div>

      <!-- LOG & CONTROLLER PANEL -->
      <div class="panel-card log-panel">
        <div style="padding: 6px 10px; font-weight: 700; font-size: 0.75rem; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--panel-border);">
          📜 冒険ログ
        </div>
        <div class="tab-content" id="logContainer" style="display: flex; flex-direction: column-reverse;">
          <!-- Log Entries -->
        </div>

        <!-- MINI DPAD -->
        <div class="dpad-container">
          <button class="dpad-btn" onclick="sendAction('up_left')">↖</button>
          <button class="dpad-btn" onclick="sendAction('up')">↑</button>
          <button class="dpad-btn" onclick="sendAction('up_right')">↗</button>
          <button class="dpad-btn" onclick="sendAction('left')">←</button>
          <button class="dpad-btn" onclick="sendAction('wait')">・</button>
          <button class="dpad-btn" onclick="sendAction('right')">→</button>
          <button class="dpad-btn" onclick="sendAction('down_left')">↙</button>
          <button class="dpad-btn" onclick="sendAction('down')">↓</button>
          <button class="dpad-btn" onclick="sendAction('down_right')">↘</button>
        </div>
      </div>

    </div>
  </div>

  <!-- JAVASCRIPT: CANVAS 2D & WEBAUDIO ENGINE -->
  <script>
    // ==================== WEBAUDIO SOUND ENGINE ====================
    const SoundEngine = {
      ctx: null,
      enabled: false,
      bgmInterval: null,

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        this.enabled = true;
        document.getElementById("btnAudioToggle").innerText = "🔊 サウンド ON";
        this.startDynamicBGM();
      },

      toggleAudio() {
        if (!this.enabled) {
          this.init();
          this.playSE("level_up");
        } else {
          this.enabled = false;
          if (this.bgmInterval) clearInterval(this.bgmInterval);
          document.getElementById("btnAudioToggle").innerText = "🔇 サウンド OFF";
        }
      },

      playSE(type) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;

        if (type === "hit") {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";

          osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === "kill") {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === "level_up") {
          [440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.2, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.3);
          });

        if (this.bgmInterval) clearInterval(this.bgmInterval);
        const chords = [
          [220, 261.63, 329.63], // Am
          [174.61, 220, 261.63], // F
          [196, 246.94, 293.66], // G
          [164.81, 196, 246.94]  // Em
        ];
        let chordIdx = 0;

        this.bgmInterval = setInterval(() => {
          if (!this.enabled || !this.ctx) return;
          const chord = chords[chordIdx % chords.length];
          chordIdx++;
          const now = this.ctx.currentTime;

          chord.forEach(freq => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq * 0.5, now);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.03, now + 1.2);
            gain.gain.linearRampToValueAtTime(0.001, now + 3.8);

            if (ft.text && ft.text.includes('🔥') || ft.text && ft.text.includes('魔法')) {
              particleSystem.emitEffect('magic_cast',
                offsetX + ft.x * TILE_SIZE,
                offsetY + ft.y * TILE_SIZE,
                10
              );
            }
          });
        }
        
        entities.forEach(ent => {
          const px = offsetX + ent.x * TILE_SIZE;
          const py = offsetY + ent.y * TILE_SIZE;

          // 息遣いアニメーション
          const bounce = Math.sin(animTime * 4 + ent.x) * 1.5;

          // エンティティのTileDef ID決定
          let tileId = getEntityTileId(ent);
          
          const td = tileAtlas.defs[tileId];
          if (!td) return;

          // 向き決定: サーバー優先 → 推定
          const dir = ent.facing !== undefined ? ent.facing : estimateFacing(ent, prevEntities);
          
          // 状態決定: サーバー優先 → 推定
          let state = ent.state || "idle";
          const isAttacking = state === "attack";
          
          // 攻撃タイマー管理
          if (isAttacking) {
              const id = ent.id || `${ent.world_x},${ent.world_y}`;
              entityAttackTimers.set(id, { timer: 0.5, duration: 0.5 });
}
           
           // 攻撃中は強制的にattack状態維持
          const attackInfo = entityAttackTimers.get(ent.id || `${ent.world_x},${ent.world_y}`);
          if (attackInfo) {
              state = "attack";
              attackInfo.timer -= 1/60;
              if (attackInfo.timer <= 0) {
                  entityAttackTimers.delete(ent.id || `${ent.world_x},${ent.world_y}`);
                  state = "idle";
              }
          } else if (ent.hp <= 0) {
              state = "dead";
          } else if (ent.moving || (ent.vx !== 0 || ent.vy !== 0)) {
              state = "walk";
          }

          // アニメーションキー: tileId_direction_state
          const animKey = `${tileId}_${dir}_${state}`;
          if (!entityAnimCache[animKey]) {
              const loop = state !== "attack" && state !== "dead";
              const fps = state === "attack" ? 12 : td.fps;
              entityAnimCache[animKey] = tileAtlas.createAnimatedSprite(tileId, {
                  direction: dir, state, fps, loop
              });
          }
          const sprite = entityAnimCache[animKey];
          
          // 攻撃・死亡アニメは最初から再生
          if ((state === "attack" || state === "dead") && !sprite._playing) {
              sprite.gotoAndPlay(0);
              sprite._playing = true;
              sprite.onComplete = () => {
sprite._playing = false;
                   if (state === "dead") sprite.visible = false;
               };
           }
           
           sprite.x = px;
          sprite.y = py + bounce;
          entityLayer.addChild(sprite);
          
          // HPバー（プレイヤーとペット以外のエンティティに対して）
          if (!ent.is_player && !ent.is_pet && ent.max_hp > 0) {
            const hpRatio = Math.max(0, Math.min(1, ent.hp / ent.max_hp));
            
            // HPバーの背景
            const hpBarBg = new PIXI.Graphics();
            hpBarBg.beginFill(0x000000, 0.6);
            hpBarBg.drawRect(-TILE_SIZE * 0.5 + 2, -TILE_SIZE * 0.5 - 4, TILE_SIZE - 4, 3);
            hpBarBg.endFill();
            hpBarBg.x = px;
            hpBarBg.y = py + bounce;
            entityLayer.addChild(hpBarBg);
            
            // HPバーの前景
            const hpColor = hpRatio > 0.5 ? 0x2ecc71 : hpRatio > 0.2 ? 0xf39c12 : 0xe74c3c;
            const hpBarFg = new PIXI.Graphics();
            hpBarFg.beginFill(hpColor);
            hpBarFg.drawRect(-TILE_SIZE * 0.5 + 2, -TILE_SIZE * 0.5 - 4, (TILE_SIZE - 4) * hpRatio, 3);
            hpBarFg.endFill();
            hpBarFg.x = px;
            hpBarFg.y = py + bounce;
            entityLayer.addChild(hpBarFg);
          }
        });
        
        // 3. アイテム描画 - TileAtlas使用
        // 品質色マッピング
        const qualityColors = {
          'common': 0xcccccc,
          'uncommon': 0x33ff33,
          'rare': 0x3366ff,
          'epic': 0x9933ff,
          'legendary': 0xffaa00
        };

        const items = gameState.items || [];
        items.forEach(item => {
          const px = offsetX + item.x * TILE_SIZE;
          const py = offsetY + item.y * TILE_SIZE;

          // アイテムのTileDef ID決定
          let tileId = "ITEM_POTION";
          if (item.tile_id && tileAtlas.defs[item.tile_id]) {
            tileId = item.tile_id;
          } else if (item.char === '$' || item.char === '💰') {
            tileId = "ITEM_GOLD";
          } else if (item.char === ')') {
            tileId = "ITEM_WEAPON";
          } else if (item.char === '[') {
            tileId = "ITEM_ARMOR";
          }
          
          const td = tileAtlas.defs[tileId];
          if (!td) return;

          let sprite;
          if (td.animated) {
            const animKey = `${tileId}_idle_${td.fps}`;
            if (!tileAnimCache[animKey]) {
              tileAnimCache[animKey] = tileAtlas.createAnimatedSprite(tileId, { fps: td.fps });
            }
            sprite = tileAnimCache[animKey];
            sprite.x = px; sprite.y = py;
            if (sprite.parent !== entityLayer) entityLayer.addChild(sprite);
          } else {
            sprite = tileAtlas.createSprite(tileId, { 
                variant: item.variant || 0,
                tint: qualityColors[item.quality] || 0xffffff
            });
            sprite.x = px; sprite.y = py;
            entityLayer.addChild(sprite);
          }
        });
        
        // TODO: エフェクト描画（パーティクル、ライティング等）
      }
      // レンダリングはPixiJSが自動的に行うため、requestAnimationFrameは不要
    }

    // PixiJSのtickerでレンダリングループを開始
    pixiApp.ticker.add((delta) => {
      const dt = delta / 60.0;
      if (fluidRenderer) {
          fluidRenderer.update(dt);
          fluidRenderer.render();
      }
      if (postProcessManager) {
          postProcessManager.update(dt);
      }
      if (boidSystem) {
          const playerPos = gameState && gameState.player ? {
              x: (gameState.player.x + 0.5) * TILE_SIZE,
              y: (gameState.player.y + 0.5) * TILE_SIZE
          } : null;
          boidSystem.update(dt, playerPos, gameState ? gameState.light_sources : []);
      }
      render();
    });

    // Step 68: UIボタンの波紋クリック（Ripple）エフェクト初期化
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.hotbar-btn, .tab-btn, .dpad-btn, .audio-btn');
      if (btn) {
        const circle = document.createElement('span');
        const diameter = Math.max(btn.clientWidth, btn.clientHeight);
        const radius = diameter / 2;
        const rect = btn.getBoundingClientRect();
        circle.style.width = circle.style.height = `${diameter}px`;
        circle.style.left = `${e.clientX - rect.left - radius}px`;
        circle.style.top = `${e.clientY - rect.top - radius}px`;
        circle.classList.add('ripple-effect');
        const oldRipple = btn.getElementsByClassName('ripple-effect')[0];
        if (oldRipple) oldRipple.remove();
        btn.appendChild(circle);
        setTimeout(() => circle.remove(), 500);
      }
    });

    // ==================== STATE SYNC & API ====================
    async function fetchState() {
      try {
        const res = await fetch("/api/state");
        if (res.ok) {
          gameState = await res.json();
          updateUI(gameState);
        }
      } catch (err) {
        console.error("State sync failed:", err);
      }
    }
    setInterval(fetchState, 300);
    fetchState();

    async function sendAction(actionName, payload = {}) {
      try {
        const res = await fetch("/api/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: actionName, ...payload })
        });
        if (res.ok) {
          gameState = await res.json();
          updateUI(gameState);
          SoundEngine.playSE("hit");
        }
      } catch (err) {
        console.error("Action dispatch failed:", err);
      }
    }

    // ==================== UI UPDATE ====================
    function updateUI(state) {
      if (!state || !state.player) return;
      const p = state.player;
      const pet = state.pet;

      // Header Chips
      document.getElementById("chipFloor").innerText = `階層: B${state.dungeon_level || 1}F`;
      document.getElementById("chipGold").innerText = `💰 ${p.gold} G`;
      document.getElementById("chipPlatinum").innerText = `💎 ${p.platinum} P`;
      document.getElementById("chipKarma").innerText = `⚖️ 善悪: ${p.karma}`;

      // Player Vitals
      document.getElementById("hudPlayerName").innerText = `${p.name} (Lv.${p.level} ${p.job})`;
      const hpPct = Math.max(0, Math.min(100, (p.hp / p.max_hp) * 100));
      document.getElementById("barHP").style.width = `${hpPct}%`;
      document.getElementById("valHP").innerText = `${p.hp}/${p.max_hp}`;

      const mpPct = Math.max(0, Math.min(100, (p.mp / p.max_mp) * 100));
      document.getElementById("barMP").style.width = `${mpPct}%`;
      document.getElementById("valMP").innerText = `${p.mp}/${p.max_mp}`;

      const hungerPct = Math.max(0, Math.min(100, (p.hunger / 2000) * 100));
      document.getElementById("barHunger").style.width = `${hungerPct}%`;
      document.getElementById("valHunger").innerText = p.hunger > 1500 ? "満腹" : p.hunger > 800 ? "普通" : "空腹";

      // Pet Vitals
      if (pet && pet.name) {
        document.getElementById("hudPetName").innerText = `妹分『${pet.name}』`;
        const petHpPct = Math.max(0, Math.min(100, (pet.hp / pet.max_hp) * 100));
        document.getElementById("barPetHP").style.width = `${petHpPct}%`;
        document.getElementById("valPetHP").innerText = `${pet.hp}/${pet.max_hp}`;
        document.getElementById("valPetTactic").innerText = `指示: ${pet.tactic || 'バランス'}`;
      }

      // Inventory List
      const invContainer = document.getElementById("inventoryList");
      if (state.inventory && state.inventory.length > 0) {
        invContainer.innerHTML = state.inventory.map(item => `
          <div class="item-entry ${item.equipped ? 'equipped' : ''}">
            <span>${item.char} ${item.name}</span>
            <span style="color: var(--text-muted);">${item.weight}s</span>
          </div>
        `).join("");
      } else {
        invContainer.innerHTML = `<div style="color: var(--text-muted); text-align: center;">荷物は空です</div>`;
      }

      // Stats Tab
      if (p.attributes) {
        const statsEl = document.getElementById("statsContent");
        statsEl.innerHTML = `
          <div>腕力 (STR): <b>${p.attributes.str}</b></div>
          <div>耐久 (END): <b>${p.attributes.end}</b></div>
          <div>器用 (DEX): <b>${p.attributes.dex}</b></div>
          <div>感覚 (PER): <b>${p.attributes.per}</b></div>
          <div>習得 (LER): <b>${p.attributes.ler}</b></div>
          <div>意志 (WIL): <b>${p.attributes.wil}</b></div>
          <div>魔力 (MAG): <b>${p.attributes.mag}</b></div>
          <div>魅力 (CHA): <b>${p.attributes.cha}</b></div>
          <div style="grid-column: span 2; margin-top: 6px; color: #ffd700;">信仰: ${p.god} (信仰度: ${p.piety})</div>
        `;
      }

      // Quests Tab
      const questEl = document.getElementById("questList");
      if (state.quests && state.quests.length > 0) {
        questEl.innerHTML = state.quests.map(q => `
          <div class="item-entry" style="${q.completed ? 'opacity: 0.6;' : ''}">
            <div>
              <div style="font-weight: 600;">${q.title}</div>
              <div style="font-size: 0.7rem; color: var(--text-muted);">${q.target}: ${q.current}/${q.needed}</div>
            </div>
            <div style="color: #ffd700;">+${q.reward_gold}G</div>
          </div>
        `).join("");
      } else {
        questEl.innerHTML = `<div style="color: var(--text-muted); text-align: center;">受領中の依頼はありません</div>`;
      }

      // Logs
      const logContainer = document.getElementById("logContainer");
      if (state.logs) {
        logContainer.innerHTML = state.logs.map(log => `
          <div class="log-entry ${log.level || 'INFO'}">${log.text}</div>
        `).join("");
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab-content").forEach(el => {
        el.style.display = "none";
        el.classList.remove("spring-anim");
      });
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
      const targetEl = document.getElementById(tabId);
      if (targetEl) {
        targetEl.style.display = "block";
        targetEl.classList.add("spring-anim");
      }
      if (window.event && window.event.target) {
        window.event.target.classList.add("active");
      }
    }

    // ==================== KEYBOARD CONTROLS ====================
    window.addEventListener("keydown", (e) => {
      const keyMap = {
        "ArrowUp": "up", "KeyW": "up", "Numpad8": "up",
        "ArrowDown": "down", "KeyS": "down", "Numpad2": "down",
        "ArrowLeft": "left", "KeyA": "left", "Numpad4": "left",
        "ArrowRight": "right", "KeyD": "right", "Numpad6": "right",
        "Numpad7": "up_left", "Numpad9": "up_right",
        "Numpad1": "down_left", "Numpad3": "down_right",
        "Space": "wait", "Numpad5": "wait",
        "KeyG": "pickup",
        "KeyF": "cast_fireball",
        "KeyQ": "use_potion",
        "KeyP": "pray"
      };

      if (keyMap[e.code]) {
        e.preventDefault();
        sendAction(keyMap[e.code]);
      }
    });
    });

    // ==================== THEME MANAGER ====================
    // Persists the selected visual theme (dark / light / high-contrast /
    // colorblind / sepia) and applies it via <html data-theme="...">.
    const ThemeManager = (() => {
      const STORAGE_KEY = 'narou-theme';
      const VALID = ['dark', 'light', 'high-contrast', 'colorblind', 'sepia'];
      const root = document.documentElement;

      function current() {
        return root.dataset.theme || 'dark';
      }

      function apply(theme) {
        if (!VALID.includes(theme)) theme = 'dark';
        root.dataset.theme = theme;
        try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
        document.querySelectorAll('#themeSwitch button').forEach((btn) => {
          const active = btn.dataset.themeValue === theme;
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      }

      function init() {
        let saved = 'dark';
        try { saved = localStorage.getItem(STORAGE_KEY) || 'dark'; } catch (e) {}
        apply(saved);
        const sw = document.getElementById('themeSwitch');
        if (sw) {
          sw.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-theme-value]');
            if (btn) apply(btn.dataset.themeValue);
          });
        }
      }

      return { apply, current, init };
    })();
    ThemeManager.init();
  </script>
</body>
