<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>naRou: Masterpiece Edition (Canvas 2D & WebAudio)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <script src="https://cdn.pixijs.com/pixi.js"></script>
  <script type="module" src="demos/lib/TextureAtlas.js"></script>
  <script type="module" src="demos/lib/LightingSystem.js"></script>
  <script type="module" src="demos/lib/ParticleSystem.js"></script>
  <script type="module" src="demos/lib/PostProcessManager.js"></script>
  <script type="module" src="demos/lib/ScreenShake.js"></script>
  <style>
    /* Brand UI variables and theme variants are provided by web/theme.css
       (auto-generated from design_tokens.json). Theme switching sets
       document.documentElement.dataset.theme. */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding: 12px;
    }

    /* === HEADER === */
    header {
      width: 100%;
      max-width: 1280px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .game-logo {
      font-family: var(--font-title);
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-version {
      font-size: 0.65rem;
      background: rgba(229, 169, 59, 0.2);
      border: 1px solid var(--primary-accent);
      color: var(--primary-accent);
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      font-family: var(--font-main);
    }

    .header-status {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 0.85rem;
    }

    .status-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .audio-btn {
      background: rgba(229, 169, 59, 0.15);
      border: 1px solid var(--primary-accent);
      color: var(--primary-accent);
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .audio-btn:hover {
      background: var(--primary-accent);
      color: #000;
      box-shadow: 0 0 12px rgba(229, 169, 59, 0.6);
    }

    .theme-switch {
      display: flex;
      gap: 4px;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 3px 6px;
    }
    .theme-switch button {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      padding: 3px 5px;
      transition: all 0.2s ease;
      filter: grayscale(0.4);
      opacity: 0.7;
    }
    .theme-switch button:hover {
      opacity: 1;
      filter: none;
      background: rgba(255, 255, 255, 0.1);
    }
    .theme-switch button[aria-pressed="true"] {
      opacity: 1;
      filter: none;
      border-color: var(--primary-accent);
      box-shadow: 0 0 10px rgba(229, 169, 59, 0.5);
    }

    /* === MAIN LAYOUT === */
    .main-container {
      width: 100%;
      max-width: 1280px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      height: calc(100vh - 100px);
      min-height: 640px;
    }

    /* === CANVAS VIEWPORT === */
    .viewport-panel {
      position: relative;
      background: #000;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    /* Canvas Overlay HUD */
    .hud-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .vitals-card {
      background: rgba(10, 14, 25, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border);
      padding: 10px 14px;
      border-radius: 8px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: auto;
    }

    .vital-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
    }

    .vital-label {
      width: 24px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .vital-bar-container {
      flex: 1;
      height: 10px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .vital-bar {
      height: 100%;
      transition: width 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .bar-hp { background: linear-gradient(90deg, #27ae60, #2ecc71); box-shadow: 0 0 8px rgba(46, 204, 113, 0.5); }
    .bar-mp { background: linear-gradient(90deg, #2980b9, #3498db); box-shadow: 0 0 8px rgba(52, 152, 219, 0.5); }
    .bar-hunger { background: linear-gradient(90deg, #d35400, #e67e22); }

    .vital-val {
      font-size: 0.7rem;
      font-weight: 600;
      width: 65px;
      text-align: right;
    }

    /* Action Hotbar */
    .hotbar-container {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(10, 14, 25, 0.9);
      backdrop-filter: blur(12px);
      padding: 6px 12px;
      border-radius: 24px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    .hotbar-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .hotbar-btn:hover {
      background: var(--primary-accent);
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(229, 169, 59, 0.5);
    }
    .hotbar-btn .key-tag {
      background: rgba(0, 0, 0, 0.4);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.65rem;
      color: #ffd700;
    }

    /* === SIDEBAR PANELS === */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }

    .panel-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .tabs-header {
      display: flex;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(0, 0, 0, 0.2);
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .tab-btn.active {
      color: var(--primary-accent);
      border-bottom: 2px solid var(--primary-accent);
      background: rgba(229, 169, 59, 0.08);
    }

    .tab-content {
      padding: 10px;
      flex: 1;
      overflow-y: auto;
      font-size: 0.8rem;
    }

    /* Item & Log Lists */
    .item-list, .log-list, .quest-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      font-size: 0.75rem;
      transition: background 0.15s ease;
    }
    .item-entry:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--panel-border-glow);
    }
    .item-entry.equipped {
      border-left: 3px solid var(--primary-accent);
      background: rgba(229, 169, 59, 0.08);
    }

    .log-panel {
      flex: 1;
      min-height: 200px;
    }

    .log-entry {
      font-size: 0.72rem;
      line-height: 1.4;
      padding: 3px 6px;
      border-radius: 4px;
      border-left: 2px solid transparent;
      animation: fadeIn 0.2s ease;
    }
    .log-entry.INFO { border-color: #3498db; color: #d0e4ff; }
    .log-entry.SUCCESS { border-color: #2ecc71; color: #c8ffd8; }
    .log-entry.WARNING { border-color: #f39c12; color: #ffe6b3; }
    .log-entry.ERROR { border-color: #e74c3c; color: #ffb3b3; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* D-PAD / Mobile Controller */
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(3, 40px);
      gap: 4px;
      margin: 8px auto;
    }
    .dpad-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.1s ease;
    }
    .dpad-btn:active {
      background: var(--primary-accent);
      color: #000;
      transform: scale(0.92);
    }
  </style>
</head>
<body>

      <span>NAROU</span>

    </div>
    <div class="header-status">

  <!-- MAIN CONTAINER -->
  <div class="main-container">

    <div class="viewport-panel" id="viewportPanel">
      <canvas id="gameCanvas" width="960" height="576"></canvas>

      <!-- HUD OVERLAY -->
      <div class="hud-overlay">
        <!-- PLAYER VITALS -->
        <div class="vitals-card">
          <div style="font-weight: 700; font-size: 0.85rem; color: #ffd700;" id="hudPlayerName">名無しの冒険者</div>
          <div class="vital-row">

  <!-- JAVASCRIPT: CANVAS 2D & WEBAUDIO ENGINE -->
  <script>
    // ==================== WEBAUDIO SOUND ENGINE ====================
    const SoundEngine = {
      ctx: null,
      enabled: false,
      bgmInterval: null,

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        this.enabled = true;
        document.getElementById("btnAudioToggle").innerText = "🔊 サウンド ON";
        this.startDynamicBGM();
      },

      toggleAudio() {
        if (!this.enabled) {
          this.init();
          this.playSE("level_up");
        } else {
          this.enabled = false;
          if (this.bgmInterval) clearInterval(this.bgmInterval);
          document.getElementById("btnAudioToggle").innerText = "🔇 サウンド OFF";
        }
      },

      playSE(type) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;

        if (type === "hit") {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === "kill") {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === "level_up") {
          [440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.2, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.3);
          });
        }
      },

      startDynamicBGM() {
        if (this.bgmInterval) clearInterval(this.bgmInterval);
        const chords = [
          [220, 261.63, 329.63], // Am
          [174.61, 220, 261.63], // F
          [196, 246.94, 293.66], // G
          [164.81, 196, 246.94]  // Em
        ];
        let chordIdx = 0;

        this.bgmInterval = setInterval(() => {
          if (!this.enabled || !this.ctx) return;
          const chord = chords[chordIdx % chords.length];
          chordIdx++;
          const now = this.ctx.currentTime;

          chord.forEach(freq => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq * 0.5, now);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.03, now + 1.2);
            gain.gain.linearRampToValueAtTime(0.001, now + 3.8);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 4.0);
          });
        }, 4000);
      }
    };

// ==================== PIXI.JS WEBGL RENDER ENGINE ====================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    // モジュールロード待機
    function waitForModules(callback, maxAttempts = 50) {
      let attempts = 0;
      const check = () => {
        attempts++;
        if (window.LightingSystem && window.ParticleSystem && 
            window.PostProcessManager && window.ScreenShake && window.TextureAtlas) {
          callback();
        } else if (attempts < maxAttempts) {
          setTimeout(check, 100);
        } else {
          console.error('Module loading timeout');
        }
      };
      check();
    }
    
    waitForModules(() => {

    // PixiJSアプリケーションの初期化
    const pixiApp = new PIXI.Application({
        view: canvas,
        width: canvas.width,
        height: canvas.height,
        backgroundColor: 0x000000,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
    });

    // レイヤー分離のためのコンテナを作成
    const backgroundLayer = new PIXI.Container();
    const tileLayer = new PIXI.Container();
    const entityLayer = new PIXI.Container();
    const effectLayer = new PIXI.Container();

    // 背景グラフィックを作成（濃紫で塗りつぶし）
    const backgroundGraphics = new PIXI.Graphics();
    function updateBackground() {
        backgroundGraphics.clear();
        backgroundGraphics.beginFill(0x0a0b10); // 濃紫 (#0a0b10)
        backgroundGraphics.drawRect(0, 0, pixiApp.screen.width, pixiApp.screen.height);
        backgroundGraphics.endFill();
    }
    // 初期背景を描画
    updateBackground();
    backgroundLayer.addChild(backgroundGraphics);

    // ステージにレイヤーを追加（下から上へ）
    pixiApp.stage.addChild(backgroundLayer);
    pixiApp.stage.addChild(tileLayer);
    pixiApp.stage.addChild(entityLayer);
    pixiApp.stage.addChild(effectLayer);

    // ライティングシステムを初期化
    const viewW = 40;
    const viewH = 24;
    const TILE_SIZE = 24;
    const lightingSystem = new LightingSystem(
        pixiApp,
        tileLayer,
        viewW * TILE_SIZE,
        viewH * TILE_SIZE
    );

    // パーティクルシステムを初期化
    const particleSystem = new ParticleSystem(pixiApp, effectLayer);

    // ポストプロセスマネージャーを初期化
    const postProcessManager = new PostProcessManager(pixiApp);
    pixiApp.stage.addChild(postProcessManager.getEffectsContainer());

    // スクリーンシェイクを初期化
    const screenShake = new ScreenShake(pixiApp.stage, 5, 0.5);

    // リサイズ処理
    function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        pixiApp.renderer.resize(width, height);
        // 背景グラフィックもリサイズに合わせて更新
        updateBackground();
    }
    window.addEventListener('resize', resize);
    // 初期リサイズ
    resize();

    // テクスチャアトラス
    let textureAtlas = null;
    let tileTextures = {};

    // テクスチャアトラスのロード
    async function loadTextureAtlas() {
        try {
            // アトラス画像をロード
            const atlasImage = new Image();
            atlasImage.src = 'demos/assets/font_atlas.png';
            
            await new Promise((resolve, reject) => {
                atlasImage.onload = resolve;
                atlasImage.onerror = reject;
            });
            
            // アトラスメタデータをロード
            const metadataResponse = await fetch('demos/assets/font_atlas.json');
            const metadata = await metadataResponse.json();
            
            // PixiJSテクスチャを作成
            const baseTexture = new PIXI.BaseTexture(atlasImage);
            textureAtlas = new TextureAtlas(baseTexture, metadata);
            
            // タイル文字と色のマッピング（テクスチャアトラスを使用）
            tileTextures = {
                '#': textureAtlas.getTexture('#'),
                '.': textureAtlas.getTexture('.'),
                '>': textureAtlas.getTexture('>'),
                ' ': textureAtlas.getTexture(' '),
                '⛩️': textureAtlas.getTexture('⛩️')
            };
            
            console.log('Texture atlas loaded successfully');
        } catch (error) {
            console.error('Failed to load texture atlas:', error);
            // フォールバック: プレースホルダーテクスチャを使用
            createPlaceholderTextures();
        }
    }

    // プレースホルダーテクスチャを作成（フォールバック用）
    function createPlaceholderTextures() {
        const graphics = new PIXI.Graphics();
        graphics.beginFill(0xffffff);
        graphics.drawRect(0, 0, 1, 1);
        graphics.endFill();
        const texture = graphics.generateCanvasTexture();
        
        tileTextures = {
            '#': createColoredTexture(texture, 0x3d4253),
            '.': createColoredTexture(texture, 0x1c2230),
            '>': createColoredTexture(texture, 0x27ae60),
            ' ': createColoredTexture(texture, 0x0f121a),
            '⛩️': createColoredTexture(texture, 0x1c2230)
        };
        console.log('Using placeholder textures');
    }

    // 色付きテクスチャを作成するヘルパー関数
    function createColoredTexture(baseTexture, color) {
        const sprite = new PIXI.Sprite(baseTexture);
        sprite.tint = color;
        return sprite;
    }

    // テクスチャアトラスを初期化
    loadTextureAtlas();

    let gameState = null;
    let animTime = 0;
    let prevPlayerPos = null;
    let prevPlayerHp = null;

    const TILE_SIZE = 24;

    function render() {
      animTime += 0.05;
      
      // パーティクルシステムを更新
      particleSystem.update(0.016); // 約60fps想定
      
      // ポストプロセスを更新
      postProcessManager.update(0.016);
      
      // スクリーンシェイクを更新
      screenShake.update(0.016);
      
      if (!gameState) {
        // サーバーに接続中... はPixiJSレイヤーには表示しない
        // Canvas 2Dのまま表示（後でPixiJSに移行可能）
        ctx.fillStyle = "#8b9bb4";
        ctx.font = "16px var(--font-main)";
        ctx.textAlign = "center";
        ctx.fillText("サーバーに接続中……", canvas.width / 2, canvas.height / 2);
      } else {
        // Clear layers each frame (except background which is static)
        tileLayer.removeChildren();
        entityLayer.removeChildren();
        effectLayer.removeChildren();
        
        const map = gameState.map || [];
        const lightMap = gameState.light_map || [];
        const lightColor = gameState.light_color || [];
        const lightSources = gameState.light_sources || [];
        const enemyCones = gameState.enemy_cones || [];
        const viewH = map.length;
        const viewW = viewH > 0 ? map[0].length : 0;

        // 画面中央オフセット
        const offsetX = Math.max(0, (canvas.width - viewW * TILE_SIZE) / 2);
        const offsetY = Math.max(0, (canvas.height - viewH * TILE_SIZE) / 2);

        // ライティングシステムを更新（乗算ブレンド＋松明フリッカー＋敵視界コーン）
        lightingSystem.updateLightMap(lightMap, lightColor);
        lightingSystem.setLightSources(lightSources, animTime);
        lightingSystem.setEnemyCones(enemyCones, animTime);
        lightingSystem.applyLighting(pixiApp.stage);

        // 深度別カラーグレーディング（ポストプロセス）
        if (postProcessManager && postProcessManager.setColorGrade) {
            postProcessManager.setColorGrade(gameState.dungeon_level || 0);
        }

        // 1. タイル描画 (床・壁・階段) - テクスチャアトラス使用
        for (let y = 0; y < viewH; y++) {
          for (let x = 0; x < viewW; x++) {
            const tile = map[y][x];
            const light = lightMap[y] ? lightMap[y][x] : 0;

            const px = offsetX + x * TILE_SIZE;
            const py = offsetY + y * TILE_SIZE;

            // タイルのテクスチャを取得
            const texture = tileTextures[tile];
            
            if (texture) {
              // テクスチャアトラスからテクスチャを使用
              const tileSprite = new PIXI.Sprite(texture.texture || texture);
              tileSprite.width = TILE_SIZE;
              tileSprite.height = TILE_SIZE;
              
              // ライティングはライティングシステムで処理するため、
              // ここでは基本色のみを設定
              tileSprite.tint = 0xffffff;
              
              tileSprite.x = px;
              tileSprite.y = py;
              tileLayer.addChild(tileSprite);
            } else {
              // フォールバック: テクスチャが見つからない場合はGraphicsで描画
              const tileGraphics = new PIXI.Graphics();
              
              // 地形ベースカラー
              if (tile === "#") {
                // 壁
                tileGraphics.beginFill(light > 0 ? 0x3d4253 : 0x1a1d26);
                tileGraphics.drawRect(0, 0, TILE_SIZE, TILE_SIZE);
                tileGraphics.endFill();
                // 壁ベベル（簡易版）
                tileGraphics.lineStyle(1, light > 0 ? 0x5a627a : 0x282c3a);
                tileGraphics.drawRect(1, 1, TILE_SIZE - 2, TILE_SIZE - 2);
              } else if (tile === "." || tile === " " || tile === "⛩️") {
                // 床または空白または祭壇
                tileGraphics.beginFill(light > 0 ? 0x1c2230 : 0x0f121a);
                tileGraphics.drawRect(0, 0, TILE_SIZE, TILE_SIZE);
                tileGraphics.endFill();
                // グリッド線（簡易版）
                tileGraphics.lineStyle(1, 0xffffff * 0.03); // rgba(255,255,255,0.03)
                tileGraphics.drawRect(0, 0, TILE_SIZE, TILE_SIZE);
              } else if (tile === ">") {
                // 階段下
                tileGraphics.beginFill(0x27ae60);
                tileGraphics.drawRect(0, 0, TILE_SIZE, TILE_SIZE);
                tileGraphics.endFill();
              }
              
              // タイルを配置
              tileGraphics.x = px;
              tileGraphics.y = py;
              tileLayer.addChild(tileGraphics);
            }
          }
        }
        
        // 2. エンティティ描画 (プレイヤー・ペット・モンスター) - デバッグ用に色付き矩形で仮実装
        const entities = gameState.entities || [];
        const player = gameState.player;
        
        // プレイヤーの移動パーティクル
        if (player && prevPlayerPos) {
          const dx = player.x - prevPlayerPos.x;
          const dy = player.y - prevPlayerPos.y;
          if (dx !== 0 || dy !== 0) {
            // 移動時にほこりのパーティクルを発生
            particleSystem.emitEffect('step', 
              offsetX + player.x * TILE_SIZE, 
              offsetY + player.y * TILE_SIZE, 
              3
            );
          }
        }
        
        // プレイヤーのHP変化パーティクル
        if (player && prevPlayerHp !== null) {
          if (player.hp < prevPlayerHp) {
            // ダメージを受けた
            particleSystem.emitEffect('damage',
              offsetX + player.x * TILE_SIZE,
              offsetY + player.y * TILE_SIZE,
              5
            );
            // スクリーンシェイク
            screenShake.shake('medium');
          } else if (player.hp > prevPlayerHp) {
            // 回復した
            particleSystem.emitEffect('heal',
              offsetX + player.x * TILE_SIZE,
              offsetY + player.y * TILE_SIZE,
              8
            );
          }
        }
        
        // プレイヤー位置を記録
        if (player) {
          prevPlayerPos = { x: player.x, y: player.y };
          prevPlayerHp = player.hp;
        }
        
        // フローティングテキストに応じたパーティクル
        if (gameState.floating_texts) {
          gameState.floating_texts.forEach(ft => {
            if (ft.text && ft.text.includes('🔥') || ft.text && ft.text.includes('魔法')) {
              particleSystem.emitEffect('magic_cast',
                offsetX + ft.x * TILE_SIZE,
                offsetY + ft.y * TILE_SIZE,
                10
              );
            }
          });
        }
        
        entities.forEach(ent => {
          const px = offsetX + ent.x * TILE_SIZE;
          const py = offsetY + ent.y * TILE_SIZE;

          // 息遣いアニメーション
          const bounce = Math.sin(animTime * 4 + ent.x) * 1.5;

          // エンティティのテクスチャを取得
          const entityTexture = tileTextures[ent.char];
          
          if (entityTexture) {
            // テクスチャアトラスからテクスチャを使用
            const entitySprite = new PIXI.Sprite(entityTexture.texture || entityTexture);
            entitySprite.width = TILE_SIZE;
            entitySprite.height = TILE_SIZE;
            
            // エンティティタイプ別の色調
            if (ent.is_player) {
              entitySprite.tint = 0xffffff; // プレイヤー：白
            } else if (ent.is_pet) {
              entitySprite.tint = 0xffb6c1; // ペット：ピンク
            } else {
              entitySprite.tint = 0xff6666; // モンスター：赤系
            }
            
            entitySprite.x = px;
            entitySprite.y = py + bounce;
            entityLayer.addChild(entitySprite);
          } else {
            // フォールバック: テクスチャが見つからない場合はGraphicsで描画
            const entityGraphics = new PIXI.Graphics();
            
            // エンティティタイプ別の色と形状
            if (ent.is_player) {
              // プレイヤー: 白い円
              entityGraphics.beginFill(0xffffff);
              entityGraphics.drawCircle(0, 0, TILE_SIZE * 0.4);
              entityGraphics.endFill();
            } else if (ent.is_pet) {
              // ペット: ピンクの円
              entityGraphics.beginFill(0xffb6c1);
              entityGraphics.drawCircle(0, 0, TILE_SIZE * 0.4);
              entityGraphics.endFill();
            } else {
              // モンスター: 赤い三角形（簡易表現）
              entityGraphics.beginFill(0xff0000);
              entityGraphics.moveTo(0, -TILE_SIZE * 0.3);
              entityGraphics.lineTo(-TILE_SIZE * 0.3, TILE_SIZE * 0.3);
              entityGraphics.lineTo(TILE_SIZE * 0.3, TILE_SIZE * 0.3);
              entityGraphics.closePath();
              entityGraphics.endFill();
            }
            
            // エンティティを配置
            entityGraphics.x = px;
            entityGraphics.y = py + bounce;
            entityLayer.addChild(entityGraphics);
          }
          
          // HPバー（プレイヤーとペット以外のエンティティに対して）
          if (!ent.is_player && !ent.is_pet && ent.max_hp > 0) {
            const hpRatio = Math.max(0, Math.min(1, ent.hp / ent.max_hp));
            
            // HPバーの背景
            const hpBarBg = new PIXI.Graphics();
            hpBarBg.beginFill(0x000000, 0.6);
            hpBarBg.drawRect(-TILE_SIZE * 0.5 + 2, -TILE_SIZE * 0.5 - 4, TILE_SIZE - 4, 3);
            hpBarBg.endFill();
            hpBarBg.x = px;
            hpBarBg.y = py + bounce;
            entityLayer.addChild(hpBarBg);
            
            // HPバーの前景
            const hpColor = hpRatio > 0.5 ? 0x2ecc71 : hpRatio > 0.2 ? 0xf39c12 : 0xe74c3c;
            const hpBarFg = new PIXI.Graphics();
            hpBarFg.beginFill(hpColor);
            hpBarFg.drawRect(-TILE_SIZE * 0.5 + 2, -TILE_SIZE * 0.5 - 4, (TILE_SIZE - 4) * hpRatio, 3);
            hpBarFg.endFill();
            hpBarFg.x = px;
            hpBarFg.y = py + bounce;
            entityLayer.addChild(hpBarFg);
          }
        });
        
        // 3. アイテム描画
        const items = gameState.items || [];
        items.forEach(item => {
          const px = offsetX + item.x * TILE_SIZE;
          const py = offsetY + item.y * TILE_SIZE;

          // アイテムのテクスチャを取得
          const itemTexture = tileTextures[item.char];
          
          if (itemTexture) {
            // テクスチャアトラスからテクスチャを使用
            const itemSprite = new PIXI.Sprite(itemTexture.texture || itemTexture);
            itemSprite.width = TILE_SIZE;
            itemSprite.height = TILE_SIZE;
            
            // 品質に応じて色調を変更
            const qualityColors = {
              'common': 0xcccccc,
              'uncommon': 0x33ff33,
              'rare': 0x3366ff,
              'epic': 0x9933ff,
              'legendary': 0xffaa00
            };
            const tint = qualityColors[item.quality] || 0xffffff;
            itemSprite.tint = tint;
            
            itemSprite.x = px;
            itemSprite.y = py;
            entityLayer.addChild(itemSprite);
          } else {
            // フォールバック: テクスチャが見つからない場合はGraphicsで描画
            const itemGraphics = new PIXI.Graphics();
            
            // アイテムの背景
            itemGraphics.beginFill(0x000000, 0.5);
            itemGraphics.drawRect(0, 0, TILE_SIZE, TILE_SIZE);
            itemGraphics.endFill();
            
            // アイテム文字を表示
            itemGraphics.beginFill(0xffffff);
            itemGraphics.drawRect(4, 4, TILE_SIZE - 8, TILE_SIZE - 8);
            itemGraphics.endFill();
            
            // アイテムを配置
            itemGraphics.x = px;
            itemGraphics.y = py;
            entityLayer.addChild(itemGraphics);
          }
        });
        
        // TODO: エフェクト描画（パーティクル、ライティング等）
      }
      // レンダリングはPixiJSが自動的に行うため、requestAnimationFrameは不要
    }

    // PixiJSのtickerでレンダリングループを開始
    pixiApp.ticker.add(() => {
      render();
    });

    // ==================== STATE SYNC & API ====================
    async function fetchState() {
      try {
        const res = await fetch("/api/state");
        if (res.ok) {
          gameState = await res.json();
          updateUI(gameState);
        }
      } catch (err) {
        console.error("State sync failed:", err);
      }
    }
    setInterval(fetchState, 300);
    fetchState();

    async function sendAction(actionName, payload = {}) {
      try {
        const res = await fetch("/api/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: actionName, ...payload })
        });
        if (res.ok) {
          gameState = await res.json();
          updateUI(gameState);
          SoundEngine.playSE("hit");
        }
      } catch (err) {
        console.error("Action dispatch failed:", err);
      }
    }

    // ==================== UI UPDATE ====================
    function updateUI(state) {
      if (!state || !state.player) return;
      const p = state.player;
      const pet = state.pet;

      // Header Chips
      document.getElementById("chipFloor").innerText = `階層: B${state.dungeon_level || 1}F`;
      document.getElementById("chipGold").innerText = `💰 ${p.gold} G`;
      document.getElementById("chipPlatinum").innerText = `💎 ${p.platinum} P`;
      document.getElementById("chipKarma").innerText = `⚖️ 善悪: ${p.karma}`;

      // Player Vitals
      document.getElementById("hudPlayerName").innerText = `${p.name} (Lv.${p.level} ${p.job})`;
      const hpPct = Math.max(0, Math.min(100, (p.hp / p.max_hp) * 100));
      document.getElementById("barHP").style.width = `${hpPct}%`;
      document.getElementById("valHP").innerText = `${p.hp}/${p.max_hp}`;

      const mpPct = Math.max(0, Math.min(100, (p.mp / p.max_mp) * 100));
      document.getElementById("barMP").style.width = `${mpPct}%`;
      document.getElementById("valMP").innerText = `${p.mp}/${p.max_mp}`;

      const hungerPct = Math.max(0, Math.min(100, (p.hunger / 2000) * 100));
      document.getElementById("barHunger").style.width = `${hungerPct}%`;
      document.getElementById("valHunger").innerText = p.hunger > 1500 ? "満腹" : p.hunger > 800 ? "普通" : "空腹";

      // Pet Vitals
      if (pet && pet.name) {
        document.getElementById("hudPetName").innerText = `妹分『${pet.name}』`;
        const petHpPct = Math.max(0, Math.min(100, (pet.hp / pet.max_hp) * 100));
        document.getElementById("barPetHP").style.width = `${petHpPct}%`;
        document.getElementById("valPetHP").innerText = `${pet.hp}/${pet.max_hp}`;
        document.getElementById("valPetTactic").innerText = `指示: ${pet.tactic || 'バランス'}`;
      }

      // Inventory List
      const invContainer = document.getElementById("inventoryList");
      if (state.inventory && state.inventory.length > 0) {
        invContainer.innerHTML = state.inventory.map(item => `
          <div class="item-entry ${item.equipped ? 'equipped' : ''}">
            <span>${item.char} ${item.name}</span>
            <span style="color: var(--text-muted);">${item.weight}s</span>
          </div>
        `).join("");
      } else {
        invContainer.innerHTML = `<div style="color: var(--text-muted); text-align: center;">荷物は空です</div>`;
      }

      // Stats Tab
      if (p.attributes) {
        const statsEl = document.getElementById("statsContent");
        statsEl.innerHTML = `
          <div>腕力 (STR): <b>${p.attributes.str}</b></div>
          <div>耐久 (END): <b>${p.attributes.end}</b></div>
          <div>器用 (DEX): <b>${p.attributes.dex}</b></div>
          <div>感覚 (PER): <b>${p.attributes.per}</b></div>
          <div>習得 (LER): <b>${p.attributes.ler}</b></div>
          <div>意志 (WIL): <b>${p.attributes.wil}</b></div>
          <div>魔力 (MAG): <b>${p.attributes.mag}</b></div>
          <div>魅力 (CHA): <b>${p.attributes.cha}</b></div>
          <div style="grid-column: span 2; margin-top: 6px; color: #ffd700;">信仰: ${p.god} (信仰度: ${p.piety})</div>
        `;
      }

      // Quests Tab
      const questEl = document.getElementById("questList");
      if (state.quests && state.quests.length > 0) {
        questEl.innerHTML = state.quests.map(q => `
          <div class="item-entry" style="${q.completed ? 'opacity: 0.6;' : ''}">
            <div>
              <div style="font-weight: 600;">${q.title}</div>
              <div style="font-size: 0.7rem; color: var(--text-muted);">${q.target}: ${q.current}/${q.needed}</div>
            </div>
            <div style="color: #ffd700;">+${q.reward_gold}G</div>
          </div>
        `).join("");
      } else {
        questEl.innerHTML = `<div style="color: var(--text-muted); text-align: center;">受領中の依頼はありません</div>`;
      }

      // Logs
      const logContainer = document.getElementById("logContainer");
      if (state.logs) {
        logContainer.innerHTML = state.logs.map(log => `
          <div class="log-entry ${log.level || 'INFO'}">${log.text}</div>
        `).join("");
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab-content").forEach(el => el.style.display = "none");
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
      document.getElementById(tabId).style.display = "block";
      event.target.classList.add("active");
    }

    // ==================== KEYBOARD CONTROLS ====================
    window.addEventListener("keydown", (e) => {
      const keyMap = {
        "ArrowUp": "up", "KeyW": "up", "Numpad8": "up",
        "ArrowDown": "down", "KeyS": "down", "Numpad2": "down",
        "ArrowLeft": "left", "KeyA": "left", "Numpad4": "left",
        "ArrowRight": "right", "KeyD": "right", "Numpad6": "right",
        "Numpad7": "up_left", "Numpad9": "up_right",
        "Numpad1": "down_left", "Numpad3": "down_right",
        "Space": "wait", "Numpad5": "wait",
        "KeyG": "pickup",
        "KeyF": "cast_fireball",
        "KeyQ": "use_potion",
        "KeyP": "pray"
      };

      if (keyMap[e.code]) {
        e.preventDefault();
        sendAction(keyMap[e.code]);
      }
    });
    });

    // ==================== THEME MANAGER ====================
    // Persists the selected visual theme (dark / light / high-contrast /
    // colorblind / sepia) and applies it via <html data-theme="...">.
    const ThemeManager = (() => {
      const STORAGE_KEY = 'narou-theme';
      const VALID = ['dark', 'light', 'high-contrast', 'colorblind', 'sepia'];
      const root = document.documentElement;

      function current() {
        return root.dataset.theme || 'dark';
      }

      function apply(theme) {
        if (!VALID.includes(theme)) theme = 'dark';
        root.dataset.theme = theme;
        try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
        document.querySelectorAll('#themeSwitch button').forEach((btn) => {
          const active = btn.dataset.themeValue === theme;
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      }

      function init() {
        let saved = 'dark';
        try { saved = localStorage.getItem(STORAGE_KEY) || 'dark'; } catch (e) {}
        apply(saved);
        const sw = document.getElementById('themeSwitch');
        if (sw) {
          sw.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-theme-value]');
            if (btn) apply(btn.dataset.themeValue);
          });
        }
      }

      return { apply, current, init };
    })();
    ThemeManager.init();
  </script>
</body>
</html>
