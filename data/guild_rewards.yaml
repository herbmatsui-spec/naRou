guild_rewards:
  adventurers_guild:
    rank_rewards:
      novice:
        - type: "title"
          value: "guild_novice"
      member:
        - type: "title"
          value: "guild_member"
        - type: "skill_unlock"
          value: "guild_training"
      veteran:
        - type: "title"
          value: "guild_veteran"
        - type: "stat_bonus"
          value:
            strength: 2
            dexterity: 2
      officer:
        - type: "title"
          value: "guild_officer"
        - type: "facility_unlock"
          value: "private_vault"
        - type: "exclusive_skill"
          value: "heroic_shout"
      leader:
        - type: "title"
          value: "guild_master"
        - type: "stat_bonus"
          value:
            strength: 5
            dexterity: 5
            endurance: 5
    leaderboard_rewards:
      - rank_range: [1, 1]
        reward:
          gold: 50000
          platinum: 50
          title: "guild_top_legend"
      - rank_range: [2, 10]
        reward:
          gold: 15000
          platinum: 20
          title: "guild_top_ranker"
