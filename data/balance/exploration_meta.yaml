      base_atk: 400
      reward_aldo: 20000
      encounter_rate_per_depth: 0.005
    - id: "shadow_broker_02"
      name: "闇ブローカー・ヴェノム"
      min_depth: 60
      base_hp: 10000
      base_atk: 500
      reward_aldo: 30000
      encounter_rate_per_depth: 0.005
    - id: "shadow_broker_03"
      name: "闇ブローカー・ゴースト"
      min_depth: 100
      base_hp: 12000
      base_atk: 600
      reward_aldo: 50000
