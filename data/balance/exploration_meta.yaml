# 概念結晶ドロップ率設定
concept_crystal_drops:
  first_floor_boss:
    base_rate: 0.15
    depth_bonus_per_level: 0.005
    rank_bonus_per_level: 0.05
    first_clear_bonus: 0.20
    max_rate: 0.95
    crystal_categories: ["Fire", "Ice", "Lightning", "Dark", "Holy", "Physical", "Arcane"]
  secret_area:
    base_rate: 0.25
    depth_bonus_per_level: 0.003
    rank_bonus_per_level: 0.05
    first_clear_bonus: 0.15
    max_rate: 0.95
    crystal_categories: ["Shadow", "Illusion", "Space", "Time", "Mind", "Soul"]
  faction_boss:
    base_rate: 0.30
    depth_bonus_per_level: 0.002
    rank_bonus_per_level: 0.03
    first_clear_bonus: 0.10
    max_rate: 0.95
    crystal_categories: ["Order", "Chaos", "Wealth", "Knowledge", "Power", "Freedom"]
  deep_bounty:
    base_rate: 0.50
    depth_bonus_per_level: 0.001
    rank_bonus_per_level: 0.02
    first_clear_bonus: 0.0
    max_rate: 0.95
    crystal_categories: ["Void", "Genesis", "Absolute", "Origin", "End", "Infinity"]

# ニューゲーム+ 引継ぎボーナス上限
new_game_plus:
  max_bonus_cap: 50
  depth_bonus_mult: 1           # depth // 10 * mult → 全ステータス
  secret_bonus_mult: 2          # secrets * mult → アイテム発見率
  faction_bonus_mult: 5         # 総友好度 // 10 * mult → 派閥評価
  base_tier_mult: 1             # base_tier * mult → 初期施設レベル
  rank_bonus_mult: 100          # rank * mult → 初期探索経験値
  ascension_bonus_mult: 5       # nodes * 5% * mult → ダメージ倍率
  crystal_bonus_mult: 10        # crystals * mult → 初期MP

# 周回スケーリング
cycle_scaling:
  enemy_hp_mult_per_cycle: 0.15     # 転生毎に敵HP +15%
  enemy_atk_mult_per_cycle: 0.10    # 転生毎に敵ATK +10%
  reward_mult_per_cycle: 0.20       # 転生毎に報酬 +20%
  max_cycle_mult: 5.0               # 最大倍率