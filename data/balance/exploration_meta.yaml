# 探索メタプログレッション バランス設定
# Phase 7: バランス調整パラメータ

# 探索経験値計算式
exploration_exp:
  base_multiplier: 10           # depth * room_count * base_multiplier
  first_visit_bonus: 500        # 初見部屋ボーナス
  first_floor_bonus: 1000       # 初見フロアボーナス
  secret_room_bonus: 2000       # 秘密部屋ボーナス
  floor_clear_base: 200         # フロアクリア基礎 (depth * floor_clear_base)
  floor_clear_per_floor: 100    # クリア済みフロア数 * floor_clear_per_floor

# 探索ランク設定
exploration_rank:
  exp_per_rank: 1000            # ランクアップ必要経験値
  max_rank: 99                  # 最大ランク

# アセンションノード解放条件
ascension_nodes:
  deep_delver:
    thresholds: [50, 100, 150, 200]  # 深度閾値
    max_level: 4
    buff_per_level:
      all_resistance: 10
      max_hp_bonus: 50
  full_clearer:
    thresholds: [99]               # 全フロア数
    max_level: 1
    buff_per_level:
      item_find_rate: 25
      gold_gain: 20
  secret_finder:
    thresholds: [50]               # 秘密部屋発見数
    max_level: 1
    buff_per_level:
      crit_rate: 15
      secret_detection: 50
  speed_runner:
    thresholds: [10000]            # ターン数（未実装：深度経験値で代用）
    max_level: 1
    buff_per_level:
      speed: 10
      turn_time_reduction: 15
  hazard_master:
    thresholds: [100]              # ハザード0維持フロア数（未実装：フロアクリア数で代用）
    max_level: 1
    buff_per_level:
      hazard_resistance: 100
      mp_cost_reduction: 20

# バウンティ設定
bounty:
  deep_targets:
    abyss_warden:
      min_depth: 100
      base_hp: 15000
      base_atk: 800
      reward_aldo: 50000
      reward_crystal: "Concept of Absolute Void"
    void_stalker:
