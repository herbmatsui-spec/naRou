# 記憶フラグメント設定 (Steps 13, 14, 6拡張)
# 考古学・発掘・解読メタゲーム用に glyph_script / cipher_type / decoder_hint / truth_link を拡張。
# 既存キー (id/name/description/trigger_conditions/unlock_requirement/effects/resolution_paths) は維持。

memory_fragments:
  goblin_child_screams:
    id: "goblin_child_screams"
    name: "ゴブリン子どもの悲鳴"
    description: "洞窟の奥から響いた微かな幼き声。魔物にも家族や命の重みがあるのか…？"
    trigger_conditions:
      - "kill_goblin_count_10"
    unlock_requirement: "dungeon_goblin_depth_3"
    effects:
      karma_dilemma: true
    resolution_paths:
      - "spared_cubs"
      - "ruthless_extermination"
    cipher_type: "goblin_rune"
    glyph_script: "⟁⟟⌖⏃⌖ ⏚⟒⏚⟒ ⏃⌖⟒⏚⟟⌖ ⟁⟟⏚"
    translated_text: "小さな命が哭いている。母を呼び、光を恐れ、ただ巣の温もりを求めて震えていた。"
    decoder_hint: "ゴブリンの唄には『家族』を表す繰り返しの刻印がある。"
    truth_link: "truth_of_coexistence"

  ancient_hero_memory:
    id: "ancient_hero_memory"
    name: "古の英雄の残響"
    description: "かつてこの世界を救った無名の戦士の最後の祈り。"
    trigger_conditions:
      - "descend_stairs_depth_10"
    unlock_requirement: "depth_10"
    effects:
      skill_potential_boost: 10
    resolution_paths:
      - "inherit_will"
    cipher_type: "heroic_glyph"
    glyph_script: "☉⟡⌬⟡☉ ⌖⟒⏚⟟⌖ ⟁⟟⏚⟒⏚ ⌬⟡⌬"
    translated_text: "我が剣折れ、盾砕くとも、星の導きが汝の歩みを照らし続けんことを。守るべき者のために立て。"
    decoder_hint: "英雄の碑文は『守る』という語で始まる祈りの定型句を持つ。"
    truth_link: "truth_of_inheritance"

  # ---- 新規追加断片 (Step 6) ----
  sunken_civ_tablet:
    id: "sunken_civ_tablet"
    name: "沈没文明の石板"
    description: "海底から引き揚げられた石板。未知の文字列が波のように刻まれている。"
    trigger_conditions:
      - "excavate_abyssal_dig"
    unlock_requirement: "depth_20"
    effects:
      lore_sea: true
    resolution_paths:
      - "surface_truth"
    cipher_type: "abyssal_script"
    glyph_script: "⌁⟒⏚⟟⌖ ⟁⟟⏚⟒⏚ ⏃⌖⟒⏚ ⟟⌖⟁⟟⏚"
    translated_text: "海の下に眠りし都は、記憶の結晶を抱きて沈みゆく。潮騒が全ての罪を洗い流すまで。"
    decoder_hint: "深淵の文字は『水』と『記憶』を結ぶ二重写しの記号を含む。"
    truth_link: "truth_of_drowned_age"

  star_chart_shard:
    id: "star_chart_shard"
    name: "星図の欠片"
    description: "夜空を切り取ったように光る破片。星座の間に細い文字が潜む。"
    trigger_conditions:
      - "excavate_hero_sanctum"
    unlock_requirement: "depth_10"
    effects:
      lore_cosmos: true
    resolution_paths:
      - "read_the_stars"
    cipher_type: "heroic_glyph"
    glyph_script: "☉⟡⌬ ⏃⌖⟒⏚⟟⌖ ⟁⟟⏚⟒⏚ ☉⟡⌬⟡☉"
    translated_text: "空巡る天体の軌跡は定められり。滅びの刻限を告げる明星が赤く燃え上がるとき、封印は解かれん。"
    decoder_hint: "星図は英雄の碑文と同じ言語族だが、『巡る』を表す語を足す。"
    truth_link: "truth_of_inheritance"

  traitor_kings_will:
    id: "traitor_kings_will"
    name: "裏切り王の遺言"
    description: "玉座の下に埋められていた巻物。誰も読めぬはずの文字で綴られている。"
    trigger_conditions:
      - "excavate_goblin_ruins"
    unlock_requirement: "dungeon_goblin_depth_3"
    effects:
      lore_throne: true
    resolution_paths:
      - "judge_the_king"
    cipher_type: "goblin_rune"
    glyph_script: "⟁⟟⏚ ⏚⟒⏚⟒ ⟁⟟⌖⏃⌖ ⟟⌖⟁⟟⏚⟒⏚"
    translated_text: "予は玉座を捨て、同胞を裏切ったのではない。ただ滅びゆく民に永劫の眠りを与えたのだ。"
    decoder_hint: "王の文字はゴブリンの刻印に似るが、『王』を意味する逆さの印がある。"
    truth_link: "truth_of_coexistence"

  # ---- テスト・拡張用断片 (Step 42) ----
  genesis_stone:
    id: "genesis_stone"
    name: "創世の楔石"
    description: "始まりの光を閉じ込めた石板。古代の創世神話が記されている。"
    trigger_conditions:
      - "excavate_ancient_shrine"
    unlock_requirement: "depth_5"
    effects:
      lore_genesis: true
    resolution_paths:
      - "touch_creation"
    cipher_type: "heroic_glyph"
    glyph_script: "☉⟡⌬ ⟁⟟⌖ ⏚⟒⏚⟒ ⏃⌖⟒⏚ ☉⟡⌬"
    translated_text: "はじめに混沌ありき。神々は大地を裂き、天を仰ぎ、命の樹を植えたり。"
    decoder_hint: "創世の記号は太陽と光を示す定型句で始まる。"
    truth_link: "truth_of_inheritance"

  dragon_covenant:
    id: "dragon_covenant"
    name: "竜神の盟約書"
    description: "灼熱の竜鱗に彫り込まれた盟約。触れると熱気を帯びている。"
    trigger_conditions:
      - "kill_dragon_count_1"
    unlock_requirement: "depth_15"
    effects:
      lore_dragon: true
    resolution_paths:
      - "accept_pact"
    cipher_type: "abyssal_script"
    glyph_script: "⌁⟒⏚ ⟁⟟⏚⟒⏚ ⏃⌖⟒⏚⟟⌖ ⌁⟒⏚"
    translated_text: "竜の焔は永久に消えず。汝の魂を捧げよ、さらば無限の力を授けん。"
    decoder_hint: "竜の言葉は深淵の記号と似通い、炎と契約を意味する文字が重なる。"
    truth_link: "truth_of_drowned_age"

