# プロシージャルシナリオ設定 (Steps 1, 2)

scenario_templates:
  goblin_invasion:
    id: "goblin_invasion"
    name: "ゴブリンの侵略"
    description: "周辺農村を襲撃するゴブリン部隊と、その背後で蠢く不気味な呪術師の脅威。"
    chapters:
      - id: "chapter_1_outpost"
        name: "第1章: 前哨地の襲撃"
        type: "dungeon_incursion"
        objectives:
          kill_target: "ゴブリン"
          count: 5
        choices:
          - id: "save_farm_survivors"
            description: "囚われた農民たちを救出する"
            consequence: "farm_survivor_saved"
          - id: "rush_boss"
            description: "救出を無視して敵指揮官を強襲する"
            consequence: "boss_slain_early"

      - id: "chapter_2_shaman"
        name: "第2章: 邪悪なる儀式"
        type: "ritual_disruption"
        objectives:
          kill_target: "ゴブリン呪術師"
          count: 1
        choices:
          - id: "purify_altar"
            description: "祭壇を浄化し呪いを解く"
            consequence: "altar_purified"
          - id: "absorb_power"
            description: "邪悪な魔力を自らに吸収する"
            consequence: "dark_power_absorbed"

# =============================================================
# プロシージャル・クエスト生成設定 (Steps 1-8)
# 依頼ボード / ランダムダンジョン探索 / NPC個別クエスト を
# アーキタイプ × 難易度 × 報酬 × 舞台 の組み合わせで自動生成する。
# 既存 scenario_templates は維持（後方互換）。
# =============================================================
quest_generation:
  # Step 2: クエストアーキタイプ (7種)
  archetypes:
    slay:
      name: "討伐"
      objective_type: "kill"
      title_template: "{setting}の{enemy}討伐"
      desc_template: "{setting}に蠢く{enemy}を{required_count}体討伐せよ。"
      reward_weight: 1.0
      base_complexity: 1
    gather:
      name: "採取"
      objective_type: "collect"
      title_template: "{setting}の{item}採取"
      desc_template: "{setting}から{item}を{required_count}個持ち帰れ。"
      reward_weight: 0.8
      base_complexity: 1
    escort:
      name: "護衛"
      objective_type: "escort"
      title_template: "{setting}への護衛任務"
      desc_template: "依頼主を{setting}まで無事に送り届けよ（{required_count}回の遭遇）。"
      reward_weight: 1.2
      base_complexity: 2
    explore:
      name: "探索"
      objective_type: "explore"
      title_template: "{setting}の深部調査"
      desc_template: "{setting}を{required_count}階層まで踏破せよ。"
      reward_weight: 1.1
      base_complexity: 2
    boss_hunt:
      name: "ボス討伐"
      objective_type: "kill"
      title_template: "{setting}の覇者討伐"
      desc_template: "{setting}を支配する{boss}を討ち取れ。"
      reward_weight: 1.6
      base_complexity: 3
    rescue:
      name: "救出"
      objective_type: "rescue"
      title_template: "{setting}の囚われし者"
      desc_template: "{setting}に囚われた者を{required_count}名救い出せ。"
      reward_weight: 1.3
      base_complexity: 2
    delivery:
      name: "配達"
      objective_type: "delivery"
      title_template: "{setting}への急便"
      desc_template: "{item}を{setting}の届け先へ運べ。"
      reward_weight: 0.7
      base_complexity: 1

  # Step 3: 難易度ティア (6段階, 指数スケーリング)
  difficulty_tiers:
    tutorial:
      name: "序"
      level_range: [1, 5]
      enemy_multiplier: 1.0
      objective_complexity: 1.0
      recommended_power: 10
    easy:
      name: "低"
      level_range: [5, 15]
      enemy_multiplier: 1.6
      objective_complexity: 1.25
      recommended_power: 40
    normal:
      name: "中"
      level_range: [15, 35]
      enemy_multiplier: 2.6
      objective_complexity: 1.6
      recommended_power: 120
    hard:
      name: "高"
      level_range: [35, 60]
      enemy_multiplier: 4.3
      objective_complexity: 2.0
      recommended_power: 400
    extreme:
      name: "極"
      level_range: [60, 90]
      enemy_multiplier: 7.0
      objective_complexity: 2.6
      recommended_power: 1400
    abyss:
      name: "深淵"
      level_range: [90, 120]
      enemy_multiplier: 11.5
      objective_complexity: 3.3
      recommended_power: 5000

  # Step 4: 報酬テーブル (5段階)
  reward_tables:
    copper:
      name: "銅"
      gold_range: [20, 80]
      exp_range: [10, 40]
      item_pool: ["heal_herb", "bread", "stone"]
      bonus: {fame: 1, relationship: 0, meta: 0}
    silver:
      name: "銀"
      gold_range: [80, 250]
      exp_range: [40, 120]
      item_pool: ["potion_heal", "iron_ingot", "lockpick"]
      bonus: {fame: 3, relationship: 1, meta: 0}
    gold:
      name: "金"
      gold_range: [250, 800]
      exp_range: [120, 400]
      item_pool: ["steel_ingot", "magic_scroll", "gem"]
      bonus: {fame: 8, relationship: 2, meta: 1}
    rainbow:
      name: "虹"
      gold_range: [800, 2500]
      exp_range: [400, 1200]
      item_pool: ["rune_ore", "spirit_gem", "ancient_book"]
      bonus: {fame: 20, relationship: 4, meta: 3}
    legendary:
      name: "伝説"
      gold_range: [2500, 8000]
      exp_range: [1200, 4000]
      item_pool: ["dragon_scale", "holy_relic", "phoenix_feather"]
      bonus: {fame: 50, relationship: 8, meta: 8}

  # Step 5: 舞台設定 (8種)
  stage_settings:
    town:
      name: "街"
      flavor: "石畳の街並みと人混み"
      enemy_pool: ["bandit", "stray_dog", "pickpocket"]
      hazard: "群衆の混乱"
      depth_modifier: 0.8
      environmental_modifier: 0.9
    forest:
      name: "森"
      flavor: "苔生した巨木の深い森"
      enemy_pool: ["wolf", "goblin", "slime"]
      hazard: "毒の沼"
      depth_modifier: 1.0
      environmental_modifier: 1.0
    cave:
      name: "洞窟"
      flavor: "ひんやりとした湿った岩窟"
      enemy_pool: ["goblin", "bat", "cave_bear"]
      hazard: "暗闇"
      depth_modifier: 1.1
      environmental_modifier: 1.05
    ruins:
      name: "遺跡"
      flavor: "風化した古代の神殿"
      enemy_pool: ["skeleton", "ghost", "golem"]
      hazard: "崩落"
      depth_modifier: 1.2
      environmental_modifier: 1.1
    volcano:
      name: "火山"
      flavor: "灼熱の溶岩が奔る地"
      enemy_pool: ["fire_lizard", "magma_elemental", "ifrit"]
      hazard: "溶岩"
      depth_modifier: 1.3
      environmental_modifier: 1.2
    snowfield:
      name: "雪原"
      flavor: "果てしなく広がる銀白の世界"
      enemy_pool: ["yeti", "frost_wolf", "ice_sprite"]
      hazard: "吹雪"
      depth_modifier: 1.2
      environmental_modifier: 1.15
    swamp:
      name: "沼"
      flavor: "腐った泥と瘴気の湿原"
      enemy_pool: ["slime", "crocodile", "venom_toad"]
      hazard: "瘴気"
      depth_modifier: 1.1
      environmental_modifier: 1.1
    abyss:
      name: "深淵"
      flavor: "光の届かぬ底なき闇"
      enemy_pool: ["abyssal_horror", "void_lord", "nightmare"]
      hazard: "精神汚染"
      depth_modifier: 1.6
      environmental_modifier: 1.4

  # Step 6: NPC個別クエストテーマ
  npc_quest_themes:
    villager:
      npc_type: "villager"
      quest_pool: ["rescue", "delivery", "gather"]
      relationship_gate: 1
      flavor: "{npc}「お願いがあるんだ…」"
    merchant:
      npc_type: "merchant"
      quest_pool: ["delivery", "gather", "escort"]
      relationship_gate: 2
      flavor: "{npc}「良い品を届けてくれないか？」"
    noble:
      npc_type: "noble"
      quest_pool: ["escort", "boss_hunt", "explore"]
      relationship_gate: 3
      flavor: "{npc}「我が家の威信にかけて依頼する。」"
    priest:
      npc_type: "priest"
      quest_pool: ["rescue", "explore", "boss_hunt"]
      relationship_gate: 2
      flavor: "{npc}「神の御名の下、助けを求む。」"
    adventurer:
      npc_type: "adventurer"
      quest_pool: ["slay", "boss_hunt", "explore"]
      relationship_gate: 1
      flavor: "{npc}「一緒に戦ってくれ！」"

  # Step 8: 依頼ボード設定
  request_board:
    max_active: 8
    refresh_cycle: 100
    type_weights:
      slay: 3
      gather: 2
      escort: 1
      explore: 2
      boss_hunt: 1
      rescue: 1
      delivery: 2
    min_difficulty: "tutorial"
    max_difficulty: "normal"

  # Step 5-8: 表示名の日本語ローカライズマップ
  display_names:
    enemy:
      goblin: "ゴブリン"
      wolf: "オオカミ"
      slime: "スライム"
      skeleton: "スケルトン"
      ghost: "ゴースト"
      golem: "ゴーレム"
      fire_lizard: "ファイアリザード"
      magma_elemental: "マグマエレメンタル"
      ifrit: "イフリート"
      yeti: "イエティ"
      frost_wolf: "フロストウルフ"
      ice_sprite: "アイススプライト"
      crocodile: "クロコダイル"
      venom_toad: "ベノムトード"
      abyssal_horror: "アビサルホラー"
      void_lord: "ヴォイドロード"
      nightmare: "ナイトメア"
      bandit: "バンディット"
      pickpocket: "スリ"
      stray_dog: "野良犬"
      cave_bear: "ケイブベア"
      bat: "コウモリ"
    item:
      heal_herb: "癒しのハーブ"
      stone: "石"
      bread: "パン"
      iron_ingot: "鉄インゴット"
      steel_ingot: "鋼インゴット"
      lockpick: "鍵開け道具"
      potion_heal: "回復薬"
      magic_scroll: "魔導書の書簡"
      gem: "宝石"
      rune_ore: "ルーン鉱石"
      spirit_gem: "精霊石"
      ancient_book: "古代魔導書"
      dragon_scale: "竜の鱗"
      holy_relic: "聖なる遺物"
      phoenix_feather: "フェニックスの羽"
    stage:
      town: "街"
      forest: "森"
      cave: "洞窟"
      ruins: "遺跡"
      volcano: "火山"
      snowfield: "雪原"
      swamp: "沼"
      abyss: "深淵"
    difficulty:
      tutorial: "序"
      easy: "低"
      normal: "中"
      hard: "高"
      extreme: "極"
      abyss: "深淵"

  # Step 15-16: 連鎖クエスト（報酬カスケード）設定
  chain_config:
    max_depth: 5
    difficulty_escalation: 1
    reward_escalation: 1
    gold_multiplier_per_depth: 1.5
    exp_multiplier_per_depth: 1.4
    cascade_fame_per_depth: 2
    cascade_relationship_per_depth: 1
    cascade_meta_per_depth: 1
