# ワールドイベント設定 (Steps 11, 12)

world_events:
  blood_moon:
    id: "blood_moon"
    name: "血の月"
    description: "天球が紅く染まり、あらゆる魔物の凶暴性と出現頻度が増大する怪異。"
    trigger_conditions:
      turns_interval: 500
      chance: 0.15
    duration: 100
    effects:
      enemy_dmg_mult: 1.30
      exp_gain_mult: 1.50
      night_vision_penalty: 2
    story_triggers:
      - "nightmare_dreams"
      - "undead_uprising"

  abundant_harvest:
    id: "abundant_harvest"
    name: "豊穣の祝祭"
    description: "大地の神の祝福により農作物と採取ノードの収穫量が倍増する。"
    trigger_conditions:
      turns_interval: 800
      chance: 0.20
    duration: 150
    effects:
      harvest_yield_mult: 2.0
      food_nutrition_mult: 1.25
    story_triggers:
      - "festival_merchant_visit"

  interworld_invasion:
    id: "interworld_invasion"
    name: "異界の侵攻"
    description: "異世界の門が開き、強大な敵が襲来する。"
    trigger_conditions:
      turns_interval: 1000
      chance: 0.1
    duration: 200
    effects:
      enemy_spawn_mult: 1.5
      rare_item_drop_chance: 0.2
    story_triggers:
      - "interworld_war"
    quarter: 1
    rewards:
      special_currency: "interworld_points"
      item_drops:
        "interworld_key": 0.1
        "alien_technology": 0.05
    rankings:
      type: "points"
      point_sources:
        "alien_soldier": 100
        "alien_commander": 500
    titles:
      - condition: "points >= 1000"
        title: "異世界の征服者"
        description: "異界の侵攻で1000ポイント以上を獲得した証"
      - condition: "points >= 5000"
        title: "星間の英雄"
        description: "異界の侵攻で5000ポイント以上を獲得した伝説の戦士"
    community_goal:
      type: "total_points"
      target: 100000
      reward: "global_exp_boost_2x"
    announcement_period: 50
    start_turn: 1000
    end_turn: 1200
