# Monster Abilities - Phase 2 Step 47
# 15能力の実定義 (monsters.yaml で宣言されている全スキルの実体)

# ==========================================
# 投擲・遠距離攻撃
# ==========================================

throw_stone:
  name: "投石"
  description: "石を投げて遠距離から攻撃する"
  cost: 1
  cooldown: 2
  range: 6
  target_type: "single"
  effect:
    type: "damage"
    element: "physical"
    dice_num: 1
    dice_side: 6
    dmg_bonus: 2
  sound: "throw"
  ai_hint: "ranged"

# ==========================================
# 近接・物理攻撃
# ==========================================

power_bash:
  name: "力強打"
  description: "力を込めた強力な一撃"
