  target_type: "single"
  effect:
    type: "damage"
    element: "physical"
    dice_num: 2
    dice_side: 8
    dmg_bonus: 4
  sound: "bash"
  ai_hint: "melee"

backstab:
  name: "背面攻撃"
  description: "敵の背後から急所を突く"
