# ==========================================
# 共通プロパティ説明
# ==========================================
# cost: AP消費量 (1手2AP制)
# cooldown: 再使用までのターン数
# range: 射程 (0=自己, 1=隣接, N=Nマス先)
# radius: 範囲攻撃の半径
# target_type: single/area/self/beam
# ai_hint: AIがこのスキルを選ぶ際のヒント (ranged/melee/heal/support/utility/debuff/summon)