# 想定HP/攻撃力/コスト対効果の基準値 (Step 43)
standards:
  levels:
    1:
      min_hp: 20
      max_hp: 50
      min_attack: 3
      max_attack: 12
    5:
      min_hp: 50
      max_hp: 120
      min_attack: 10
      max_attack: 30
    10:
      min_hp: 120
      max_hp: 300
      min_attack: 25
      max_attack: 70

economy:
  max_gold_per_dungeon_floor: 5000
  item_value_weight_ratio_max: 2000.0

skills:
  efficiency_threshold_ratio: 5.0

reincarnation:
  max_stat_growth_factor_per_cycle: 1.5

# --- 計測器が使う判定基準 (S2.3) ---
# 閾値はコードに埋め込まず、ここだけを参照する。
simulation:
  # これ以上のターンで終わらない戦闘は「膠着」とみなす ( Stall )。
  max_turns: 100
  # 経済計測の実行条件。実ダンジョン1階をこのレベルのプレイヤーが全撃破するまでの
  # 獲得ゴールドを「1 フロアあたりの獲得ゴールド」として実測する。
  # 階と GOLD は計測ごとに初期状態へ戻すので、この値は試行回数に依存しない。
  economy_floor_run:
    player_level: 1
    max_turns: 2000

judgement:
  # 勝率が期待値から許容する乖離。
  win_rate_tolerance: 0.3
  # 期待勝率が 1.0 未満のシナリオで勝率がここに張り付いたら「絶対勝利」とみなして FAIL とする。
  absolute_victory_win_rate: 1.0
  # 被与ダメージ比 (与ダメージ / 被ダメージ) の下限。
  # 相手の寄与がこれを下回る戦闘は「一方的な殴り合い」であって平衡の証拠ではない。
  min_damage_taken_ratio: 0.1
  # 一撃で倒し切る・一撃で倒される戦闘の割合の上限。
  max_one_shot_rate: 0.1
