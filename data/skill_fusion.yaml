# Skill Fusion Definition for naRou
# Structure: fusions: { fusion_id: { name, description, required_skills, required_job, required_god, result_skills, bonus_effects } }

fusions:
  spellblade:
    name: "魔剣術"
    description: "剣術と魔法を融合させ、武器に魔力を宿す技術"
    required_skills:
      - "sword_mastery"
      - "magic_basic"
    required_job: "warrior"
    result_skills:
      - "elemental_slash"
      - "mana_blade"
    bonus_effects:
      - type: "elemental_damage"
        value: 20
      - type: "mp_on_hit"
        value: 5

  holy_knight:
    name: "聖騎士"
    description: "戦士の剛健さと信仰の力を融合させ、不死に対抗する聖なる騎士"
    required_skills:
      - "sword_mastery"
      - "divine_heal"
    required_job: "warrior"
    required_god: "jure"
    result_skills:
      - "holy_slash"
      - "divine_aegis"
    bonus_effects:
      - type: "undead_damage_bonus"
        value: 50
      - type: "heal_on_kill"
        value: 10

  shadow_assassin:
    name: "影の暗殺者"
    description: "体術と影の力を融合させ、死を運ぶ暗殺者"
    required_skills:
      - "martial_mastery"
      - "shadow_step"
    required_job: "rogue"
    required_god: "northwind"
    result_skills:
      - "death_mark"
      - "shadow_clone"
    bonus_effects:
      - type: "crit_chance"
        value: 20
      - type: "backstab_multiplier"
        value: 2.0

  spellblade_archmage:
    name: "魔剣賢者"
    description: "魔法と剣術を極め、魔剣を操る賢者"
    required_skills:
      - "magic_mastery"
      - "sword_mastery"
    required_job: "archmage"
    required_god: "ehekatl"
    result_skills:
      - "spellblade"
      - "arcane_blade"
    bonus_effects:
      - type: "spell_power_on_melee"
        value: 30
      - type: "auto_reflect"
        chance: 15

  divine_fist:
    name: "神拳"
    description: "体術と信仰を融合させ、拳に神聖な力を宿す"
    required_skills:
      - "martial_mastery"
      - "divine_heal"
    required_job: "cleric"
    required_god: "jure"
    result_skills:
      - "healing_strike"
      - "divine_fist"
    bonus_effects:
      - type: "heal_on_hit"
        value: 15
      - type: "undead_bane"
        value: 100

fusion_recipes:
  fireball_fusion:
    id: "fireball_fusion"
    name: "火炎爆砕合成"
    description: "魔力詠唱と魔力矢を融合し、強力な火炎爆砕魔法を生み出す。"
    base_skill: "magic_cast"
    materials:
      fire_essence: 1
      magic_dart: 5
    output: "mega_fireball"
    required_level: 10
    success_rate: 1.0

meta:
  version: "1.0.0"
  last_updated: "2026-08-19"
