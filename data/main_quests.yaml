main_quests:
  - quest_id: "prologue_01"
    title: "運命の始まり"
    description: "村の長から古文書を受け取り、世界の異変について知る。"
    required_phase: "BEGINNING"
    objectives:
      - objective_id: "talk_elder"
        description: "村の長に話しかける"
        target_type: "visit"
        target_id: "village_elder"
        required_count: 1
    rewards:
      gold: 100
      world_phase: "AWAKENING"
    next_quest_id: "awakening_01"
    # T26 案1: 完了時に Phase 0「転落と覚醒」ナラティブを開始する
    narrative_dag_id: "skill_eater_phase0_fall"

  - quest_id: "awakening_01"
    title: "目覚めの試練"
    description: "封印された洞窟へ向かい、古の守護者を倒して世界の断片を回収せよ。"
    required_phase: "AWAKENING"
    objectives:
      - objective_id: "kill_guardian"
        description: "古の守護者を討伐する"
        target_type: "kill"
        target_id: "ancient_guardian"
        required_count: 1
      - objective_id: "collect_fragment"
        description: "世界の断片を回収する"
        target_type: "collect"
        target_id: "world_fragment"
        required_count: 1
    rewards:
      gold: 1000
      world_phase: "EXPLORATION"
    next_quest_id: "exploration_01"
    # T26 案1: 完了時に Phase 1「喰らいと抜け殻」ナラティブを開始する
    narrative_dag_id: "skill_eater_phase1_devour"

  - quest_id: "exploration_01"
    title: "失われた記憶の探索"
    description: "各地に散らばる世界の断片をさらに収集し、世界の真実を解き明かせ。"
    required_phase: "EXPLORATION"
    objectives:
      - objective_id: "collect_fragments_more"
        description: "世界の断片をさらに収集する"
        target_type: "collect"
        target_id: "world_fragment"
        required_count: 3
      - objective_id: "prove_resolve"
        description: "試練: Lv5以上 または 既に守護者を討伐済み"
        target_type: "variable"
        target_id: "prove_resolve"
        required_count: 1
        condition_dsl: "(or (>= player.level 5) (has flags.slew_guardian))"
    rewards:
      gold: 5000
      world_phase: "CONFRONTATION"
    # T26 案1: 鎖を Phase 3/4-5 へ延長 (confrontation_01 → ascension_01)。
    # 自動受注は LOCKED かつ required_phase 一致のクエストに限られるため
    # (tests/test_quest_narrative.py 参照)、後続クエストは受注フロー待ちになる。
    next_quest_id: "confrontation_01"
    narrative_dag_id: "skill_eater_phase2_chimera"

  - quest_id: "confrontation_01"
    title: "神格化アセンション"
    description: "星座盤で神格化し、第0因果律執行神『クロノス・ミダス』を撃破してAの世界を解放せよ。"
    required_phase: "CONFRONTATION"
    objectives:
      - objective_id: "prove_ascension"
        description: "神格化の淵に達する (Lv10 到達)"
        target_type: "variable"
        target_id: "prove_ascension"
        required_count: 1
        condition_dsl: "(>= player.level 10)"
    rewards:
      gold: 10000
      world_phase: "CLIMAX"
    next_quest_id: "ascension_01"
    # T26 案1: 完了時に Phase 3「神格化と因果律ボス」ナラティブを開始する
    narrative_dag_id: "skill_eater_phase3_ascension"

  - quest_id: "ascension_01"
    title: "次元ゲート開放"
    description: "概念結晶を時空金庫に収め、スラムの民の独立を見届け、マルチバースの門を潜れ。"
    required_phase: "CLIMAX"
    objectives:
      - objective_id: "open_dimension_gate"
        description: "次元跳躍の準備を整える (Lv15 到達)"
        target_type: "variable"
        target_id: "open_dimension_gate"
        required_count: 1
        condition_dsl: "(>= player.level 15)"
    rewards:
      gold: 50000
      world_phase: "EPILOGUE"
    # 終端: `ascension_01` の完了で Phase 4-5 ナラティブが閉じ、物語は完了する。
    # main_quest_system.py のガードは未解決の id を黙って無視するので、
    # ここが「意図的に終わる鎖」の終端である。
    next_quest_id: null
    # T26 案1: 完了時に Phase 4-5「概念結晶と次元跳躍」ナラティブを開始する
    narrative_dag_id: "skill_eater_phase45_multiverse"
