# Skill Trees Definition for naRou
# Structure: skill_trees: { tree_id: { name, icon, tiers: [ { id, name, description, cost, prerequisites, effects } ] } }

skill_trees:
  sword:
    name: "剣術"
    icon: "⚔"
    tiers:
      - id: "basic_sword"
        name: "剣の基礎"
        description: "剣の基本的な扱い方を学ぶ"
        cost: 10
        prerequisites: []
        effects:
          - type: "damage_bonus"
            value: 5
            target: "melee"

      - id: "sword_mastery"
        name: "剣術熟練"
        description: "剣の扱いに熟練し、より大きなダメージを与えられる"
        cost: 25
        prerequisites: ["basic_sword"]
        effects:
          - type: "damage_bonus"
            value: 10
            target: "melee"
          - type: "unlock_skill"
            value: "power_strike"
            target: "self"

      - id: "sword_essence"
        name: "剣の極意"
        description: "剣の真髄を極め、会心の一撃を放てるようになる"
        cost: 50
        prerequisites: ["sword_mastery"]
        effects:
          - type: "damage_bonus"
            value: 20
            target: "melee"
          - type: "crit_chance"
            value: 15
            target: "self"
          - type: "unlock_skill"
            value: "blade_dance"
            target: "self"

  magic:
    name: "魔法"
    icon: "✨"
    tiers:
      - id: "basic_magic"
        name: "魔法の基礎"
        description: "魔力の基本的な扱い方を学ぶ"
        cost: 10
        prerequisites: []
        effects:
          - type: "damage_bonus"
            value: 5
            target: "spell"

      - id: "magic_mastery"
        name: "魔法熟練"
        description: "魔力の制御に熟練し、より強力な呪文を扱える"
        cost: 25
        prerequisites: ["basic_magic"]
        effects:
          - type: "damage_bonus"
            value: 10
            target: "spell"
          - type: "mp_cost_reduction"
            value: 10
            target: "self"
          - type: "unlock_skill"
            value: "fireball"
            target: "self"

      - id: "magic_essence"
        name: "魔法の極意"
        description: "魔法の真髄を極め、究極の呪文を操る"
        cost: 50
        prerequisites: ["magic_mastery"]
        effects:
          - type: "damage_bonus"
            value: 20
            target: "spell"
          - type: "crit_chance"
            value: 10
            target: "spell"
          - type: "mp_cost_reduction"
            value: 20
            target: "self"
          - type: "unlock_skill"
            value: "meteor"
            target: "self"

  martial_arts:
    name: "体術"
    icon: "👊"
    tiers:
      - id: "basic_martial"
        name: "体術の基礎"
        description: "素手での戦い方の基本を学ぶ"
        cost: 10
        prerequisites: []
        effects:
          - type: "damage_bonus"
            value: 5
            target: "unarmed"
          - type: "dodge_chance"
            value: 5
            target: "self"

      - id: "martial_mastery"
        name: "体術熟練"
        description: "体術に熟練し、素手でも武器並みの威力を発揮できる"
        cost: 25
        prerequisites: ["basic_martial"]
        effects:
          - type: "damage_bonus"
            value: 10
            target: "unarmed"
          - type: "dodge_chance"
            value: 10
            target: "self"
          - type: "unlock_skill"
            value: "counter_attack"
            target: "self"

      - id: "martial_essence"
        name: "体術の極意"
        description: "体術の極みに達し、拳一つで全てを砕く"
        cost: 50
        prerequisites: ["martial_mastery"]
        effects:
          - type: "damage_bonus"
            value: 20
            target: "unarmed"
          - type: "dodge_chance"
            value: 15
            target: "self"
          - type: "counter_chance"
            value: 20
            target: "self"
          - type: "unlock_skill"
            value: "one_inch_punch"
            target: "self"

