skill_trees:
  sword:
    name: 剣術
    icon: ⚔
    tiers:
      - id: basic_sword
        name: 剣の基礎
        description: 剣の基本的な扱い方を学ぶ
        cost: 10
        prerequisites: []
        effects:
          - type: damage_bonus
            value: 5
            target: melee
      - id: sword_mastery
        name: 剣術熟練
        description: 剣術の熟練度を高め、より高度な技が使えるようになる
        cost: 20
        prerequisites:
          - basic_sword
        effects:
          - type: damage_bonus
            value: 10
            target: melee
          - type: unlock_skill
            value: sword_technique
            target: unlocked
      - id: sword_essence
        name: 剣の極意
        description: 剣の真髄を極め、絶大なダメージを与えることができる
        cost: 30
        prerequisites:
          - sword_mastery
        effects:
          - type: damage_bonus
            value: 15
            target: melee
          - type: crit_chance
            value: 0.1
            target: melee
          - type: unlock_skill
            value: ultimate_slash
            target: unlocked
  magic:
    name: 魔法
    icon: 🔮
    tiers:
      - id: magic_basic
        name: 魔法の基礎
        description: 魔法の基本的な理論と詠唱方法を学ぶ
        cost: 10
        prerequisites: []
        effects:
          - type: damage_bonus
            value: 5
            target: magic
      - id: magic_mastery
        name: 魔法熟練
        description: 魔法の詠唱速度と威力が向上する
        cost: 20
        prerequisites:
          - magic_basic
        effects:
          - type: damage_bonus
            value: 10
            target: magic
          - type: unlock_skill
            value: magic_shot
            target: unlocked
      - id: magic_essence
        name: 魔法の極意
        description: 上級魔法を自在に操り、強力な呪文を唱えることができる
        cost: 30
        prerequisites:
          - magic_mastery
        effects:
          - type: damage_bonus
            value: 15
            target: magic
          - type: crit_chance
            value: 0.1
            target: magic
          - type: unlock_skill
            value: meteor_strike
            target: unlocked
  martial_arts:
    name: 体術
    icon: 🥊
    tiers:
      - id: physique_basic
        name: 体術の基礎
        description: 体術の基本的な構えと動きを学ぶ
        cost: 10
        prerequisites: []
        effects:
          - type: damage_bonus
            value: 5
            target: unarmed
      - id: physique_mastery
        name: 体術熟練
        description: 体術の技が磨かれ、より速く強い攻撃が可能になる
        cost: 20
        prerequisites:
          - physique_basic
        effects:
          - type: damage_bonus
            value: 10
            target: unarmed
          - type: unlock_skill
            value: rushing_punch
            target: unlocked
      - id: physique_essence
        name: 体術の極意
        description: 体術の極みに到達し、閃光の如き連続攻撃を繰り出せる
        cost: 30
        prerequisites:
          - physique_mastery
        effects:
          - type: damage_bonus
            value: 15
            target: unarmed
          - type: crit_chance
            value: 0.1
            target: unarmed
          - type: unlock_skill
            value: flash_fist
            target: unlocked