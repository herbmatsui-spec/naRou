# ダンジョンテーマ設定 (Steps 7, 8)
# 後方互換性のため従来の構造を保持しつつ、新しい垂直ワールド構造を追加

dungeon_themes:
  # 後方互換性のための従来のテーマ（既存のコンテンツ用）
  goblin_cave:
    theme_id: "goblin_cave"
    name: "ゴブリンの洞窟"
    base_layout: "cavern"
    difficulty_modifier: 1.0
    enemy_pools:
      common:
        - "goblin"
        - "slime"
      elite:
        - "goblin_warrior"
        - "goblin_shaman"
    environmental_hazards:
      - "spikepits"
      - "poison_gas"
    special_rooms:
      - "treasure_vault"
      - "shaman_altar"
    story_hooks:
      - "rescue_captive"
      - "find_stolen_goods"

  ancient_ruins:
    theme_id: "ancient_ruins"
    name: "古代遺跡"
    base_layout: "dungeon_grid"
    difficulty_modifier: 1.5
    enemy_pools:
