      - "chemical_leak"
      - "spark_shower"
    special_rooms:
      - "control_room"
      - "storage_warehouse"
      - "maintenance_shaft"
    transition_sounds:
      stairs: "stair_creak.ogg"
      elevator: "elevator_hum.ogg"
    transition_emotes:
      down: "emote_arrow_down.png"
      up: "emote_arrow_up.png"
    gimmicks:
      - "secret_doors:0.2"
      - "false_walls:0.1"
      - "vents:0.15"

