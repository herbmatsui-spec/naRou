# Quest Narrative DAG Definitions (偏執的クエストシステム / 設計書 Phase 4 Step 14)
# ナラティブ分岐 DAG: 選択肢 -> 分岐 -> サブ目的 -> 報酬/次クエスト

narrative_dags:
  # メインクエスト「運命の始まり」の分岐
  prologue_branching:
    dag_id: "prologue_branching"
    title: "序章：分岐する運命"
    description: "村の長からの依頼で、古文書を受け取るか拒否するかで運命が分かれる"
    nodes:
      prologue_start:
        type: "START"
        title: "村の長の依頼"
        description: "村の長「古文書を届けてくれないか？」"
        actions: []
        rewards: {}

      prologue_accept:
        type: "CHOICE"
        title: "引き受ける"
        description: "「承知した。古文書を届けよう。」"
        actions: []
        rewards: {}
        set_flags: ["accepted_elder_request"]

      prologue_decline:
        type: "CHOICE"
        title: "断る"
        description: "「すまない、今は手一杯だ。」"
        actions: []
        rewards: {}
        set_flags: ["declined_elder_request"]

      prologue_accept_path:
        type: "EVENT"
        title: "古文書の受け取り"
        description: "村の長から古文書を受け取り、世界の異変を知る。"
        actions: []
        rewards:
          gold: 100
          world_phase: "AWAKENING"
        set_flags: ["has_ancient_script"]

      prologue_decline_path:
        type: "EVENT"
        title: "後悔の夜"
        description: "依頼を断った夜、村が何者かに襲われる夢を見る。"
        actions: []
        rewards:
          karma: -10
        set_flags: ["nightmare_village_attack"]

      prologue_merge:
        type: "MERGE"
        title: "旅立ち"
        description: "どちらの選択をしても、旅は始まる。"
        actions: []
        rewards: {}

      prologue_end_accept:
        type: "END"
        title: "覚醒への道"
        description: "古文書を持って旅立つ。世界は覚醒期へ。"
        actions: []
        rewards:
          next_quest_id: "awakening_01"

      prologue_end_decline:
        type: "END"
        title: "贖罪の旅"
        description: "断ったことを悔い、村を救うため旅立つ。"
        actions: []
        rewards:
          next_quest_id: "redemption_01"

    edges:
      - edge_id: "accept"
        source: "prologue_start"
        target: "prologue_accept"
        type: "CHOICE"
        choice_text: "引き受ける"

      - edge_id: "decline"
        source: "prologue_start"
        target: "prologue_decline"
        type: "CHOICE"
        choice_text: "断る"

      - edge_id: "accept_continue"
        source: "prologue_accept"
        target: "prologue_accept_path"
        type: "AUTO"

      - edge_id: "decline_continue"
        source: "prologue_decline"
        target: "prologue_decline_path"
        type: "AUTO"

      - edge_id: "accept_to_merge"
        source: "prologue_accept_path"
        target: "prologue_merge"
        type: "AUTO"

      - edge_id: "decline_to_merge"
        source: "prologue_decline_path"
        target: "prologue_merge"
        type: "AUTO"

      - edge_id: "merge_to_accept_end"
        source: "prologue_merge"
        target: "prologue_end_accept"
        type: "CONDITION_TRUE"
        condition_dsl: "(has flags.accepted_elder_request)"

      - edge_id: "merge_to_decline_end"
        source: "prologue_merge"
        target: "prologue_end_decline"
        type: "CONDITION_TRUE"
        condition_dsl: "(has flags.declined_elder_request)"

  # 覚醒期クエストの分岐：守護者へのアプローチ
  awakening_approach:
    dag_id: "awakening_approach"
    title: "目覚めの試練：アプローチの選択"
    description: "古の守護者と戦うか、対話を試みるか、回避するか"
    nodes:
      awakening_start:
        type: "START"
        title: "封印された洞窟の前"
        description: "洞窟の奥に古の守護者がいる。どう挑む？"
        actions: []

      awakening_fight:
        type: "CHOICE"
        title: "正面から戦う"
        description: "剣を抜き、守護者に挑む。"
        set_flags: ["chose_fight"]
        rewards:
          fame: 20

      awakening_talk:
        type: "CHOICE"
        title: "対話を試みる"
        description: "古の言葉で守護者に語りかける。"
        set_flags: ["chose_talk"]
        rewards:
          piety: 15

      awakening_sneak:
        type: "CHOICE"
        title: "こっそり通過"
        description: "影に隠れ、守護者の目を盗んで進む。"
        set_flags: ["chose_sneak"]
        rewards:
          karma: -5

      awakening_fight_result:
        type: "EVENT"
        title: "激闘の末"
        description: "守護者を倒したが、深手を負った。"
        actions: []
        rewards:
          gold: 500
          world_fragment: 1
        condition_dsl: "(has flags.chose_fight)"

      awakening_talk_result:
        type: "EVENT"
        title: "守護者の試練"
        description: "守護者は言葉を理解し、試練を与えた。"
        actions: []
        rewards:
          world_fragment: 1
          unique_skill: "ancient_wisdom"
        condition_dsl: "(has flags.chose_talk)"

      awakening_sneak_result:
        type: "EVENT"
        title: "影の如く"
        description: "気づかれずに通過したが、守護者の視線を感じる。"
        actions: []
        rewards:
          world_fragment: 1
          stealth_bonus: 10
        condition_dsl: "(has flags.chose_sneak)"

      awakening_merge:
        type: "MERGE"
        title: "世界の断片獲得"
        description: "いずれの道も、断片へと繋がる。"
        actions: []

      awakening_end:
        type: "END"
        title: "探索期へ"
        description: "断片を手に、次の段階へ進む。"
        rewards:
          world_phase: "EXPLORATION"
          next_quest_id: "exploration_01"

    edges:
      - edge_id: "fight"
        source: "awakening_start"
        target: "awakening_fight"
        type: "CHOICE"
        choice_text: "正面から戦う"

      - edge_id: "talk"
        source: "awakening_start"
        target: "awakening_talk"
        type: "CHOICE"
        choice_text: "対話を試みる"

      - edge_id: "sneak"
        source: "awakening_start"
        target: "awakening_sneak"
        type: "CHOICE"
        choice_text: "こっそり通過"

      - edge_id: "fight_to_result"
        source: "awakening_fight"
        target: "awakening_fight_result"
        type: "AUTO"

      - edge_id: "talk_to_result"
        source: "awakening_talk"
        target: "awakening_talk_result"
        type: "AUTO"

      - edge_id: "sneak_to_result"
        source: "awakening_sneak"
        target: "awakening_sneak_result"
        type: "AUTO"

      - edge_id: "fight_result_to_merge"
        source: "awakening_fight_result"
        target: "awakening_merge"
        type: "AUTO"

      - edge_id: "talk_result_to_merge"
        source: "awakening_talk_result"
        target: "awakening_merge"
        type: "AUTO"

      - edge_id: "sneak_result_to_merge"
        source: "awakening_sneak_result"
        target: "awakening_merge"
        type: "AUTO"

      - edge_id: "merge_to_end"
        source: "awakening_merge"
        target: "awakening_end"
        type: "AUTO"

  # 派閥抗争クエスト：三つ巴の選択
  faction_war_choice:
    dag_id: "faction_war_choice"
    title: "派閥抗争：立場の選択"
    description: "王国・教会・闇の手、いずれかの派閥に与するか、中立を貫くか"
    nodes:
      faction_start:
        type: "START"
        title: "三つ巴の会議"
        description: "三派閥の代表が集う。あなたは誰を支持する？"
        actions: []

      faction_kingdom:
        type: "CHOICE"
        title: "ガルド王国を支持"
        description: "秩序と法を重んじ、王国軍に加わる。"
        set_flags: ["faction_kingdom"]
        rewards:
          faction_rep:
            kingdom_garde: 30

      faction_church:
        type: "CHOICE"
        title: "ルミエスト教会を支持"
        description: "信仰と慈愛を掲げ、教会の聖職者となる。"
        set_flags: ["faction_church"]
        rewards:
          faction_rep:
            church_of_lumiest: 30

      faction_shadow:
        type: "CHOICE"
        title: "シャドウハンドを支持"
        description: "闇の力を信じ、暗躍する組織に加わる。"
        set_flags: ["faction_shadow"]
        rewards:
          faction_rep:
            shadow_hand: 30

      faction_neutral:
        type: "CHOICE"
        title: "中立を貫く"
        description: "どの派閥にも属さず、独自の道を行く。"
        set_flags: ["faction_neutral"]
        rewards:
          karma: 10

      faction_kingdom_path:
        type: "EVENT"
        title: "王国の騎士"
        description: "王国軍の一員として前線へ赴く。"
        condition_dsl: "(has flags.faction_kingdom)"
        rewards:
          title: "王国の盾"

      faction_church_path:
        type: "EVENT"
        title: "教会の聖職者"
        description: "教会の教えを広め、民を救う。"
        condition_dsl: "(has flags.faction_church)"
        rewards:
          title: "光の導き手"

      faction_shadow_path:
        type: "EVENT"
        title: "闇の刺客"
        description: "影となり、敵を暗殺する。"
        condition_dsl: "(has flags.faction_shadow)"
        rewards:
          title: "闇の歩み手"

      faction_neutral_path:
        type: "EVENT"
        title: "孤高の旅人"
        description: "どの派閥にも属さず、真実を追う。"
        condition_dsl: "(has flags.faction_neutral)"
        rewards:
          title: "孤高の求道者"

      faction_end:
        type: "END"
        title: "抗争の渦中へ"
        description: "選んだ道の果てに、何が待つのか。"
        rewards:
          next_quest_id: "faction_war_02"

    edges:
      - edge_id: "kingdom"
        source: "faction_start"
        target: "faction_kingdom"
        type: "CHOICE"
        choice_text: "ガルド王国を支持"

      - edge_id: "church"
        source: "faction_start"
        target: "faction_church"
        type: "CHOICE"
        choice_text: "ルミエスト教会を支持"

      - edge_id: "shadow"
        source: "faction_start"
        target: "faction_shadow"
        type: "CHOICE"
        choice_text: "シャドウハンドを支持"

      - edge_id: "neutral"
        source: "faction_start"
        target: "faction_neutral"
        type: "CHOICE"
        choice_text: "中立を貫く"

      - edge_id: "kingdom_to_path"
        source: "faction_kingdom"
        target: "faction_kingdom_path"
        type: "AUTO"

      - edge_id: "church_to_path"
        source: "faction_church"
        target: "faction_church_path"
        type: "AUTO"

      - edge_id: "shadow_to_path"
        source: "faction_shadow"
        target: "faction_shadow_path"
        type: "AUTO"

      - edge_id: "neutral_to_path"
        source: "faction_neutral"
        target: "faction_neutral_path"
        type: "AUTO"

      - edge_id: "kingdom_path_to_end"
        source: "faction_kingdom_path"
        target: "faction_end"
        type: "AUTO"

      - edge_id: "church_path_to_end"
        source: "faction_church_path"
        target: "faction_end"
        type: "AUTO"

      - edge_id: "shadow_path_to_end"
        source: "faction_shadow_path"
        target: "faction_end"
        type: "AUTO"

      - edge_id: "neutral_path_to_end"
        source: "faction_neutral_path"
        target: "faction_end"
        type: "AUTO"

  # ======================================================================
  # T26 案1: メインクエスト DAG — スキル喰い 5大フェーズ
  # README「📖 ストーリーとゲームの流れ（全5大フェーズ）」に沿った
  # Phase 0-5 の主要ナラティブ。各メインクエスト完了時
  # (main_quest_system._complete_quest) に narrative_dag_id 経由で開始される。
  # 注意: エッジの condition_dsl は NarrativeContext 未対応のため使用せず、
  # 分岐は CHOICE エッジの合流と effects (state 変数記録) で表現する。
  # ======================================================================

  # Phase 0: 転落と覚醒 (Betrayal & Awakening)
  skill_eater_phase0_fall:
    dag_id: "skill_eater_phase0_fall"
    title: "Phase 0: 転落と覚醒"
    description: "上層部の不正を暴こうとした監査官は罠に嵌められ、深度700mの廃棄スラム街へ投棄される"
    nodes:
      phase0_start:
        type: "START"
        title: "バベルタワーの罠"
        description: "巨大企業都市バベルタワー、上層区130階。若きエリート監査官は上層部の不正の証拠を握った——直後、監査室の扉が内側から開かなくなる。"
        actions: []

      phase0_discard:
        type: "EVENT"
        title: "永久剥奪と深度700m"
        description: "告発は握りつぶされ、監査官権限は永久剥奪。取り押さえられたあなたは、廃棄物処理区画——深度700mの廃棄スラム街へ投棄される。"
        actions: []
        set_flags: ["phase0_discarded"]

      phase0_awakening:
        type: "EVENT"
        title: "《基礎解析》の覚醒"
        description: "真っ暗な廃棄品の山。暗闇で見出したのは、最底辺の廃棄スキル《基礎解析》。スラムの配管・通路・追捕犬の位置が『解析』され、生存経路だけが視界に浮かぶ。"
        actions: []
        rewards:
          unique_skill: "basic_analysis"
        set_flags: ["basic_analysis_awakened"]

      phase0_devour:
        type: "CHOICE"
        title: "禁忌のコード《喰らい》"
        description: "足元の陶片には、自己の肉体を魔導炉とする禁忌のコード——《喰らい（Devour）》が刻まれている。読み込めば、あなたはもう元の世界には戻れない。"
        actions: []

      phase0_end:
        type: "END"
        title: "包囲網の先へ"
        description: "遠くで追捕犬の遠吠えが響く。生存のための逃走劇が、今始まる。"
        actions: []
        set_flags: ["phase0_completed"]

    edges:
      - edge_id: "phase0_expose"
        source: "phase0_start"
        target: "phase0_discard"
        type: "CHOICE"
        choice_text: "扉越しに不正を叫び、上層議会へ告発する"
        effects:
          phase0_choice: "expose"

      - edge_id: "phase0_abscond"
        source: "phase0_start"
        target: "phase0_discard"
        type: "CHOICE"
        choice_text: "証拠を懐に抱え、闇ルートから逃走を図る"
        effects:
          phase0_choice: "abscond"

      - edge_id: "phase0_open_eyes"
        source: "phase0_discard"
        target: "phase0_awakening"
        type: "CHOICE"
        choice_text: "廃棄物の山の中で、暗闇に目を開く"

      - edge_id: "phase0_read_shard"
        source: "phase0_awakening"
        target: "phase0_devour"
        type: "CHOICE"
        choice_text: "足元の陶片に刻まれたコードを読む"

      - edge_id: "phase0_accept_devour"
        source: "phase0_devour"
        target: "phase0_end"
        type: "CHOICE"
        choice_text: "《喰らい》をこの身に宿す"
        effects:
          devour_code: "accepted"

      - edge_id: "phase0_refuse_devour"
        source: "phase0_devour"
        target: "phase0_end"
        type: "CHOICE"
        choice_text: "コードを握りつぶし、元の世界を信じる"
        effects:
          devour_code: "refused"

  # Phase 1: 禁忌の《喰らい》と抜け殻 (Devour & Husk)
  skill_eater_phase1_devour:
    dag_id: "skill_eater_phase1_devour"
    title: "Phase 1: 禁忌の《喰らい》と抜け殻"
    description: "敵の核を喰らいスキルを強奪し、奪われた敵は抜け殻（Husk）へと退化する"
    nodes:
      phase1_start:
        type: "START"
        title: "最初の捕食"
        description: "スラムの路地で追捕犬と対峙。拳で弱らせたその瞬間、体内の《喰らい》が獲物の核を欲して疼く。"
        actions: []

      phase1_husk:
        type: "EVENT"
        title: "抜け殻（Husk）"
        description: "核を喰われた犬は意志を失った『抜け殻』へと退化し、力なく崩れ落ちる。奪ったスキル《追跡嗅覚》は、永久にあなたのものになった。"
        actions: []
        rewards:
          unique_skill: "tracking_nose"
        set_flags: ["first_devour_done"]

      phase1_toxicity:
        type: "CHOICE"
        title: "スキル拒絶反応（Toxicity）"
        description: "捕食を重ねるたび、体内に毒性が蓄積していく。このまま狩り続けるか、セーフハウスでデトックスするか。"
        actions: []

      phase1_end:
        type: "END"
        title: "捕食者の資格"
        description: "喰らいは習性となった。スラム解放戦線が『合成炉』の噂を運んでくる——次は、喰ったスキルを掛け合わせる番だ。"
        actions: []
        set_flags: ["phase1_completed"]

    edges:
      - edge_id: "phase1_devour_dog"
        source: "phase1_start"
        target: "phase1_husk"
        type: "CHOICE"
        choice_text: "弱った追捕犬の核を、喰らう"
        effects:
          phase1_prey: "hound"

      - edge_id: "phase1_spare_dog"
        source: "phase1_start"
        target: "phase1_husk"
        type: "CHOICE"
        choice_text: "《喰らい》を抑え、犬を仕留めるだけに留める"
        effects:
          phase1_prey: "spared"

      - edge_id: "phase1_advance"
        source: "phase1_husk"
        target: "phase1_toxicity"
        type: "CHOICE"
        choice_text: "毒性の疼きを感じながら、立ち上がる"

      - edge_id: "phase1_detox"
        source: "phase1_toxicity"
        target: "phase1_end"
        type: "CHOICE"
        choice_text: "セーフハウスで休息し、毒性をデトックスする"
        effects:
          toxicity_policy: "detox"

      - edge_id: "phase1_keep_hunting"
        source: "phase1_toxicity"
        target: "phase1_end"
        type: "CHOICE"
        choice_text: "構わず狩り続け、毒性の限界に挑む"
        effects:
          toxicity_policy: "overdrive"

  # Phase 2: キメラ合成炉とスラム拠点復興 (Chimera Synthesis & Base)
  skill_eater_phase2_chimera:
    dag_id: "skill_eater_phase2_chimera"
    title: "Phase 2: キメラ合成炉とスラム拠点復興"
    description: "強奪したスキル2種を掛け合わせ、認可外の上位キメラスキルを錬成する"
    nodes:
      phase2_start:
        type: "START"
        title: "解放戦線の合成炉"
        description: "スラム解放戦線が廃炉を魔導合成炉として再生した。喰らって奪ったスキル2種を、炉に投じる番だ。"
        actions: []

      phase2_synthesis:
        type: "EVENT"
        title: "キメラ錬成"
        description: "炉が唸り声を上げ、認可外の上位キメラスキル《変異融合》が錬成される。スラムの民が、初めて『上』を見上げた。"
        actions: []
        rewards:
          unique_skill: "chimera_fusion"
        set_flags: ["first_chimera_synthesized"]

      phase2_base:
        type: "CHOICE"
        title: "拠点の拡張"
        description: "解放戦線拠点に、廃品と余剰スキルを投資できる。復興の優先先を選べ。"
        actions: []

      phase2_dispatch:
        type: "EVENT"
        title: "ハスクハウンド派遣と環境パズル"
        description: "改造魔獣ハスクハウンドを廃品処分場へ派遣し、物資を調達。合成した属性スキルで氷壁と電子隔壁を突破した。"
        actions: []
        set_flags: ["slum_base_expanded"]

      phase2_end:
        type: "END"
        title: "炉の火は上を目指す"
        description: "下層スラムは解放戦線のものになった。今や『神格化』の噂が、上層から降りてくる。"
        actions: []
        set_flags: ["phase2_completed"]

    edges:
      - edge_id: "phase2_recipe_fire"
        source: "phase2_start"
        target: "phase2_synthesis"
        type: "CHOICE"
        choice_text: "《初級火炎》×《思考加速》を投じる"
        effects:
          recipe: "fire_thought"

      - edge_id: "phase2_recipe_ice"
        source: "phase2_start"
        target: "phase2_synthesis"
        type: "CHOICE"
