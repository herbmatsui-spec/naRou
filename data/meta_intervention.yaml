# Meta Intervention System Balance Configuration
# All numeric constants for the template intervention system

# Template event spawn chances per context
spawn_chance:
  slum: 0.6
  guild: 0.5
  noble_quarter: 0.4
  dungeon_entrance: 0.7

# Difficulty formula coefficients
difficulty:
  base_inverse_weight: 1.0
  loop_mod_per_loop: 0.1  # 1/(1+0.1*(loop-1))
  min_difficulty: 0.1

# Intervention success modifiers
intervention:
  tier_multipliers:
    t1: 1.0
    t2: 2.5
    t3: 6.0

  completeness_tiers:
    - threshold: 0    # 0-39%
      multiplier: 0.3
    - threshold: 40   # 40-69%
      multiplier: 1.0
    - threshold: 70   # 70-89%
      multiplier: 1.8
    - threshold: 90   # 90-99%
      multiplier: 2.6
    - threshold: 100  # 100%
      multiplier: 4.0

# Karma reward base values per archetype (overridden by template reward)
karma_base:
  expel:
    t1: 100
    t2: 600
  engagement_break:
    t1: 150
    t2: 800
  credit_steal:
    t1: 120
    t2: 700
  betray:
    t1: 130
    t2: 750
  genius_discrimination:
    t1: 200
    t2: 1000
  servant_conversion:
    t1: 180
    t2: 900

# Exposure costs
exposure:
  deep_read: 1
  intervene_t1: 1
  intervene_t2: 3
  intervene_t3: 10
  failure: 5
  max_exposure: 100

# Karma law/chaos and good/evil changes
karma_changes:
  deep_read:
    law_chaos: -1
    good_evil: 0
    exposure: 1
  intervene_t1:
    law_chaos: 0
    good_evil: 0
    exposure: 1
  intervene_t2:
    law_chaos: -2
    good_evil: -2
    exposure: 3
  intervene_t3:
    law_chaos: -5
    good_evil: -5
    exposure: 10
  failure:
    law_chaos: 0
    good_evil: -5
    exposure: 5

# Reincarnation carry-over
reincarnation:
  template_count_decay: 0.5  # halve each loop
  min_carry_count: 1

# Template learning resistance
template_learning:
  resistance_per_loop: 0.7  # base_success *= 0.7 per loop

# Unique skill threshold
unique_skill:
  completeness_threshold: 0.7

# Event messages
