  expel:
    scan: "《原典閲覧》追放テンプレ反応検出: {location}"
    t1_success: "T1介入成功: 安値でスキルを買い占めた"
    t2_success: "T2介入成功: 追放者を専属契約で囲い込んだ"
    t3_success: "T3介入成功: 追放テンプレを世界から消滅させた"
    failure: "介入失敗: 追放が定形通り完遂、共犯扱いに"
