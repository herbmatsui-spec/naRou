# メタゴール（長期目標）および周回特異点・記憶生成テンプレート定義
meta_goals:
  total_depth_1000:
    id: "total_depth_1000"
    name: "深淵の踏破者"
    description: "全周回を通して累計ダンジョン深度1000Fを踏破する"
    target_metric: "cumulative_depth"
    target_value: 1000
    permanent_bonus:
      # 【予約】未実装。Entity.recalculate_stats() が max_hp を属性から毎回作り直すため、
      # 固定加算はレベルアップ・ジョブ・称号の処理時に消える。
      # 実装には ecs/entity.py 側で permanent_bonuses を max_hp 計算に読み込む処理が要る。
      max_hp: 25
      # 【予約】未実装。max_hp と同じ理由で calculate_max_mp() の再計算で消える。
      max_mp: 15
      # 【実装】recalculate_and_apply_bonuses が Entity.speed に加算し、
      # TurnQueue.step_next_actor の行動順計算に使われる。
      speed: 2
  fragment_collector_10:
    id: "fragment_collector_10"
    name: "記憶を紡ぐ者"
    description: "通算10個以上の前世の記憶の欠片を収集する"
    target_metric: "collected_fragments_count"
    target_value: 10
    permanent_bonus:
      # 【予約】未実装。経験値の加算は Entity.gain_exp()（ecs/entity.py）内にあり、
      # そこに倍率を適用する読み取り口が無い。
      exp_bonus: 0.15
      # 【予約】未実装。スキル成長は Entity.gain_skill_exp() の
      # int(amount * (skill.potential / 100.0)) が根拠で、ボーナスの読み取り口が無い。
      potential_bonus: 10
  reincarnation_master:
    id: "reincarnation_master"
    name: "輪廻の超越者"
    description: "転生を累計5回以上達成する"
    target_metric: "reincarnation_count"
    target_value: 5
    permanent_bonus:
      # 【実装】recalculate_and_apply_bonuses が全8主能力に加算する。
      # 再計算の復元元 _base_attributes にも加算するためレベルアップでも消えない。
      all_attributes: 5
      # 【予約】未実装。カルマは karma_system.py の update_karma() が
      # karma_law_chaos / karma_good_evil を直接加算しており、倍率を掛ける口が無い。
      karma_gain_multiplier: 1.2
  elemental_mastery:
    id: "elemental_mastery"
    name: "全属性の記憶"
    description: "4種類以上の異なる属性カテゴリの記憶の欠片を獲得する"
    target_metric: "unique_fragment_categories"
    target_value: 4
    permanent_bonus:
      # 【予約】未実装。独立した「魔法威力」統計が存在せず、呪文ダメージは
      # systems.py が attributes.magic を直接参照するため all_attributes と経路が重複する。
      magic_power: 10
      # 【予約】未実装。属性耐性 ResistanceSet は初期化時に書き込まれるだけで、
      # ダメージ計算から参照されていない。
      resistance_all: 5

cycle_modifier_pool:
  - id: "mod_mana_surge"
    name: "魔力奔流の時代"
    description: "魔法威力+30% だが消費MPが1.5倍になる"
    target_goal: "cast_magic_100"
    reward_meta_points: 50
    positive_effects:
      magic_damage_multiplier: 0.3
    negative_effects:
      mp_cost_multiplier: 0.5
  - id: "mod_lone_wolf"
    name: "孤高の誓い"
    description: "単独行動時、全主能力+10% かつクリティカル率+15%"
    target_goal: "clear_dungeon_solo"
    reward_meta_points: 80
    positive_effects:
      solo_attribute_boost: 0.10
      critical_rate: 15.0
    negative_effects: {}
  - id: "mod_ironclad"
    name: "鋼鉄の紀元"
    description: "被物理ダメージ-20% だが移動速度-5"
    target_goal: "block_damage_1000"
    reward_meta_points: 40
    positive_effects:
      physical_damage_cut: 0.20
    negative_effects:
      speed: -5
  - id: "mod_fortune_tide"
    name: "黄金の満ち干"
    description: "獲得ゴールド+50%、レアアイテムドロップ率+25% だが敵の攻撃力+15%"
    target_goal: "earn_gold_50000"
    reward_meta_points: 60
    positive_effects:
      gold_multiplier: 0.50
      drop_rate_boost: 0.25
    negative_effects:
      enemy_damage_multiplier: 0.15
  - id: "mod_astral_resonance"
    name: "星辰の共鳴"
    description: "スキル経験値獲得量+30% だがHP自然回復量-20%"
    target_goal: "level_up_skills_20"
    reward_meta_points: 70
    positive_effects:
      skill_exp_multiplier: 0.30
    negative_effects:
      hp_regen_multiplier: -0.20

