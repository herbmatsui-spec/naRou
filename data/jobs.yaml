# Job Definitions for naRou
# Structure: jobs: { job_id: { name, tier, description, stat_modifiers, equipment_restrictions, exclusive_skills, unlock_conditions } }

jobs:
  novice:
    name: "見習い"
    tier: 0
    description: "冒険の基礎を学ぶ初心者"
    description_en: "Novice adventurer learning the basics"
    stat_modifiers: {}
    equipment_restrictions: {}
    exclusive_skills: []
    unlock_conditions: {}

  warrior:
    name: "戦士"
    tier: 1
    description: "剣と盾を駆使する前衛の達人"
    description_en: "Frontline master wielding sword and shield"
    stat_modifiers:
      strength: 10
      endurance: 5
      dexterity: -2
    equipment_restrictions:
      can_wear_heavy_armor: true
      can_use_shield: true
      can_use_two_handed: true
    exclusive_skills:
      - "shield_bash"
      - "taunt"
      - "whirlwind"
    unlock_conditions:
      level: 10
      skills:
        basic_sword: 30
        shield: 20
      stats:
        strength: 15

  swordmaster:
    name: "剣聖"
    tier: 2
    description: "剣の極みに達した剣の聖人"
    description_en: "Sword saint who has mastered the blade"
    stat_modifiers:
      strength: 20
      endurance: 10
      dexterity: 15
    equipment_restrictions:
      can_wear_heavy_armor: true
      can_use_shield: true
      can_use_two_handed: true
      can_use_legendary_sword: true
    exclusive_skills:
      - "iaijutsu"
      - "blade_dance"
      - "sword_of_destiny"
    unlock_conditions:
      job: "warrior"
      level: 25
      skills:
        sword_mastery: 50
        sword_essence: 30
      stats:
        strength: 25
        dexterity: 20

  mage:
    name: "魔法使い"
    tier: 1
    description: "魔力を操る神秘の賢者"
    description_en: "Mystic sage who wields arcane power"
    stat_modifiers:
      intelligence: 10
      will: 10
      magic: 12
      endurance: -5

    equipment_restrictions:
      can_use_staff: true
      can_use_robe: true
      can_use_wand: true
      cannot_wear_heavy_armor: true
    exclusive_skills:
      - "fireball"
      - "magic_shield"
      - "mana_siphon"
    unlock_conditions:
      level: 10
      skills:
        basic_magic: 30
        magic_basic: 20
      stats:
        intelligence: 15
        will: 10

  archmage:
    name: "大賢者"
    tier: 2
    description: "魔法の極みに達した至高の賢者"
    description_en: "Supreme sage who has mastered all magic"
    stat_modifiers:
      intelligence: 25
      will: 20
      magic: 20
    equipment_restrictions:
      can_use_staff: true
      can_use_robe: true
      can_use_wand: true
      can_use_artifact_staff: true
      cannot_wear_heavy_armor: true
    exclusive_skills:
      - "meteor"
      - "time_stop"
      - "reality_warp"
    unlock_conditions:
      job: "mage"
      level: 25
      skills:
        magic_mastery: 50
        magic_essence: 30
      stats:
        intelligence: 25
        will: 20

  cleric:
    name: "僧侶"
    tier: 1
    description: "神の加護を受ける癒しの祈祷師"
    description_en: "Healer blessed by divine grace"
    stat_modifiers:
      will: 10
      learning: 5
      magic: 5
    equipment_restrictions:
      can_use_staff: true
      can_use_robe: true
      can_use_mace: true
      can_wear_light_armor: true
    exclusive_skills:
      - "divine_heal"
      - "blessing"
      - "turn_undead"
    unlock_conditions:
      level: 10
      skills:
        basic_magic: 20
      stats:
        will: 15
        learning: 10

  archbishop:
    name: "大司教"
    tier: 2
    description: "神の声を代弁する最高位の聖職者"
    description_en: "Highest priest who speaks for the gods"
    stat_modifiers:
      will: 20
      learning: 15
      magic: 15
      charisma: 10
    equipment_restrictions:
      can_use_staff: true
      can_use_robe: true
      can_use_holy_symbol: true
      can_wear_light_armor: true
    exclusive_skills:
      - "resurrection"
      - "divine_aegis"
      - "miracle"
    unlock_conditions:
      job: "cleric"
      level: 25
      skills:
        basic_magic: 50
      stats:
        will: 25
        learning: 20

  rogue:
    name: "盗賊"
    tier: 1
    description: "影を駆ける機敏なスカウト"
    description_en: "Agile scout who walks in shadows"
    stat_modifiers:
      dexterity: 10
      perception: 5
      strength: -5
    equipment_restrictions:
      can_use_dagger: true
      can_use_light_armor: true
      can_use_bow: true
      cannot_wear_heavy_armor: true
    exclusive_skills:
      - "backstab"
      - "shadow_step"
      - "pick_lock"
    unlock_conditions:
      level: 10
      skills:
        basic_martial: 20
        dagger: 20
      stats:
        dexterity: 15
        perception: 15

  assassin:
    name: "暗殺者"
    tier: 2
    description: "死をもたらす影の支配者"
    description_en: "Master of death who rules the shadows"
    stat_modifiers:
      dexterity: 20
      perception: 10
      dexterity: 5
    equipment_restrictions:
      can_use_dagger: true
      can_use_light_armor: true
      can_use_bow: true
      can_use_poison: true
      cannot_wear_heavy_armor: true
    exclusive_skills:
      - "assassinate"
      - "shadow_clone"
      - "death_mark"
    unlock_conditions:
      job: "rogue"
      level: 25
      skills:
        dagger: 50
        stealth: 30
      stats:
        dexterity: 25
        perception: 20

