      heavy_armor: true
      shields: true
      maces: true
    exclusive_skills:
      - "divine_heal"
    unlock_conditions:
      level: 5

  archbishop:
    name: "大司教"
    tier: 2
    description: "神の声を直接聴く最高位の聖職者"
    stat_modifiers:
      will: 20
      magic: 15
      healing: 20
    equipment_restrictions:
      heavy_armor: true
      shields: true
      maces: true
    exclusive_skills:
      - "resurrection"
    unlock_conditions:
      level: 15
      job: "cleric"
      skills:
        basic_magic: 35