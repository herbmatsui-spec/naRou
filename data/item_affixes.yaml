    speed: -20

# ============================================================
# フィールド説明
#   slot: 装備可能部位 (weapon/armor/any)
#   weight: 抽選重み (0 = ロール対象外、呪い専用)
#   tier: 品質階層 (1=通常, 2=良品以上, 3=奇跡以上)
#   cursed: true のとき cursed フラグ必須
#   mods: 適用される修正 (損得がペアで存在することを Step 58.4 が強制)
#         属性キーは item_system._apply_affix の動的キーに揃えること
#         (str/endurance/dexterity/... — strength は未定義のため不可)
# ============================================================
