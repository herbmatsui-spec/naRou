# Item Affixes - Phase 3 Step 57 / T32 案B バランス再調整
# すべての戦闘系接尾辞は「利得と代償の両方」を持つ (test_affixes_trade_off_two_ways が強制)
# バランス指針 (T32 案B): 利得/代償を item_generator.AFFIX_MOD_WEIGHTS の重みで
# ダメージ換算し、利得が代償の 1.5 倍を超えないこと (tests/test_affix_balance.py が強制)。
# 形骸化した代償 (非消費ステータスの減少) は最大HP減・防御減などの実効代償へ再定義した。

