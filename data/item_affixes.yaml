# ============================================================
# 呪い系 (Step 62) — 常に純代償。cursed=true とセットで付与される
# ============================================================
curse_of_thinness:
  name: "薄れの呪い"
  slot: "any"
  weight: 0  # ロール対象外: cursed 生成時のみ
  tier: 0
  cursed: true
  mods:
    dv: -5

curse_of_glass:
  name: "硝子の呪い"
  slot: "any"
  weight: 0
  tier: 0
  cursed: true
  mods:
    max_hp: -3  # 装備時に最大HP-3

