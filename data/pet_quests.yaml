# ペット固有目的テンプレート (偏執的クエストシステム / 設計書 Phase 8 Step 30)
# ペット固有目的テンプレート・進化触媒連動。

pet_quest_templates:
  # ウルフ種族のペットクエスト
  - pet_species: "wolf"
    pet_contract_type: "loyalty"
    objective_type: "kill"
    title_template: "{setting}の魔狼討伐"
    desc_template: "{setting}に出没する魔狼を{required_count}体討伐し、ペットの忠誠を高めよ。"
    reward_weight: 1.0
    base_complexity: 1
    evolution_trigger: false
    fusion_catalyst: ""

  - pet_species: "wolf"
    pet_contract_type: "loyalty"
    objective_type: "collect"
    title_template: "{setting}の魔法薬草収集"
    desc_template: "{setting}で魔法薬草を{required_count}個収集し、ペットの栄養を補給せよ。"
    reward_weight: 0.8
    base_complexity: 1
    evolution_trigger: false
    fusion_catalyst: ""

  # フェニックス種族のペットクエスト
  - pet_species: "phoenix"
    pet_contract_type: "symbiosis"
    objective_type: "explore"
    title_template: "{setting}の古代遺跡探索"
    desc_template: "{setting}の古代遺跡を{required_count}階層まで探索し、フェニックスの炎を再燃させよ。"
    reward_weight: 1.2
    base_complexity: 2
    evolution_trigger: true
    fusion_catalyst: "phoenix_feather"

  # ドラゴン種族のペットクエスト (融合後のペット)
  - pet_species: "dragon"
    pet_contract_type: "dominion"
    objective_type: "kill"
    title_template: "{setting}の古代ドラゴン討伐"
    desc_template: "{setting}に潜む古代ドラゴンを{required_count}体討伐し、ペットの真の力を解放せよ。"
    reward_weight: 1.5
    base_complexity: 3
    evolution_trigger: false
    fusion_catalyst: "dragon_scale"

  # 共通のペットクエスト (種族によらず)
  - pet_species: "*"  # ワイルドカード: 全種族に適用
    pet_contract_type: "*"  # ワイルドカード: 全契約タイプに適用
    objective_type: "collect"
    title_template: "{setting}のペット用特産品収集"
    desc_template: "{setting}でペット用特産品を{required_count}個収集し、ペットの好奇心を刺激せよ。"
    reward_weight: 0.6
    base_complexity: 1
    evolution_trigger: false
    fusion_catalyst: ""

  # 進化を促す特別クエスト
  - pet_species: "*"
    pet_contract_type: "*"
    objective_type: "kill"
    title_template: "{setting}の試練の洞窟挑戦"
    desc_template: "{setting}の試練の洞窟で{required_count}体の強敵を倒し、ペットの進化を促せ。"
    reward_weight: 1.3
    base_complexity: 2
    evolution_trigger: true
    fusion_catalyst: ""
