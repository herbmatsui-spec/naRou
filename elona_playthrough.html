  intro:{tag:'概要',title:'この動画について',body:'<p>これは本プロジェクト「<span class="k">naRou: Masterpiece Edition</span>」の<span class="k">実際のゲーム仕様</span>をもとに再現したプレイ動画です。</p><p>画面は本物と同じ<span class="k">ターミナル形式</span>（マップ＋3段HUD＋カラーログ）。右のガイドで「なぜそう動くか」を都度解説します。</p><ul><li>@ あなた ・ p 妹分シエル</li><li># 壁 ・ . 床 ・ &gt; 下り階段 ・ _ 祭壇</li><li>x 敵 ・ ! ポーション ・ $ 鉱石 ・ % 薬草</li></ul><p>操作は矢印/hjklで移動、スペースで実行、gで拾う、といった本物と同じ配置です。</p>'},

const P={ name:"名無しの冒険者",
  attrs:{STR:14,END:13,DEX:14,PER:12,LEA:11,WIL:13,MAG:12,CHA:15},
  level:1, exp:0, expNext:100, hp:30, maxhp:30, mp:10, maxmp:10,
  gold:1500, plat:12, hunger:8000, karma:20, god:"ジュア", piety:80,
  dungeonLevel:1, atkMin:9, atkMax:16,
  skills:{long_sword:3, evasion:2, healing:1, mining:1, performance:1, cooking:1, fishing:1, negotiation:1},
  quests:[
    {title:"ぷち掃討の栄誉",target:"ぷち",need:3,cur:0,gold:350,plat:2,done:false},
    {title:"オーク討伐令",target:"オーク",need:2,cur:0,gold:750,plat:3,done:false}
  ],
  titles:[], killCounts:{}, reinc:0
};
function recalcVitals(){
  P.maxhp=Math.max(10, P.attrs.END*2+P.attrs.STR+P.level*5+(P.god==="ジュア"?10:0));
  P.maxmp=Math.max(10, P.attrs.MAG*2+P.attrs.WIL+P.level*4+(P.god==="イツパロトル"?15:0));
  if(P.hp>P.maxhp)P.hp=P.maxhp; if(P.mp>P.maxmp)P.mp=P.maxmp;
}
function checkLevel(){
  while(P.exp>=P.expNext){
    P.exp-=P.expNext; P.level++; P.maxhp+=8; P.hp=P.maxhp; P.maxmp+=3; P.mp=P.maxmp;
    P.expNext=Math.floor(P.expNext*1.6);
    pushLog("レベルが"+P.level+"になった！","lv");
    if(P.level>=5 && !P.titles.includes("達人")) P.titles.push("達人");
  }
}

/* ===================== エンジン ===================== */
const W=22,H=15,TS=26,CW=W*TS,CH=H*TS, TURN_BASE=0.16;
const cv=$("view"), ctx=cv.getContext('2d');
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,k){return a+(b-a)*k;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}}

let playing=false,t=0,speed=1,muted=false,curIdx=-1,lastTs=0;
let sim=null, modal=null;

function genDungeon(sc){
  const rng=mulberry32(sc.seed||(sc.title.length*131+7));
  const g=[]; for(let y=0;y<H;y++) g.push(new Array(W).fill('#'));
  const centers=[]; const n=sc.rooms||6;
  for(let i=0;i<n;i++){
    const rw=3+Math.floor(rng()*4), rh=3+Math.floor(rng()*3);
    const rx=1+Math.floor(rng()*(W-rw-2)), ry=1+Math.floor(rng()*(H-rh-2));
    for(let y=ry;y<ry+rh;y++)for(let x=rx;x<rx+rw;x++) g[y][x]='.';
    centers.push({x:Math.floor(rx+rw/2),y:Math.floor(ry+rh/2)});
  }
  const carve=(a,b)=>{ let x=a.x,y=a.y; while(x!==b.x){g[y][x]='.';x+=x<b.x?1:-1;} while(y!==b.y){g[y][x]='.';y+=y<b.y?1:-1;} g[b.y][b.x]='.'; };
  for(let i=1;i<centers.length;i++) carve(centers[i-1],centers[i]);
  const st=centers[centers.length-1]; g[st.y][st.x]='>';
  g[centers[0].y][Math.min(W-2,centers[0].x+2)]='_';
  return {g,start:centers[0],stairs:st,centers};
}
function bfsNext(g,sx,sy,gx,gy){
  if(sx===gx&&sy===gy) return null;
  const key=(x,y)=>y*W+x; const prev=new Map(); prev.set(key(sx,sy),null);
  const q=[{x:sx,y:sy}]; let qi=0; const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(qi<q.length){ const c=q[qi++]; if(c.x===gx&&c.y===gy) break;
    for(const d of dirs){ const nx=c.x+d[0],ny=c.y+d[1];
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      if(g[ny][nx]==='#') continue;
      const k=key(nx,ny); if(prev.has(k)) continue; prev.set(k,c); q.push({x:nx,y:ny}); } }
  if(!prev.has(key(gx,gy))) return null;
  const path=[]; let cur={x:gx,y:gy};
  while(cur && prev.get(key(cur.x,cur.y))){ path.push(cur); cur=prev.get(key(cur.x,cur.y)); }
  path.reverse(); return path[0];
}
function isMobAt(x,y){ return sim.mobs.some(m=>!m.dead && m.px===x && m.py===y); }
function isPetAt(x,y){ return sim.pet && !sim.pet.dead && sim.pet.px===x && sim.pet.py===y; }
function isPlayerAt(x,y){ return sim.hero.px===x && sim.py===y; }

function buildSim(idx){
  const sc=SCENES[idx];
  const map=genDungeon(sc);
  sim={ g:map.g, start:map.start, stairs:map.stairs, centers:map.centers,
        mobs:[], items:[], route:[], routeIdx:0, floaters:[], turn:0, turnAcc:0, shake:0, log:[], descended:false, healed:0 };
  recalcVitals();
  sim.hero={px:map.start.x, py:map.start.y, lpx:map.start.x, lpy:map.start.y, anim:null, atkMin:P.atkMin, atkMax:P.atkMax};
  sim.pet={name:'妹分『シエル』',ch:'p',color:'#f9a8d4',hp:40,maxhp:40,atkMin:6,atkMax:11,px:clamp(map.start.x+1,0,W-1),py:map.start.y,lpx:0,lpy:0,anim:null,dead:false,spawn:{x:map.start.x+1,y:map.start.y},moveCd:0};
  sim.pet.lpx=sim.pet.px; sim.pet.lpy=sim.pet.py;
  const rng=mulberry32((sc.seed||1)*7+3);
  const floors=[]; for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(map.g[y][x]==='.') floors.push({x,y});
  shuffle(floors,rng);
  let fi=0;
  (sc.mobs||[]).forEach(([type,count])=>{ const tp=MOBTYPES[type];
    for(let k=0;k<count;k++){ let p; do{ p=floors[fi++ % floors.length]; }while(Math.abs(p.x-map.start.x)+Math.abs(p.y-map.start.y)<5);
      sim.mobs.push({name:tp.name,ch:tp.ch,color:tp.color,hp:tp.hp,maxhp:tp.hp,atkMin:tp.atkMin,atkMax:tp.atkMax,xp:tp.xp,gold:tp.gold,px:p.x,py:p.y,lpx:p.x,lpy:p.y,anim:null,dead:false,spawn:{x:p.x,y:p.y},aggro:false,flinch:0,moveCd:0,moveEvery:(type==='slime')?2:1}); } });
  for(let k=0;k<3;k++){ let p; do{ p=floors[fi++ % floors.length]; }while(Math.abs(p.x-map.start.x)+Math.abs(p.y-map.start.y)<3 && fi<floors.length*3);
    sim.items.push({x:p.x,y:p.y,ch:'$',amount:5+Math.floor(rng()*20)}); }
  for(let k=0;k<2;k++){ let p; do{ p=floors[fi++ % floors.length]; }while(Math.abs(p.x-map.start.x)+Math.abs(p.y-map.start.y)<3 && fi<floors.length*3);
    sim.items.push({x:p.x,y:p.y,ch:'!',amount:35}); }
  const others=map.centers.filter(c=>!(c.x===map.start.x&&c.y===map.start.y)).sort((a,b)=>(Math.abs(a.x-map.start.x)+Math.abs(a.y-map.start.y))-(Math.abs(b.x-map.start.x)+Math.abs(b.y-map.start.y)));
  sim.route=others.slice(0,3).concat([map.stairs]);
  sc.seed=(sc.seed||0)+1;
  pushLog('― 第'+(idx+1)+'章: '+sc.title+' ―','hi');
  pushLog(sc.log);
  renderScene(idx);
}
function pushLog(text,cls){ sim.log.push({t:text,c:cls||''}); if(sim.log.length>40) sim.log.shift(); }

function nearestAdjMob(ox,oy){
  let best=null,bd=1e9;
  for(const m of sim.mobs){ if(m.dead) continue; const c=Math.max(Math.abs(m.px-ox),Math.abs(m.py-oy)); if(c===1 && m.hp<bd){bd=m.hp;best=m;} }
  return best;
}
function floater(e,text,color){ sim.floaters.push({x:e.px,y:e.py,text,color,age:0}); }
function dealToMob(m,dmg,who){
  m.hp-=dmg; floater(m,'-'+dmg, who==='pet'?'#f9a8d4':'#fbbf24');
  if(m.hp<=0){
    m.dead=true; P.exp+=m.xp; P.gold+=m.gold;
    P.killCounts[m.name]=(P.killCounts[m.name]||0)+1;
    pushLog('★'+m.name+'を撃破！','hi');
    P.quests.forEach(q=>{ if(!q.done && q.target===m.name){ q.cur++; if(q.cur>=q.need){ q.done=true; P.gold+=q.gold; P.plat+=q.plat; pushLog('★依頼達成！ '+q.gold+'G + '+q.plat+'P 獲得！','lv'); } } });
    checkLevel();
  } else { pushLog((who==='pet'?'シエルが':'あなたが')+m.name+'を攻撃。('+dmg+')'); }
}
function heroAttack(m){ const dmg=randInt(P.atkMin,P.atkMax); heroAnim(m); dealToMob(m,dmg,'hero'); }
function petAttack(m){ const dmg=randInt(sim.pet.atkMin,sim.pet.atkMax); petAnim(m); dealToMob(m,dmg,'pet'); }
function heroAnim(m){ sim.hero.anim={dx:Math.sign(m.px-sim.hero.px),dy:Math.sign(m.py-sim.hero.py)}; }
function petAnim(m){ sim.pet.anim={dx:Math.sign(m.px-sim.pet.px),dy:Math.sign(m.py-sim.pet.py)}; }
function mobAttack(m){ const dmg=randInt(m.atkMin,m.atkMax); m.anim={dx:Math.sign(sim.hero.px-m.px),dy:Math.sign(sim.hero.py-m.py)}; P.hp-=dmg; floater(sim.hero,'-'+dmg,'#f87171'); sim.shake=0.22; if(P.hp<=1){ P.hp=1; pushLog(m.name+'の攻撃！('+dmg+') 瀕死だが持ちこたえた！','bad'); } else pushLog(m.name+'の攻撃！('+dmg+')','bad'); }

function stepTurn(){
  sim.hero.lpx=sim.hero.px; sim.hero.lpy=sim.hero.py;
  const adj=nearestAdjMob(sim.hero.px,sim.hero.py);
  if(adj){ heroAttack(adj); }
  else {
    const alive=sim.mobs.filter(m=>!m.dead);
    let goal;
    if(alive.length){
      let best=null,bd=1e9;
      for(const m of alive){ const c=Math.abs(m.px-sim.hero.px)+Math.abs(m.py-sim.hero.py); if(c<bd){ bd=c; best=m; } }
      goal={x:best.px,y:best.py};
    } else {
      goal=sim.route[sim.routeIdx];
      if(sim.hero.px===goal.x && sim.hero.py===goal.y){ sim.routeIdx=(sim.routeIdx+1)%sim.route.length; goal=sim.route[sim.routeIdx]; }
    }
    const step=bfsNext(sim.g,sim.hero.px,sim.hero.py,goal.x,goal.y);
    if(step && !isMobAt(step.x,step.y)){ sim.hero.px=step.x; sim.hero.py=step.y; pickItem(sim.hero.px,sim.hero.py); }
  }
  // descend
  if(sim.g[sim.hero.py][sim.hero.px]==='>'){
    if(!sim.descended){ sim.descended=true; P.dungeonLevel++; pushLog('★ダンジョン地下'+P.dungeonLevel+'階へ降り立った！','sys'); }
  } else sim.descended=false;
  // altar heal
  if(sim.g[sim.hero.py][sim.hero.px]==='_' || (sim.hero.px>0 && sim.g[sim.hero.py] && sim.g[sim.hero.py][sim.hero.px-1]==='_')){
    if(P.piety>=50 && sim.hero.lpx!==sim.hero.px){ P.hp=P.maxhp; P.mp=P.maxmp; sim.heal=1; pushLog('神【'+P.god+'】の御手があなたを包み込み、傷と魔力が全快した！','sys'); }
  }
  if(sim.turn%6===0 && P.hp<P.maxhp){ P.hp=Math.min(P.maxhp,P.hp+1); }
  // pet
  stepPet();
  // mobs
  for(const m of sim.mobs){ if(m.dead) continue;
    m.lpx=m.px; m.lpy=m.py;
    if(m.flinch>0){ m.flinch--; continue; }
    const c=Math.abs(m.px-sim.hero.px)+Math.abs(m.py-sim.hero.py);
    if(!m.aggro && c<=6) m.aggro=true;
    if(m.aggro && c>11) m.aggro=false;
    let moved=false;
    if(c<=1 && m.aggro){ mobAttack(m); }
    else if(m.moveCd<=0){
      if(m.aggro){
        const step=bfsNext(sim.g,m.px,m.py,sim.hero.px,sim.hero.py);
        if(step && !isPlayerAt(step.x,step.y) && !isMobAt(step.x,step.y)){ m.px=step.x; m.py=step.y; moved=true; }
      } else {
        const sd=Math.abs(m.px-m.spawn.x)+Math.abs(m.py-m.spawn.y);
        if(sd>2){ const step=bfsNext(sim.g,m.px,m.py,m.spawn.x,m.spawn.y); if(step && !isPlayerAt(step.x,step.y) && !isMobAt(step.x,step.y)){ m.px=step.x; m.py=step.y; moved=true; } }
        else { const dirs=[[1,0],[-1,0],[0,1],[0,-1]]; const d=dirs[Math.floor(Math.random()*4)]; const nx=m.px+d[0], ny=m.py+d[1];
          if(nx>=0&&ny>=0&&nx<W&&ny<H && sim.g[ny][nx]!=='#' && !isPlayerAt(nx,ny) && !isMobAt(nx,ny)){ m.px=nx; m.py=ny; moved=true; } }
      }
      if(moved) m.moveCd=m.moveEvery-1;
    }
    if(m.moveCd>0) m.moveCd--;
  }
  sim.turn++;
}
function stepPet(){
  const pe=sim.pet; if(pe.dead) return;
  pe.lpx=pe.px; pe.lpy=pe.py;
  if(P.hp<P.maxhp && sim.turn%8===0){ P.hp=Math.min(P.maxhp,P.hp+1); }
  const adj=nearestAdjMob(pe.px,pe.py);
  if(adj){ petAttack(adj); }
  else {
    const step=bfsNext(sim.g,pe.px,pe.py,sim.hero.px,sim.hero.py);
    if(step && !isMobAt(step.x,step.y) && !isPlayerAt(step.x,step.y)){ pe.px=step.x; pe.py=step.y; }
  }
}
function pickItem(x,y){
  const i=sim.items.findIndex(it=>it.x===x&&it.y===y);
  if(i>=0){ const it=sim.items[i]; if(it.ch==='$'){ P.gold+=it.amount; pushLog('金貨 '+it.amount+'G を拾った。'); } else { pushLog('ポーションを拾った。'); } sim.items.splice(i,1); }
}

/* ===================== 描画 ===================== */
function draw(){
  if(!sim) return;
  const frac=clamp(sim.turnAcc/TURN_BASE,0,1);
  ctx.clearRect(0,0,CW,CH);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const ch=sim.g[y][x]; const px=x*TS, py=y*TS;
    if(ch==='#'){ ctx.fillStyle='#14101f'; ctx.fillRect(px,py,TS,TS); ctx.fillStyle='#221b33'; ctx.fillRect(px+1,py+1,TS-2,TS-2); }
    else {
      ctx.fillStyle='#070b14'; ctx.fillRect(px,py,TS,TS);
      if(ch==='>'){ ctx.fillStyle='#38bdf8'; ctx.font='bold '+(TS*0.72)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('>',px+TS/2,py+TS/2); }
      else if(ch==='_'){ ctx.fillStyle='#fbbf24'; ctx.font='bold '+(TS*0.72)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('_',px+TS/2,py+TS/2); }
      else if(ch==='$'){ ctx.fillStyle='#fbbf24'; ctx.font='bold '+(TS*0.66)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$',px+TS/2,py+TS/2); }
      else if(ch==='!'){ ctx.fillStyle='#f87171'; ctx.font='bold '+(TS*0.66)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('!',px+TS/2,py+TS/2); }
      else if(ch==='%'){ ctx.fillStyle='#86efac'; ctx.font='bold '+(TS*0.6)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('%',px+TS/2,py+TS/2); }
    }
  }
  const screen=(e)=>{ const ix=lerp(e.lpx,e.px,frac), iy=lerp(e.lpy,e.py,frac); let ox=0,oy=0; if(e.anim){ ox=e.anim.dx*Math.sin(frac*Math.PI)*0.5; oy=e.anim.dy*Math.sin(frac*Math.PI)*0.5; } return {x:(ix+0.5+ox)*TS, y:(iy+0.5+oy)*TS}; };
  for(const m of sim.mobs){ if(m.dead) continue; const s=screen(m);
    ctx.fillStyle=m.color; ctx.font='bold '+(TS*0.82)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(m.ch,s.x,s.y);
    if(m.hp<m.maxhp){ const bw=TS*0.7; ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(s.x-bw/2-1,s.y-TS*0.5-1,bw+2,5); ctx.fillStyle='#ef4444'; ctx.fillRect(s.x-bw/2,s.y-TS*0.5,bw*clamp(m.hp/m.maxhp,0,1),3); }
  }
  if(sim.pet && !sim.pet.dead){ const s=screen(sim.pet); ctx.fillStyle=sim.pet.color; ctx.font='bold '+(TS*0.82)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(sim.pet.ch,s.x,s.y); }
  const hs=screen(sim.hero); ctx.fillStyle='#fde047'; ctx.font='bold '+(TS*0.86)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('@',hs.x,hs.y);
  for(const f of sim.floaters){ const a=clamp(1-f.age/0.9,0,1); ctx.globalAlpha=a; ctx.font='bold 14px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.strokeText(f.text,f.x*TS+TS/2,f.y*TS+TS/2-f.age*26); ctx.fillStyle=f.color; ctx.fillText(f.text,f.x*TS+TS/2,f.y*TS+TS/2-f.age*26); ctx.globalAlpha=1; }
  ctx.save();
  if(sim.shake>0){ const s=sim.shake*14; ctx.translate((Math.random()*2-1)*s,(Math.random()*2-1)*s); }
  ctx.restore();
  updateHUD(); updateLog();
}
function updateHUD(){
  const hungerStr = P.hunger<1000 ? '★飢餓' : (P.hunger<3000?'腹減り':'');
  $("hud1").innerHTML = '<span><b>'+P.name+'</b> '+(hungerStr?'<span style="color:#f87171">['+hungerStr+']</span>':'')+'</span>'
    + ' HP:<span class="track"><i style="width:'+(P.hp/P.maxhp*100)+'%"></i></span> <b>'+P.hp+'/'+P.maxhp+'</b>'
    + ' MP:<span class="track"><i class="mp" style="width:'+(P.mp/P.maxmp*100)+'%"></i></span> <b>'+P.mp+'/'+P.maxmp+'</b>'
    + ' Lv.<b>'+P.level+'</b> <b>'+P.gold+'G</b> '+P.plat+'P';
  $("hud2").innerHTML = '<span>【仲間】<b style="color:#f9a8d4">シエル</b> HP:<span class="track"><i class="pe" style="width:'+(sim.pet.hp/sim.pet.maxhp*100)+'%"></i></span></span>'
    + ' 信仰:<b>'+P.god+'</b>('+P.piety+')'
    + ' <b>B'+P.dungeonLevel+'F</b>'
    + ' 転生:<b>'+P.reinc+'</b>';
  // context hint
  let hint='💡 ―';
  const hx=sim.hero.px, hy=sim.hero.py;
  if(sim.g[hy][hx]==='>') hint='💡 下り階段の上：[>]で次の地下階層へ';
  else if(sim.g[hy][hx]==='_'||(hx>0&&sim.g[hy][hx-1]==='_')) hint='💡 祭壇の上：[o]で祈り全快 / [p]で供物';
  else { const it=sim.items.find(i=>i.x===hx&&i.y===hy); if(it) hint='💡 足元: ['+(it.ch==='$'?'金貨':'ポーション')+'] がある ([g]で拾う)'; }
  $("hud3").textContent=hint;
}
function updateLog(){ $("msglog").innerHTML=sim.log.slice(-6).map(l=>'<div class="'+l.c+'">'+l.t+'</div>').join(''); }

/* ===================== ガイド / モーダル ===================== */
function setGuide(topic){ const g=GUIDE[topic]||GUIDE.intro; $("gTag").textContent=g.tag; $("gTitle").textContent=g.title; $("gBody").innerHTML=g.body; }
function openModal(type){
  const m=$("modal"); let html='';
  if(type==='title'){ html='<div class="big">naRou: Masterpiece Edition</div><div class="sm">本格ローグライクRPG。この動画はプロジェクトの実際の仕様で進行を再現します。</div><div class="box">操作：矢印/hjkl 移動 ・ スペース 実行 ・ g 拾う ・ i インベントリ ・ c 詠唱 ・ p 祈り ・ ? ガイド<br>右の「初心者ガイド」で仕組みを随時解説。</div>'; }
  else if(type==='status'){ let at=''; for(const k in P.attrs){ at+='<span class="at">'+k+'</span> '+P.attrs[k]+'　'; } let sk=''; for(const k in P.skills){ sk+=k+' Lv'+P.skills[k]+'　'; }
    html='<div class="big">ステータス</div><div class="box"><b>'+P.name+'</b>　Lv.'+P.level+'<br>HP '+P.hp+'/'+P.maxhp+'　MP '+P.mp+'/'+P.maxmp+'<br>'+at+'<br>スキル：'+sk+'<br>信仰 '+P.god+'（piety '+P.piety+'）　カルマ '+P.karma+'</div>'; }
  else if(type==='inv'){ let it=''; INVENTORY_INIT.forEach(x=>{ it+='・'+x.name+'（'+x.mat+' / '+x.note+'）<br>'; });
    html='<div class="big">インベントリ</div><div class="box">'+it+'<br>所持金 '+P.gold+'G / '+P.plat+'P</div>'; }
  else if(type==='quest'){ let q=''; P.quests.forEach(x=>{ q+='・'+x.title+'：'+x.target+' '+x.cur+'/'+x.need+' → '+x.gold+'G+'+x.plat+'P'+(x.done?' ✓':'')+'<br>'; });
    html='<div class="big">依頼一覧</div><div class="box">'+q+'</div>'; }
  else if(type==='help'){ html='<div class="big">初心者ガイド</div><div class="box">この動画は本プロジェクトの仕様を再現しています。<br>・マップはターミナル形式（@=あなた, p=シエル, x=敵, &gt;=階段, _=祭壇）<br>・戦闘は「命中率＝75+DEX差+武器hit×5」「ダメージ＝ダイス和+補正+STR/3」<br>・カルマ・転生・ネフィアなど、右ガイドで順に解説<br>・クリア後は「輪廻転生」が真の終盤</div>'; }
  else if(type==='reinc'){ html='<div class="big">輪廻転生デモ</div><div class="box">転生回数：'+P.reinc+' → 1<br>・レベルが1に戻るが敵が強化（最大×5ステ/×6HP）<br>・ドロップ率アップ<br>・レガシースキル解放：魂の記憶 / 転生の膂力 / 不滅の意思<br>→ 何周も遊べるのが本作の真髄。</div>'; }
  m.innerHTML=html+'<button class="primary" onclick="closeModal()">閉じる</button>'; m.classList.add('show');
}
function closeModal(){ modal=null; $("modal").classList.remove("show"); }

/* ===================== タイムライン / 再生 ===================== */
function fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,'0'); }
function currentIndex(){ for(let i=SCENES.length-1;i>=0;i--){ if(t>=STD[i]) return i; } return 0; }
function syncUI(){ $("scrub").value=t; $("clock").textContent=fmt(t)+" / "+fmt(TOTAL); }
function renderScene(i){
  const sc=SCENES[i];
  $("icon").textContent=sc.icon; $("title").textContent=sc.title; $("desc").textContent=sc.desc;
  $("chapNo").textContent=(i+1); $("chapNow").textContent="第"+(i+1)+"章 / 全24章";
  setGuide(sc.guide);
  [...$("chapters").children].forEach((b,bi)=>b.classList.toggle("cur",bi===i));
  blip();
}
function processBeats(idx, lt){
  const sc=SCENES[idx];
  (sc.beats||[]).forEach(b=>{ if(!b._done && lt>=b.at){ b._done=true;
    if(b.modal) openModal(b.modal);
    if(b.log) pushLog(b.log, b.cls);
  } });
}
function buildChapters(){
  const c=$("chapters"); c.innerHTML="";
  SCENES.forEach((sc,i)=>{ const b=document.createElement("button"); b.textContent=(i+1); b.title=sc.title;
    b.onclick=()=>{ seek(STD[i]+0.05); if(!playing) togglePlay(); }; c.appendChild(b); });
}
function loop(ts){
  if(!playing){ lastTs=ts; return; }
  const dt=Math.min(0.05,(ts-lastTs)/1000); lastTs=ts;
  t+=dt*speed;
  if(t>=TOTAL){ t=TOTAL; playing=false; $("playBtn").textContent="▶ 再生"; showEnd(); }
  ensureSim(currentIndex());
  sim.turnAcc+=dt*speed;
  let guard=0; while(sim.turnAcc>=TURN_BASE && guard<200){ stepTurn(); sim.turnAcc-=TURN_BASE; guard++; }
  for(const f of sim.floaters) f.age+=dt*speed;
  sim.floaters=sim.floaters.filter(f=>f.age<0.9);
  if(sim.shake>0) sim.shake-=dt*speed;
  const idx=currentIndex(); processBeats(idx, t-STD[idx]);
  syncUI(); draw();
  if(playing) requestAnimationFrame(loop);
}
function ensureSim(idx){ if(curIdx!==idx){ curIdx=idx; buildSim(idx); modal=null; $("modal").classList.remove("show"); } }
function togglePlay(){
  if(playing){ playing=false; $("playBtn").textContent="▶ 再生"; return; }
  if(t>=TOTAL) t=0;
  playing=true; $("playBtn").textContent="⏸ 一時停止"; hideEnd();
  ensureSim(currentIndex()); lastTs=performance.now(); requestAnimationFrame(loop);
}
function restart(){ t=0; curIdx=-1; hideEnd(); syncUI(); if(playing){ playing=false; $("playBtn").textContent="▶ 再生"; } ensureSim(0); draw(); }
function seek(sec){ t=Math.min(TOTAL,Math.max(0,sec)); ensureSim(currentIndex()); syncUI(); draw(); }
function onScrub(v){ seek(parseFloat(v)); }
function seekBy(d){ seek(t+d); }
function setSpeed(s){ speed=s; ["sp1","sp2","sp4"].forEach(id=>$(id).classList.remove("active")); $(s===1?"sp1":s===2?"sp2":"sp4").classList.add("active"); }
function showEnd(){ openModal('reinc'); $("endStats")&&($("endStats").textContent="LV "+P.level+" ・ 転生"+P.reinc+" ・ 全24章クリア"); }
function hideEnd(){ }
function openHelp(){ openModal('help'); }

let actx=null;
function blip(){ if(muted) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=520; g.gain.value=0.04;
  o.connect(g); g.connect(actx.destination); o.start(); o.frequency.exponentialRampToValueAtTime(780,actx.currentTime+0.12);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.22); o.stop(actx.currentTime+0.24); }catch(e){} }
function toggleMute(){ muted=!muted; $("muteBtn").textContent=muted?"🔇":"🔊"; }

buildChapters();
ensureSim(0);
draw();
</script>
