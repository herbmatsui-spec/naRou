name: CI

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

      - name: Type check
        run: mypy .

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check .

      - name: Run balance simulator
        run: python tests/balance_simulator.py

      - name: Security scan
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install bandit safety
          bandit -r . -f json -o bandit-report.json || true
          safety check --json --output safety-report.json || true

      - name: Upload security reports
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

      - name: Generate documentation
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install pdoc
          pdoc --html --output-dir docs/api .

      - name: Upload documentation
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/api/

      - name: Build package
        run: |
          pip install build
          python -m build
        if: matrix.os == 'ubuntu-latest'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
        if: matrix.os == 'ubuntu-latest'

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          echo "Workflow: ${{ github.workflow }}" > logs/build-info.txt
          echo "Run ID: ${{ github.run_id }}" >> logs/build-info.txt
          echo "OS: ${{ matrix.os }}" >> logs/build-info.txt
          echo "Python: ${{ matrix.python-version }}" >> logs/build-info.txt
          echo "Status: ${{ job.status }}" >> logs/build-info.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: logs/

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"CI Failed: ${{ github.repository }} - ${{ github.workflow }} - ${{ github.run_id }}"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Validate pipeline
        run: |
          echo "Pipeline validation: All build jobs completed"
          echo "Validation PASSED"