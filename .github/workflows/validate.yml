name: CI Validation (naRou Refactoring)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Code Quality & Balance Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy ruff black pytest

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Type check (mypy)
        run: |
          mypy . || true

      - name: Validate Code Quality (Linter & Types)
        run: |
          python validate.py --code || true

      - name: Run Unit & Integration Tests
        run: |
          python validate.py --tests

      - name: Validate Battle Balance Simulator
        run: |
          python validate.py --balance
