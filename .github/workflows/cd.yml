name: CD

"on":
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Build (PyInstaller)
        run: python build.py --platform all

      - name: Code sign macOS (codesign)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "Code signing macOS bundle (cert from secrets)"

      - name: Code sign Windows (codesign)
        if: runner.os == 'Windows'
        env:
          WINDOWS_PFX: ${{ secrets.WINDOWS_PFX }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          echo "Code signing Windows binary (cert from secrets)"

      - name: Verify build
        run: python tools/verify_build.py --binary dist/naRou

      - name: Generate checksums & manifest
        run: |
          python tools/gen_checksums.py --dir dist
          python tools/gen_manifest.py --dir dist --version "${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: naRou-${{ matrix.os }}
          path: |
            dist/
            !dist/*.egg-info

  deploy:
    name: Deploy (itch + steam)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
      - name: Deploy to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: python deploy.py --env production --target itch || true
      - name: Deploy to Steam
        env:
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
        run: python deploy.py --env production --target steam || true
      - name: Rollback on failure
        if: failure()
        run: python deploy.py --rollback
