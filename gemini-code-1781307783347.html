<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elona Clone - Day 5</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #eeeeee;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #main-container {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }

        #game-screen {
            font-size: 24px;
            line-height: 1.1;
            background-color: #111111;
            padding: 20px;
            border: 2px solid #333333;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            margin: 0;
        }

        #inventory-window {
            width: 250px;
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 5px;
            padding: 15px;
            font-size: 16px;
            overflow-y: auto;
        }

        #inventory-window h3 {
            margin-top: 0;
            color: #f1c40f;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        #status-bar {
            width: 800px;
            background-color: #222;
            padding: 5px 15px;
            border: 2px solid #444;
            border-radius: 5px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }

        .warning {
            color: #e74c3c;
        }

        .ether-warning {
            color: #9b59b6;
        }

        .level-up {
            color: #f39c12;
            font-weight: bold;
        }

        #log-window {
            width: 800px;
            height: 120px;
            background-color: #1a1a1a;
            border: 2px solid #444;
            border-radius: 5px;
            padding: 10px;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .log-message {
            margin: 2px 0;
            font-size: 16px;
            color: #bdc3c7;
        }

        .log-message.new {
            color: #ffffff;
            font-weight: bold;
        }

        .log-damage {
            color: #e74c3c;
        }

        .player {
            color: #f1c40f;
            font-weight: bold;
        }

        .wall {
            color: #555555;
        }

        .floor {
            color: #2a2a2a;
        }

        .item {
            color: #2ecc71;
            font-weight: bold;
        }

        .corpse {
            color: #c0392b;
            font-weight: bold;
        }

        .npc {
            color: #e74c3c;
            font-weight: bold;
        }

        .stairs {
            color: #3498db;
            font-weight: bold;
        }

        /* 階段は青色 */
    </style>
</head>

<body>

    <div id="status-bar"></div>

    <div id="main-container">
        <pre id="game-screen"></pre>
        <div id="inventory-window">
            <h3>持ち物</h3>
            <div id="inventory-list">空っぽ</div>
        </div>
    </div>

    <div id="log-window"></div>

    <script>
        const WIDTH = 40;
        const HEIGHT = 20;

        // --- 1. マップデータ管理の構造化 ---
        // わが家のデータ（永続化）
        let homeMap = [], homeItems = [], homeNpcs = [];
        let homeDiscovered = [];
        // ダンジョンのデータ（毎回再生成）
        let dungeonMap = [], dungeonItems = [], dungeonNpcs = [];
        let dungeonDiscovered = [];

        // 現在画面に表示し、操作の対象となるデータへの参照（ポインタ）
        let map = [], items = [], npcs = [];
        let discoveredMap = [];
        let currentLevel = 'home'; // 'home' or 'dungeon'
        let dungeonLevel = 1;

        const messages = [];
        let inventoryCursor = 0;

        const player = {
            x: 20, y: 10,
            level: 1, exp: 0, nextExp: 20,
            hp: 30, maxHp: 30,
            str: 10, spd: 70, energy: 100,
            satiety: 100, ether: 0,
            inventory: []
        };

        const screen = document.getElementById('game-screen');
        const logWindow = document.getElementById('log-window');
        const statusBar = document.getElementById('status-bar');
        const inventoryList = document.getElementById('inventory-list');

        function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function generateItemName() {
            const states = ['祝福された', '', '呪われた'];
            const mods = ['鉄の', '腐った', '生ゴミの', '血塗られた'];
            const bases = ['剣', 'パン', '剥製', '指輪'];
            return `${pickRandom(states)} ${pickRandom(mods)} ${pickRandom(bases)}`.trim();
        }

        function generateNPC(level = 1) {
            const names = ['プチ', 'かたつむり', '観光客', '妹', 'やどかり'];
            const symbols = ['p', 'k', 's', 'e', 'E'];
            const hpBase = Math.floor(Math.random() * 11) + 10;
            return {
                name: pickRandom(names), symbol: pickRandom(symbols),
                hp: hpBase + (level * 5),
                str: (Math.floor(Math.random() * 4) + 2) + Math.floor(level * 1.5),
                spd: Math.floor(Math.random() * 31) + 30,
                energy: 0
            };
        }

        function addLog(text, isDamage = false) {
            messages.push({ text, isDamage });
            if (messages.length > 5) messages.shift();
            updateLogWindow();
        }

        function updateLogWindow() {
            logWindow.innerHTML = '';
            messages.forEach((msg, index) => {
                const div = document.createElement('div');
                div.textContent = msg.text;
                div.className = 'log-message';
                if (msg.isDamage) div.classList.add('log-damage');
                if (index === messages.length - 1 && !msg.isDamage) div.classList.add('new');
                logWindow.appendChild(div);
            });
        }

        function updateStatus() {
            const hpClass = player.hp <= player.maxHp * 0.3 ? 'warning' : '';
            const satClass = player.satiety <= 20 ? 'warning' : '';
            const etherClass = player.ether >= 80 ? 'ether-warning' : '';
            const loc = currentLevel === 'home' ? 'わが家' : `B${dungeonLevel}F`;
            statusBar.innerHTML = `
                <span>[${loc}] Lv: ${player.level} (Exp:${player.exp}/${player.nextExp})</span>
                <span class="${hpClass}">HP: ${Math.floor(Math.max(0, player.hp))} / ${player.maxHp}</span>
                <span>Str: ${player.str} | Spd: ${player.spd}</span>
                <span class="${satClass}">満腹: ${player.satiety}%</span>
                <span class="${etherClass}">エーテル: ${player.ether}%</span>
            `;
        }

        function updateInventory() {
            if (player.inventory.length === 0) {
                inventoryList.innerHTML = '空っぽ<br><br><span style="color:#7f8c8d;font-size:14px;">[g] 拾う<br>[z][x] 選択<br>[e] 食べる / [d] 置く</span>';
            } else {
                inventoryList.innerHTML = player.inventory.map((item, index) => {
                    const isSelected = index === inventoryCursor;
                    const style = isSelected ? 'background-color: #333; color: #fff; padding-left: 5px; border-left: 3px solid #f1c40f;' : '';
                    const prefix = isSelected ? '> ' : '&nbsp; ';
                    return `<div style="${style}">${prefix}${item.name}</div>`;
                }).join('') + '<br><span style="color:#7f8c8d;font-size:14px;">[g] 拾う<br>[z][x] 選択<br>[e] 食べる / [d] 置く</span>';
            }
        }

        // --- 2. マップ生成ロジックの分離 ---

        // 「わが家」の生成（ゲーム開始時に1回だけ呼ばれる）
        function createHome() {
            homeMap = []; homeItems = []; homeNpcs = []; homeDiscovered = [];
            for (let y = 0; y < HEIGHT; y++) {
                const row = [];
                const discRow = [];
                for (let x = 0; x < WIDTH; x++) {
                    if (x === 0 || x === WIDTH - 1 || y === 0 || y === HEIGHT - 1) row.push('#');
                    else row.push('.');
                    discRow.push(false);
                }
                homeMap.push(row);
                homeDiscovered.push(discRow);
            }
            // 中央にダンジョンへの下り階段
            homeMap[10][20] = '>';

            // 家の初期アイテム（チュートリアル用）
            homeItems.push({ x: 22, y: 10, name: '祝福された 偉大な パン', symbol: '*' });
        }

        // 「ダンジョン」の生成（階段を降りるたびに毎回呼ばれる）
        function createDungeon() {
            dungeonMap = []; dungeonItems = []; dungeonNpcs = []; dungeonDiscovered = [];
            // 部屋と通路によるダンジョン生成
            for (let y = 0; y < HEIGHT; y++) {
                dungeonMap.push(new Array(WIDTH).fill('#'));
                dungeonDiscovered.push(new Array(WIDTH).fill(false));
            }

            const rooms = [];
            const roomCount = 4 + Math.floor(Math.random() * 3);
            for (let i = 0; i < roomCount; i++) {
                const w = 4 + Math.floor(Math.random() * 6);
                const h = 4 + Math.floor(Math.random() * 5);
                const x = 2 + Math.floor(Math.random() * (WIDTH - w - 4));
                const y = 2 + Math.floor(Math.random() * (HEIGHT - h - 4));
                const room = { x, y, w, h, center: { x: Math.floor(x + w / 2), y: Math.floor(y + h / 2) } };
                rooms.push(room);

                for (let ry = y; ry < y + h; ry++) {
                    for (let rx = x; rx < x + w; rx++) {
                        dungeonMap[ry][rx] = '.';
                    }
                }

                if (i > 0) {
                    const prev = rooms[i - 1];
                    let cx = prev.center.x, cy = prev.center.y;
                    while (cx !== room.center.x) {
                        dungeonMap[cy][cx] = '.';
                        cx += Math.sign(room.center.x - cx);
                    }
                    while (cy !== room.center.y) {
                        dungeonMap[cy][cx] = '.';
                        cy += Math.sign(room.center.y - cy);
                    }
                }
            }

            const floorCoords = [];
            for (let y = 0; y < HEIGHT; y++) {
                for (let x = 0; x < WIDTH; x++) {
                    if (dungeonMap[y][x] === '.') floorCoords.push({ x, y });
                }
            }
            floorCoords.sort(() => Math.random() - 0.5);

            // プレイヤーを配置する上り階段を作成
            const stairPos = floorCoords.pop();
            dungeonMap[stairPos.y][stairPos.x] = '<';
            player.x = stairPos.x;
            player.y = stairPos.y;

            // 下り階段
            const downStairPos = floorCoords.pop();
            dungeonMap[downStairPos.y][downStairPos.x] = '>';

            for (let i = 0; i < 10; i++) {
                const pos = floorCoords.pop();
                dungeonItems.push({ x: pos.x, y: pos.y, name: generateItemName(), symbol: '*' });
            }

            for (let i = 0; i < 6 + dungeonLevel; i++) {
                const pos = floorCoords.pop();
                dungeonNpcs.push({ ...generateNPC(dungeonLevel), x: pos.x, y: pos.y });
            }
        }

        // マップ切り替え処理
        function loadMapData(levelType) {
            currentLevel = levelType;
            if (levelType === 'home') {
                map = homeMap; items = homeItems; npcs = homeNpcs; discoveredMap = homeDiscovered;
            } else {
                map = dungeonMap; items = dungeonItems; npcs = dungeonNpcs; discoveredMap = dungeonDiscovered;
            }
        }

        // --- 3. 描画とゲームループ ---
        function draw() {
            let output = '';
            for (let y = 0; y < HEIGHT; y++) {
                for (let x = 0; x < WIDTH; x++) {
                    // 視界の計算（ユークリッド距離）
                    const dist = Math.sqrt(Math.pow(x - player.x, 2) + Math.pow(y - player.y, 2));
                    const isVisible = dist <= 6;

                    if (isVisible) discoveredMap[y][x] = true;

                    if (!discoveredMap[y][x]) {
                        output += '<span style="color:#000;"> </span>';
                        continue;
                    }

                    const isPlayer = (x === player.x && y === player.y);
                    const npc = npcs.find(n => n.x === x && n.y === y);
                    const item = items.find(i => i.x === x && i.y === y);

                    let cellHtml = '';
                    if (isPlayer) cellHtml = player.hp > 0 ? '<span class="player">@</span>' : '<span class="npc">✝</span>';
                    else if (npc && isVisible) cellHtml = `<span class="npc">${npc.symbol}</span>`;
                    else if (item) {
                        const itemClass = item.name.includes('死体') ? 'corpse' : 'item';
                        cellHtml = `<span class="${itemClass}">${item.symbol}</span>`;
                    }
                    else if (map[y][x] === '>') cellHtml = '<span class="stairs">&gt;</span>';
                    else if (map[y][x] === '<') cellHtml = '<span class="stairs">&lt;</span>';
                    else if (map[y][x] === '#') cellHtml = '<span class="wall">#</span>';
                    else cellHtml = '<span class="floor">.</span>';

                    if (!isVisible && !isPlayer) {
                        cellHtml = `<span style="opacity: 0.3;">${cellHtml}</span>`;
                    }
                    output += cellHtml;
                }
                output += '<br>';
            }
            screen.innerHTML = output;
        }

        function attackNPC(targetNPC, index) {
            const damage = player.str + Math.floor(Math.random() * 5) + 1;
            targetNPC.hp -= damage;
            addLog(`あなたは ${targetNPC.name} を殴った！ ${damage} のダメージ！`);
            if (targetNPC.hp <= 0) {
                addLog(`${targetNPC.name} はミンチになった。`, true);
                items.push({ x: targetNPC.x, y: targetNPC.y, name: targetNPC.name + 'の死体', symbol: '%' });
                npcs.splice(index, 1);

                // 経験値とレベルアップ処理
                const expGain = 5 + Math.floor(Math.random() * 10);
                player.exp += expGain;
                if (player.exp >= player.nextExp) {
                    player.level++;
                    player.maxHp += 10;
                    player.hp = player.maxHp;
                    player.str += 3;
                    player.spd += 2;
                    player.exp -= player.nextExp;
                    player.nextExp = Math.floor(player.nextExp * 1.5);
                    addLog(`【レベルアップ！】 レベルが ${player.level} に上がった！`, false);
                }
            }
        }

        function npcAction(npc, index) {
            const dist = Math.abs(npc.x - player.x) + Math.abs(npc.y - player.y);
            if (dist === 1) {
                const damage = npc.str + Math.floor(Math.random() * 3);
                player.hp -= damage;
                addLog(`${npc.name} に引っかかれた！ ${damage} のダメージ！`, true);
                if (player.hp <= 0) addLog("あなたは死んだ...", true);
            } else {
                const dirs = [{ dx: 0, dy: -1 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 1, dy: 0 }];
                const move = pickRandom(dirs);
                const nextX = npc.x + move.dx;
                const nextY = npc.y + move.dy;
                if (map[nextY][nextX] !== '#' && !npcs.some(n => n.x === nextX && n.y === nextY) && !(player.x === nextX && player.y === nextY)) {
                    npc.x = nextX;
                    npc.y = nextY;
                }
            }
        }

        function processTurn() {
            player.energy -= 100;
            player.satiety -= 1;
            if (player.satiety <= 0) {
                player.hp -= 1;
                addLog("あなたは飢えに苦しんでいる！", true);
            } else {
                // HP自然回復
                if (player.hp < player.maxHp && Math.random() < 0.2) {
                    player.hp += 1;
                }
            }
            if (Math.random() < 0.05) {
                player.ether += 5;
                if (player.ether >= 100) {
                    addLog("【警告】エーテル病が発症した！体が変異していく…！", true);
                    player.str += 10;
                    player.spd = Math.max(10, player.spd - 20);
                    player.ether = 0;
                }
            }
            let safetyVal = 0;
            while (player.energy < 100 && player.hp > 0) {
                if (safetyVal++ > 1000) break;
                player.energy += player.spd;
                for (let i = npcs.length - 1; i >= 0; i--) {
                    let npc = npcs[i];
                    npc.energy += npc.spd;
                    if (npc.energy >= 100) {
                        npcAction(npc, i);
                        npc.energy -= 100;
                    }
                }
            }
            updateStatus();
            draw();
        }

        // --- 4. 入力制御（置く、階段移動の追加） ---
        window.addEventListener('keydown', (e) => {
            if (player.hp <= 0) return;

            let dx = 0, dy = 0;
            let actionTaken = false;

            // カーソルの補正
            inventoryCursor = Math.max(0, Math.min(inventoryCursor, player.inventory.length - 1));

            if (e.key === 'ArrowUp' || e.key === 'w') dy = -1;
            else if (e.key === 'ArrowDown' || e.key === 's') dy = 1;
            else if (e.key === 'ArrowLeft' || e.key === 'a') dx = -1;
            else if (e.key === 'ArrowRight' || e.key === 'd') dx = 1;
            else if (e.key === ' ') actionTaken = true;

            else if (e.key === 'g') { // 拾う
                const itemIndex = items.findIndex(i => i.x === player.x && i.y === player.y);
                if (itemIndex !== -1) {
                    const pickedItem = items.splice(itemIndex, 1)[0];
                    player.inventory.push(pickedItem);
                    addLog(`${pickedItem.name} を拾った。`);
                    updateInventory();
                    actionTaken = true;
                } else addLog("足元には何もない。");
            }
            else if (e.key === 'z') { // インベントリカーソル上
                inventoryCursor = Math.max(0, inventoryCursor - 1);
                updateInventory();
            }
            else if (e.key === 'x') { // インベントリカーソル下
                inventoryCursor = Math.min(player.inventory.length - 1, inventoryCursor + 1);
                updateInventory();
            }
            else if (e.key === 'e') { // 食べる
                if (player.inventory.length > 0) {
                    const eatenItem = player.inventory.splice(inventoryCursor, 1)[0];
                    player.satiety = Math.min(100, player.satiety + 50);
                    addLog(`${eatenItem.name} を食べた。`);
                    if (eatenItem.name.includes('死体')) {
                        const strChange = Math.floor(Math.random() * 6) - 2;
                        const spdChange = Math.floor(Math.random() * 6) - 2;
                        player.str += strChange; player.spd += spdChange;
                        addLog(`狂気が満ちた… (Str ${strChange > 0 ? '+' + strChange : strChange}, Spd ${spdChange > 0 ? '+' + spdChange : spdChange})`, true);
                    }
                    inventoryCursor = Math.min(inventoryCursor, player.inventory.length - 1);
                    updateInventory();
                    actionTaken = true;
                } else addLog("食べるものが無い！");
            }
            else if (e.key === 'd') {
                if (player.inventory.length > 0) {
                    const droppedItem = player.inventory.splice(inventoryCursor, 1)[0];
                    droppedItem.x = player.x;
                    droppedItem.y = player.y;
                    items.push(droppedItem);
                    addLog(`${droppedItem.name} を床に置いた。`);
                    inventoryCursor = Math.min(inventoryCursor, player.inventory.length - 1);
                    updateInventory();
                    actionTaken = true;
                } else addLog("置くものが無い！");
            }
            else if (e.key === 'Enter') {
                if (map[player.y][player.x] === '>') {
                    if (currentLevel === 'home') dungeonLevel = 1;
                    else dungeonLevel++;
                    createDungeon();
                    loadMapData('dungeon');
                    addLog(currentLevel === 'home' ? "ダンジョンに足を踏み入れた…！" : `地下${dungeonLevel}階へ降りた。`);
                    actionTaken = true;
                } else if (map[player.y][player.x] === '<') {
                    if (currentLevel === 'home') {
                        addLog("ここから先は外の世界だ。まだ早い。");
                    } else {
                        if (dungeonLevel === 1) {
                            loadMapData('home');
                            for (let y = 0; y < HEIGHT; y++) {
                                for (let x = 0; x < WIDTH; x++) {
                                    if (homeMap[y][x] === '>') {
                                        player.x = x; player.y = y;
                                    }
                                }
                            }
                            addLog("わが家に帰還した。");
                        } else {
                            dungeonLevel--;
                            createDungeon();
                            loadMapData('dungeon');
                            addLog(`地下${dungeonLevel}階へ昇った。`);
                        }
                        actionTaken = true;
                    }
                } else {
                    addLog("ここには階段がない。");
                }
            }

            // 移動・攻撃の処理
            if (dx !== 0 || dy !== 0) {
                e.preventDefault();
                const nextX = player.x + dx;
                const nextY = player.y + dy;

                if (nextX >= 0 && nextX < WIDTH && nextY >= 0 && nextY < HEIGHT && map[nextY][nextX] !== '#') {
                    const hitNPCIndex = npcs.findIndex(n => n.x === nextX && n.y === nextY);

                    if (hitNPCIndex !== -1) {
                        attackNPC(npcs[hitNPCIndex], hitNPCIndex);
                        actionTaken = true;
                    } else {
                        player.x = nextX;
                        player.y = nextY;
                        actionTaken = true;

                        const steppedItem = items.find(i => i.x === player.x && i.y === player.y);
                        if (steppedItem) addLog(`${steppedItem.name} が落ちている。`);

                        // 階段に乗った時のメッセージ
                        if (map[player.y][player.x] === '>') addLog("下り階段がある。(Enterで降りる)");
                        if (map[player.y][player.x] === '<') addLog("上り階段がある。(Enterで昇る)");
                    }
                }
            }

            if (actionTaken) processTurn();
        });

        // --- 起動 ---
        createHome();      // まず「わが家」のデータを生成
        loadMapData('home'); // わが家を現在のマップとしてロード
        addLog("あなたはノースティリスに降り立った。");
        addLog("チュートリアル: 矢印キーで移動、[g]拾う [e]食べる [Enter]階段");
        updateStatus();
        updateInventory();
        draw();

    </script>
</body>

</html>
