[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naRou"
description = "Elona Roguelike Clone - Ultimate Masterpiece Edition"
version = "1.0.0"
authors = [
    {name = "naRou Developers", email = "dev@narou.example"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "tcod>=12.0",
    "Pillow>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "watchdog>=2.0",
]

[project.scripts]
narou = "game:main"

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]