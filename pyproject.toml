[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naRou"
description = "Elona Roguelike Clone - Ultimate Masterpiece Edition"
version = "1.0.0"
authors = [
    {name = "naRou Developers", email = "dev@narou.example"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "tcod>=12.0",
    "Pillow>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "watchdog>=2.0",
    "ruff>=0.5",
    "mypy>=1.0",
    "black>=24.0",
    "isort>=5.13",
]

[project.scripts]
narou = "game:main"

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "F401", "F403", "F405", "E501", "E722", "F841", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
strict = false
explicit_package_bases = true
exclude = [
    "src/relationships/__init__.py",
    "naRou/audio/dynamic_audio.py",
]

[[tool.mypy.overrides]]
module = [
    "simpleaudio",
    "pygame",
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["."]
