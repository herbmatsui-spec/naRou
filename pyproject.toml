[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naRou"
description = "Elona Roguelike Clone - Ultimate Masterpiece Edition"
version = "1.0.0"
authors = [
    {name = "naRou Developers", email = "dev@narou.example"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "tcod>=12.0",
    "Pillow>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "watchdog>=2.0",
]

[project.scripts]
narou = "game:main"

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "-v"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
# 以下はスタイル系・意図的パターンのため非検査:
# - E701/E702: 1行複文は requirements.txt の black フォーマッタが整形する担当
# - E402: 循環インポート回避のための関数内遅延 import を許容
# - F841: 呼び出し側の戻り値 (changed = ...) を意図的に破棄するパターンを許容
# - E741: ループ変数 l (ログ行・リスナーID等) の短縮名を許容
ignore = ["E701", "E702", "E402", "F841", "E741"]