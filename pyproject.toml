[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naRogue"
description = "Elona Roguelike Clone - Ultimate Masterpiece Edition"
version = "1.0.0"
authors = [
    {name = "naRou Developers", email = "dev@narou.example"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tcod>=21.2.1",
    "PyYAML>=6.0.2",
    "cryptography>=42.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "Pillow>=8.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "isort>=5.13",
    "watchdog>=2.0",
]

[project.scripts]
narou = "naRou.game:main"
narogue = "naRou.game:main"

[tool.setuptools]
# リポジトリはフラットレイアウト（ルート直下にモジュールが並ぶ）だが、配布名は
# naRou であり、その名前空間で参照される。package-dir でリポジトリルートを naRou
# パッケージの配置として解決することで、シンボリックリンクなしで wheel に全コードが載る。
packages = [
    "naRou",
    "naRou.audio",
    "naRou.cloud_save",
    "naRou.core",
    "naRou.core.systems",
    "naRou.data",
    "naRou.data.generated",
    "naRou.data.generated.character",
    "naRou.data.generated.dungeon",
    "naRou.data.generated.faction",
    "naRou.data.generated.item",
    "naRou.data.generated.meta",
    "naRou.data.generated.monster",
    "naRou.data.generated.quest",
    "naRou.data.generated.skill",
    "naRou.data.generated.social",
    "naRou.data.generated.text",
    "naRou.data.generated_dc",
    "naRou.data.repositories",
    "naRou.data.schemas",
    "naRou.dotenv",
    "naRou.ecs",
    "naRou.ecs.components",
    "naRou.engine",
    "naRou.managers",
    "naRou.mods",
    "naRou.mods.sample_event",
    "naRou.mods.sample_sword",
    "naRou.packages",
    "naRou.packages.character",
    "naRou.packages.core",
    "naRou.packages.core.ecs",
    "naRou.packages.core.events",
    "naRou.packages.core.kernel",
    "naRou.packages.core.render",
    "naRou.packages.core.time",
    "naRou.packages.gameplay",
    "naRou.packages.meta",
    "naRou.packages.narrative",
    "naRou.packages.platform",
    "naRou.packages.social",
    "naRou.packages.world",
    "naRou.packages.world_a",
    "naRou.scripts",
    "naRou.skill_eater",
    "naRou.skill_eater.ai",
    "naRou.skill_eater.combat",
    "naRou.skill_eater.economy",
    "naRou.skill_eater.territory",
    "naRou.stubs",
    "naRou.stubs.PIL",
    "naRou.stubs.psutil",
    "naRou.stubs.pydantic",
    "naRou.stubs.pygame",
]
include-package-data = true

[tool.setuptools.package-dir]
naRou = "."

[tool.setuptools.package-data]
"naRou" = ["*.yaml", "config.yaml", "npc_behavior.yaml"]
"naRou.data" = ["*.yaml", "schemas/**/*.json"]

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/**",
    "*/tools/**",
    "*/stubs/**",
    "*/test.py",
    "*/test_bonuses.py",
    "*/venv/**",
    "*/__pycache__/**",
    "*/.tmp_main_check/**",
    "*/.worktrees/**",
    "*/build/**",
    "*/dist/**",
    "*/.git/**",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if DEBUG",
    "if settings.DEBUG",
    "if settings.TESTING",
]
ignore_errors = true
fail_under = 80
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]
extend-exclude = [
    ".tmp_main_check",
    ".tmp_bb4",
    ".worktrees",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "F401", "F403", "F405", "E501", "E722", "F841", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
strict = false
explicit_package_bases = true
exclude = [
    "src/relationships/__init__.py",
    "naRou/audio/dynamic_audio.py",
    "procedural_questigator.py",
]

[[tool.mypy.overrides]]
module = [
    "simpleaudio",
    "pygame",
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["."]
